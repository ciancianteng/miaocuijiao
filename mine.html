<!doctype html>
<html lang="zh-CN">
<head>
  <script src="/portal-early-gate.js?v=20260811authUnify2"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的账号 - MEOW CUI JIAO</title>
  <link rel="stylesheet" href="src/style.css">
  <link rel="stylesheet" href="src/boss-header.css">
  <style>
    :root{
      --bg:#05030a;
      --text:#f6f1fb;
      --muted:rgba(236,220,255,.58);
      --line:rgba(255,255,255,.08);
      --purple:#8b5cf6;
      --pink:#ff8fc5;
      --glass:rgba(22,16,34,.62);
    }
    body{
      min-height:100vh;color:var(--text);
      background:
        radial-gradient(ellipse 90% 50% at 50% -12%,rgba(140,80,220,.22),transparent 55%),
        radial-gradient(ellipse 50% 35% at 85% 30%,rgba(255,120,190,.1),transparent 60%),
        radial-gradient(ellipse 45% 30% at 10% 70%,rgba(90,60,180,.12),transparent 55%),
        linear-gradient(180deg,#0c0814 0%,#06040c 45%,#040208 100%);
    }
    /* Shrink brand on this page — keep small mark only */
    body.mcj-boss-shell header.mcj-boss-header .mcj-header-brand-en,
    body.mcj-boss-shell header.mcj-boss-header .mcj-header-brand-zh,
    .topbar .brand span{font-size:11px!important;letter-spacing:.04em;opacity:.72}
    body.mcj-boss-shell header.mcj-boss-header .mcj-header-brand-logo,
    .topbar .brand img{width:22px!important;height:22px!important;border-radius:7px!important}
    .topbar{border-bottom:1px solid rgba(255,255,255,.04)!important;background:transparent!important;padding:10px 14px!important}
    .topbar .boss-nav{display:none}
    .boss-shell{position:relative;z-index:1;width:min(400px,calc(100% - 28px));margin:0 auto;padding:12px 0 120px;box-sizing:border-box}

    .empty-card{
      border:1px solid var(--line);border-radius:28px;background:var(--glass);
      backdrop-filter:blur(18px);padding:28px 22px;box-shadow:0 20px 48px rgba(0,0,0,.4);
    }
    .empty-card h1{margin:0 0 8px;font-size:22px}
    .empty-card p{margin:0 0 16px;color:var(--muted);line-height:1.5}

    /* VIP Boss identity card */
    .vip-card{
      position:relative;overflow:hidden;margin:0 0 22px;padding:22px 18px 18px;
      border-radius:30px;border:1px solid rgba(180,130,255,.22);
      background:
        linear-gradient(145deg,rgba(150,90,255,.18) 0%,rgba(255,255,255,.04) 36%,rgba(0,0,0,.28) 100%),
        linear-gradient(180deg,rgba(42,28,68,.9),rgba(16,10,28,.92));
      box-shadow:
        0 24px 56px rgba(0,0,0,.5),
        0 0 40px rgba(130,70,220,.16),
        inset 0 1px 0 rgba(255,255,255,.12);
      backdrop-filter:blur(22px) saturate(1.2);-webkit-backdrop-filter:blur(22px) saturate(1.2);
    }
    .vip-card::before{
      content:"";position:absolute;inset:-30% -10% auto auto;width:240px;height:240px;border-radius:50%;
      background:radial-gradient(circle,rgba(170,110,255,.28),transparent 68%);pointer-events:none;
    }
    .vip-card::after{
      content:"";position:absolute;left:-20%;bottom:-45%;width:220px;height:220px;border-radius:50%;
      background:radial-gradient(circle,rgba(255,120,190,.14),transparent 70%);pointer-events:none;
    }
    .vip-top{position:relative;z-index:1;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center}
    .vip-avatar{
      width:80px;height:80px;border-radius:26px;overflow:hidden;display:grid;place-items:center;
      border:2px solid rgba(210,170,255,.35);
      background:linear-gradient(160deg,rgba(170,110,255,.35),rgba(40,20,70,.5));
      color:#f0e6ff;font-weight:900;font-size:30px;
      box-shadow:0 12px 28px rgba(0,0,0,.35),0 0 28px rgba(150,90,255,.2);
    }
    .vip-avatar img{width:100%;height:100%;object-fit:cover}
    .vip-meta{min-width:0}
    .vip-name-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .vip-meta h1{margin:0;font-size:24px;line-height:1.15;font-weight:820;letter-spacing:.01em}
    .vip-level{
      display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:999px;
      border:1px solid rgba(210,170,255,.4);background:linear-gradient(180deg,rgba(160,100,255,.28),rgba(120,70,220,.14));
      color:#efe2ff;font-size:11px;font-weight:800;letter-spacing:.06em;
      box-shadow:0 0 16px rgba(150,90,255,.18);
    }
    .vip-uid{margin:9px 0 0;color:var(--muted);font-size:12px;font-weight:600}
    .vip-uid b{
      display:inline-flex;margin-left:6px;padding:3px 9px;border-radius:999px;
      border:1px solid rgba(255,255,255,.08);background:rgba(0,0,0,.28);
      color:rgba(255,255,255,.82);font-size:11px;font-weight:700;letter-spacing:.03em;
    }
    .vip-edit{
      align-self:start;height:36px;padding:0 13px;border-radius:999px;cursor:pointer;
      border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);
      color:var(--text);font:inherit;font-size:12px;font-weight:700;
    }
    .vip-metrics{
      position:relative;z-index:1;display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px;
    }
    .vip-metric{
      padding:12px 14px;border-radius:18px;
      border:1px solid rgba(255,255,255,.07);background:rgba(0,0,0,.22);
    }
    .vip-metric span{display:block;color:var(--muted);font-size:11px;font-weight:650;letter-spacing:.04em}
    .vip-metric strong{display:block;margin-top:6px;font-size:18px;font-weight:800;letter-spacing:.01em}
    .vip-metric.coin strong{color:#efe2ff;text-shadow:0 0 18px rgba(170,110,255,.25)}

    /* Premium expandable feature cards */
    .feat-stack{display:grid;gap:14px}
    .feat{
      border-radius:28px;border:1px solid rgba(255,255,255,.07);overflow:hidden;
      background:
        linear-gradient(180deg,rgba(255,255,255,.06) 0%,rgba(255,255,255,.02) 40%,rgba(0,0,0,.16) 100%),
        rgba(20,14,32,.72);
      box-shadow:0 18px 42px rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.07);
      backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
      transition:border-color .25s ease,box-shadow .25s ease;
    }
    .feat.is-open{
      border-color:rgba(160,110,255,.28);
      box-shadow:0 22px 48px rgba(0,0,0,.48),0 0 28px rgba(130,80,220,.1),inset 0 1px 0 rgba(255,255,255,.1);
    }
    .feat-trigger{
      width:100%;display:flex;align-items:center;gap:14px;min-height:86px;padding:18px 18px;
      border:0;background:transparent;color:var(--text);font:inherit;text-align:left;cursor:pointer;
      -webkit-tap-highlight-color:transparent;
    }
    .feat-trigger:focus-visible{outline:2px solid rgba(160,110,255,.4);outline-offset:-3px}
    .feat-icon{
      flex:0 0 48px;width:48px;height:48px;border-radius:16px;display:grid;place-items:center;
      border:1px solid rgba(180,130,255,.22);
      background:linear-gradient(160deg,rgba(160,100,255,.22),rgba(255,255,255,.03));
      color:#e8d8ff;box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 0 18px rgba(140,90,220,.12);
    }
    .feat-icon svg{width:22px;height:22px;display:block}
    .feat-copy{min-width:0;flex:1;display:grid;gap:5px}
    .feat-copy strong{font-size:16px;font-weight:800;letter-spacing:.01em;line-height:1.2}
    .feat-copy small{color:var(--muted);font-size:12px;font-weight:550;line-height:1.35}
    .feat-chevron{
      flex:0 0 28px;width:28px;height:28px;border-radius:999px;display:grid;place-items:center;
      border:1px solid rgba(180,130,255,.25);background:rgba(140,90,220,.12);
      transition:transform .3s cubic-bezier(.22,.7,.25,1);
    }
    .feat-chevron::before{
      content:"";width:7px;height:7px;
      border-right:2px solid #e8d8ff;border-bottom:2px solid #e8d8ff;
      transform:rotate(45deg) translate(-1px,-1px);
    }
    .feat.is-open .feat-chevron{transform:rotate(180deg)}
    .feat-panel{
      display:grid;grid-template-rows:0fr;opacity:0;
      border-top:1px solid transparent;
      transition:grid-template-rows .32s cubic-bezier(.22,.7,.25,1),opacity .24s ease,border-color .24s ease;
    }
    .feat.is-open .feat-panel{grid-template-rows:1fr;opacity:1;border-top-color:rgba(255,255,255,.06)}
    .feat-body{overflow:hidden;padding:0 12px;display:grid;gap:4px}
    .feat.is-open .feat-body{padding:8px 12px 14px}

    .feat-link{
      display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;
      min-height:54px;padding:12px 10px;border:0;border-radius:16px;background:transparent;
      color:var(--text);font:inherit;text-decoration:none;cursor:pointer;text-align:left;
    }
    .feat-link:hover,.feat-link:active{background:rgba(255,255,255,.04)}
    .feat-link span{display:grid;gap:3px}
    .feat-link strong{font-size:14px;font-weight:750}
    .feat-link small{color:var(--muted);font-size:11px;font-weight:500}
    .feat-link::after{
      content:"";width:7px;height:7px;
      border-right:2px solid rgba(255,255,255,.4);border-bottom:2px solid rgba(255,255,255,.4);
      transform:rotate(-45deg);
    }

    #bossAccountSecurity{padding:2px 4px 8px}
    #bossAccountSecurity .mcj-account-security{margin:0!important;padding:0!important;border:0!important;background:transparent!important;border-radius:0!important}
    #bossAccountSecurity .mcj-account-security > h3{display:none}
    #bossAccountSecurity .mcj-sec-grid{display:grid;gap:0;grid-template-columns:1fr!important}
    #bossAccountSecurity .mcj-sec-grid div{
      padding:14px 10px!important;border:0!important;border-radius:0!important;background:transparent!important;
      border-bottom:1px solid var(--line)!important;
    }
    #bossAccountSecurity .mcj-sec-grid div:last-child{border-bottom:0!important}
    #bossAccountSecurity .mcj-sec-form button,
    #bossAccountSecurity .mcj-sec-actions button{
      border:1px solid rgba(255,255,255,.12)!important;background:rgba(255,255,255,.05)!important;
      color:var(--text)!important;border-radius:14px!important;min-height:46px!important;
    }
    #bossAccountSecurity .mcj-sec-link{border:0!important;background:transparent!important;width:100%;justify-content:flex-start;padding:12px!important}

    .mine-logout-wrap{margin-top:36px}
    .mine-logout{
      width:100%;min-height:48px;border-radius:16px;border:0;background:transparent;
      color:rgba(255,255,255,.38);font:inherit;font-size:13px;font-weight:650;cursor:pointer;
    }
    .mine-logout:hover{color:rgba(255,255,255,.62)}

    .boss-btn{border:1px solid rgba(255,255,255,.14);border-radius:14px;background:rgba(255,255,255,.05);color:#fff;min-height:44px;padding:10px 14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
    .boss-btn.ghost{background:transparent}
    .modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;padding:18px;z-index:40}
    .modal.open{display:flex}
    .modal-box{width:min(520px,100%);border:1px solid rgba(255,255,255,.1);border-radius:20px;background:#121016;padding:20px;box-sizing:border-box}
    .modal-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:12px}
    .modal-head h2{margin:0;font-size:18px}
    .close{width:36px;height:36px;border:1px solid rgba(255,255,255,.12);border-radius:10px;background:rgba(255,255,255,.06);color:#fff;cursor:pointer}
    .form-grid{display:grid;gap:12px}
    .form-grid label{display:grid;gap:7px;color:#ffd6e7;font-weight:700;font-size:13px}
    .form-grid input{height:44px;border:1px solid rgba(255,255,255,.12);border-radius:12px;background:rgba(0,0,0,.28);color:#fff;padding:0 12px}
    .state{margin-top:10px;color:#ffb9d6;min-height:20px}
    .review-tip{margin:0 0 14px;padding:12px 14px;border:1px solid rgba(160,110,255,.22);border-radius:18px;background:rgba(140,90,220,.1);color:#efe2ff;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
    .review-tip p{margin:0;font-size:13px;line-height:1.45}
    .review-tip .tip-actions{display:flex;gap:8px;align-items:center}
    .review-tip .tip-link{border:0;background:transparent;color:#efe2ff;font-weight:800;cursor:pointer;text-decoration:underline;padding:0;font:inherit}
    .review-tip .tip-dismiss{width:32px;height:32px;border:1px solid rgba(255,255,255,.12);border-radius:10px;background:rgba(255,255,255,.05);color:#fff;cursor:pointer}
    @media(max-width:720px){
      .boss-shell{width:calc(100% - 24px);padding:10px 0 116px}
      .vip-card{border-radius:26px;padding:20px 16px 16px}
      .feat-trigger{min-height:82px;padding:16px}
    }
  </style>
</head>
<body>
  <header class="topbar"><a class="brand" href="index.html"><img src="assets/meow-cuijiao-brand.jpg" alt="MEOW CUI JIAO"><span>MEOW CUI JIAO</span></a><nav class="boss-nav"><a href="index.html">首页</a><a href="companion-center.html">陪玩大厅</a><a href="orders.html">我的订单</a><a href="support.html?start=1">在线客服</a></nav></header>
  <main class="boss-shell" id="accountApp"></main>
  <div class="modal" id="editModal" aria-hidden="true">
    <form class="modal-box" id="profileForm">
      <div class="modal-head"><h2>编辑资料</h2><button class="close" type="button" data-close>×</button></div>
      <div class="form-grid">
        <label>头像地址<input name="avatarUrl" placeholder="https://..." autocomplete="off"></label>
        <label>昵称<input name="displayName" maxlength="40" required></label>
        <label>手机号<input name="phone" maxlength="30" autocomplete="tel"></label>
        <button class="boss-btn" type="submit">保存资料</button>
        <p class="state" id="editState"></p>
      </div>
    </form>
  </div>
  <script src="src/role-gates.js"></script>
  <script src="src/account-security.js?v=20260805acctSec1"></script>
  <script src="src/boss-header.js" defer></script>
  <script>
    (function(){
      var root=document.getElementById('accountApp');
      var modal=document.getElementById('editModal');
      var form=document.getElementById('profileForm');
      var editState=document.getElementById('editState');
      var state={loading:true,error:'',user:null,wallet:null,passwordHint:'',pendingReviewTipId:'',openAccordion:''};
      var TIP_KEY='mcjBossPendingReviewTipShown';
      function tipAlreadyShown(){try{return sessionStorage.getItem(TIP_KEY)==='1'}catch(e){return false}}
      function markTipShown(){try{sessionStorage.setItem(TIP_KEY,'1')}catch(e){}}
      async function checkPendingReviewTip(){
        if(!token()||tipAlreadyShown()||state.pendingReviewTipId)return;
        try{
          var res=await fetch('/api/orders',{headers:{Accept:'application/json',Authorization:'Bearer '+token()},cache:'no-store'});
          var body=await res.json().catch(function(){return{}});
          if(!res.ok||body.ok===false)return;
          var rows=Array.isArray(body.orders)?body.orders:[];
          var pending=rows.find(function(o){
            return !!(o&&(o.canReview||(o.status==='completed'&&!o.reviewed&&(o.companionId||(o.companion&&o.companion.id)||o.companion_id))));
          });
          if(pending&&pending.id){
            state.pendingReviewTipId=pending.id;
            markTipShown();
            paint();
          }
        }catch(e){}
      }
      function token(){try{return sessionStorage.getItem('mcjAuthAccessToken')||localStorage.getItem('mcjAuthAccessToken')||''}catch(e){return ''}}
      function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
      function date(v){if(!v)return '-';try{return new Date(v).toLocaleString('zh-CN',{hour12:false})}catch(e){return v}}
      function avatarHtml(user){var src=user&&user.avatarUrl;if(src)return '<img src="'+esc(src)+'" alt="头像">';var name=(user&&user.displayName)||'老板';return esc(name.slice(0,1)||'B')}
      function statusText(s){return {active:'正常',disabled:'停用',pending:'待审核'}[s]||s||'-'}

      function featIcon(kind){
        var icons={
          wallet:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18"/><path d="M16 14h2"/></svg>',
          team:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="3"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a3 3 0 0 1 0 5.74"/></svg>',
          orders:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M3 6h.01"/><path d="M3 12h.01"/><path d="M3 18h.01"/></svg>',
          settings:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9c.2.6.8 1 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>'
        };
        return icons[kind]||icons.orders;
      }
      function featLink(opts){
        var tag=opts.tag||'a';
        return '<'+tag+' class="feat-link" '+(opts.attrs||'')+'><span><strong>'+esc(opts.title)+'</strong><small>'+esc(opts.desc||'')+'</small></span></'+tag+'>';
      }
      function accordion(key,icon,title,summary,bodyHtml){
        var open=state.openAccordion===key;
        return '<section class="feat'+(open?' is-open':'')+'" data-mine-acc="'+esc(key)+'">'+
          '<button type="button" class="feat-trigger" data-mine-acc-toggle="'+esc(key)+'" aria-expanded="'+(open?'true':'false')+'">'+
          '<span class="feat-icon" aria-hidden="true">'+featIcon(icon)+'</span>'+
          '<span class="feat-copy"><strong>'+esc(title)+'</strong><small>'+esc(summary||'')+'</small></span>'+
          '<span class="feat-chevron" aria-hidden="true"></span></button>'+
          '<div class="feat-panel" role="region" aria-hidden="'+(open?'false':'true')+'">'+
          '<div class="feat-body">'+bodyHtml+'</div></div></section>';
      }
      function syncAccordionDom(){
        var openKey=state.openAccordion||'';
        document.querySelectorAll('[data-mine-acc]').forEach(function(sec){
          var key=sec.getAttribute('data-mine-acc')||'';
          var isOpen=key===openKey;
          sec.classList.toggle('is-open',isOpen);
          var btn=sec.querySelector('[data-mine-acc-toggle]');
          if(btn)btn.setAttribute('aria-expanded',isOpen?'true':'false');
          var panel=sec.querySelector('.feat-panel');
          if(panel)panel.setAttribute('aria-hidden',isOpen?'false':'true');
        });
      }
function paint(){
        if(!token()){root.innerHTML='<section class="empty-card"><h1>请先登录</h1><p style="color:#9ca3af">登录后可以查看账号资料、订单和在线客服。</p><a class="boss-btn" href="index.html">返回首页登录</a></section>';return}
        if(state.loading){root.innerHTML='<section class="empty-card">正在登录…</section>';return}
        if(state.error){root.innerHTML='<section class="empty-card"><h1>账号资料读取失败</h1><p style="color:#ffb9d6">'+esc(state.error)+'</p><button class="boss-btn" data-refresh>重试</button></section>';return}
        var u=state.user||{};
        var publicUid=u.bossUid||u.boss_uid||u.uid||'-';
        var wallet=state.wallet||{};
        var totalBal=wallet.totalBalance!=null?wallet.totalBalance:(wallet.balance!=null?wallet.balance:'-');
        var paidBal=wallet.paidBalance!=null?wallet.paidBalance:'-';
        var bonusBal=wallet.bonusBalance!=null?wallet.bonusBalance:'-';
        var setHint=u.hasPassword===true||u.has_password===true?'':'建议设置登录密码，便于下次邮箱+密码登录（不强制）。';
        var tipHtml=state.pendingReviewTipId
          ?('<div class="review-tip" role="status"><p>您有订单还未评价陪玩</p><div class="tip-actions"><button class="tip-link" type="button" data-open-pending-review>去评价</button><button class="tip-dismiss" type="button" data-dismiss-review-tip aria-label="关闭">×</button></div></div>')
          :'';
                var statusLabel=statusText(u.status||u.accountStatus||'active');
        var vipLevel=u.vipLevel||u.vip||u.levelLabel||u.level||'VIP1';
        var roleLabel=u.hasCompanion?'多角色':'Boss';
        root.innerHTML=tipHtml+
          '<section class="vip-card">'+
            '<div class="vip-top">'+
              '<div class="vip-avatar">'+avatarHtml(u)+'</div>'+
              '<div class="vip-meta">'+
                '<div class="vip-name-row"><h1>'+esc(u.displayName||'老板账号')+'</h1><span class="vip-level">'+esc(String(vipLevel))+'</span></div>'+
                '<p class="vip-uid">UID <b>'+esc(publicUid)+'</b></p>'+
              '</div>'+
              '<button class="vip-edit" data-edit type="button">编辑</button>'+
            '</div>'+
            '<div class="vip-metrics">'+
              '<div class="vip-metric coin"><span>喵币余额</span><strong>'+esc(totalBal)+'</strong></div>'+
              '<div class="vip-metric"><span>状态</span><strong>'+esc(statusLabel)+'</strong></div>'+
            '</div>'+
          '</section>'+
          (setHint?'<p style="margin:0 0 14px;color:#fbbf24;font-size:12px;line-height:1.45">'+esc(setHint)+'</p>':'')+
          '<div class="feat-stack">'+
          accordion('wallet','wallet','钱包收益','喵币 '+totalBal,
            featLink({tag:'a',title:'当前收益',desc:'充值喵币 '+paidBal+' · 赠送 '+bonusBal,attrs:'href="recharge.html"'})+
            featLink({tag:'a',title:'钱包流水',desc:'查看充值与消费记录',attrs:'href="recharge.html"'}) )+
          accordion('team','team','我的团队',roleLabel,
            featLink({tag:'a',title:'邀请陪玩',desc:'分享邀请，扩展团队',attrs:'href="invite.html"'})+
            featLink({tag:'a',title:'团队收益',desc:'查看团队与组队入口',attrs:'href="team-lobby.html"'}) )+
          accordion('orders','orders','我的订单','订单管理',
            featLink({tag:'a',title:'订单管理',desc:'查看与处理我的订单',attrs:'href="orders.html"'}) )+
          accordion('settings','settings','设置','账号与安全',
            '<div id="bossAccountSecurity"></div>')+
          '</div>'+
          '<div class="mine-logout-wrap"><button class="mine-logout" type="button" data-logout>退出登录</button></div>';
        if(window.MCJAccountSecurity){
          window.MCJAccountSecurity.mount('#bossAccountSecurity',u,{role:'boss',passwordHint:state.passwordHint,onUpdated:function(data){if(data&&data.user)state.user=data.user;paint();}});
        }
      }
      function paintRegister(){
        root.innerHTML='<section class="account-card"><h1>注册老板账号</h1><p style="color:#9ca3af">必须先完成邮箱验证码验证，成功后系统会自动分配老板 UID。密码至少 8 位且含字母和数字。</p><form class="form-grid" data-register-form style="margin-top:16px"><label>昵称<input name="displayName" maxlength="40" required placeholder="请输入昵称"></label><label>邮箱<div style="display:flex;gap:8px;align-items:center"><input name="email" type="email" inputmode="email" required autocomplete="email" style="flex:1"><button class="boss-btn ghost" type="button" data-mine-send-register-otp>获取验证码</button></div></label><label>邮箱验证码<div style="display:flex;gap:8px;align-items:center"><input name="otp" type="text" inputmode="numeric" maxlength="6" autocomplete="one-time-code" data-auth-code="1" placeholder="6 位验证码" style="flex:1"><button class="boss-btn ghost" type="button" data-mine-verify-register-otp>验证邮箱</button></div></label><input type="hidden" name="registerToken" value=""><p class="state" data-register-verified-hint style="color:#9ca3af">请先完成邮箱验证，验证成功后才能注册。</p><label>密码<input name="password" type="password" required minlength="8" autocomplete="new-password"></label><label>确认密码<input name="confirmPassword" type="password" required minlength="8" autocomplete="new-password"></label><button class="boss-btn" type="submit" data-register-submit disabled>注册</button><p class="state" data-register-state></p><p style="color:#9ca3af;font-size:13px">已有账号？<a href="index.html" style="color:#ffd6e7">返回登录</a></p></form></section>';
      }
async function load(){
        var params=new URLSearchParams(location.search);
        if(params.get('register')==='1'&&!token()){state.loading=false;paintRegister();return}
        state.loading=true;state.error='';paint();
        try{
          var res=await fetch('/api/auth?action=me',{headers:{Authorization:'Bearer '+token()}});
          var body=await res.json().catch(function(){return {}});
          if(!res.ok||!body.ok)throw new Error(body.message||'账号资料读取失败');
          if(!(body.user.hasBoss||body.user.role==='boss'||body.user.role==='customer'))throw new Error('当前账号不是老板角色。');
          state.user=body.user;
          state.passwordHint=body.passwordHint||'';
          var saved=window.MCJRoleGate&&window.MCJRoleGate.saveSession;
          if(saved)saved({user:body.user,accessToken:token()},true);
          try{
            var sec=await fetch('/api/auth',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token()},body:JSON.stringify({action:'account_security'})});
            var secBody=await sec.json().catch(function(){return {}});
            if(sec.ok&&secBody.ok&&secBody.user){state.user=Object.assign({},state.user,secBody.user);state.passwordHint=secBody.passwordHint||state.passwordHint;}
          }catch(e){}
          try{var wr=await fetch('/api/recharge',{headers:{Authorization:'Bearer '+token(),Accept:'application/json'}});var wb=await wr.json().catch(function(){return {}});if(wr.ok&&wb.ok)state.wallet=wb.wallet||wb.summary||null;}catch(e){state.wallet=null}
        }catch(err){
          var msg=String(err&&err.message||'账号资料读取失败');
          // Keep valid session on profile init failure — never treat as logged out.
          if(/账号初始化失败|PROFILE_INIT_FAILED|未绑定平台资料/.test(msg)){
            state.error='账号初始化失败，请刷新重试或联系客服。';
          }else if(/未登录|登录已过期|401/.test(msg) && !token()){
            state.error='请先登录';
          }else{
            state.error=msg;
          }
        }finally{state.loading=false;paint();checkPendingReviewTip()}
      }
      document.addEventListener('click',async function(e){
        var openTip=e.target.closest('[data-open-pending-review]');
        if(openTip){
          var oid=state.pendingReviewTipId;
          state.pendingReviewTipId='';
          if(oid)location.href='orders.html?openReview='+encodeURIComponent(oid);
          else location.href='orders.html?filter=completed';
          return;
        }
        if(e.target.closest('[data-dismiss-review-tip]')){state.pendingReviewTipId='';paint();return}
        var sendBtn=e.target.closest('[data-mine-send-register-otp]');
        var verifyBtn=e.target.closest('[data-mine-verify-register-otp]');
        if(!sendBtn&&!verifyBtn)return;
        var form=document.querySelector('[data-register-form]');
        if(!form)return;
        e.preventDefault();
        var box=form.querySelector('[data-register-state]');
        var hint=form.querySelector('[data-register-verified-hint]');
        var submit=form.querySelector('[data-register-submit]');
        var email=String(form.elements.email.value||'').trim().toLowerCase();
        if(!email||!/^\S+@\S+\.\S+$/.test(email)){if(box)box.textContent='请输入有效邮箱。';return}
        if(sendBtn){
          if(sendBtn.disabled)return;
          form.elements.registerToken.value='';
          if(submit)submit.disabled=true;
          if(hint)hint.textContent='请先完成邮箱验证，验证成功后才能注册。';
          sendBtn.disabled=true;var old=sendBtn.textContent;sendBtn.textContent='发送中…';
          try{
            var res=await fetch('/api/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'send_register_otp',email:email,role:'boss'})});
            var body=await res.json().catch(function(){return {}});
            if(!res.ok||!body.ok)throw new Error(body.message||'发送失败');
            var tip=body.message||'验证码已发送';if(body.devCode)tip+='（测试 '+body.devCode+'）';
            if(box)box.textContent=tip;
            var left=Number(body.retryAfterSec)||60;sendBtn.textContent=left+'s';
            var t=setInterval(function(){left-=1;if(left<=0){clearInterval(t);sendBtn.disabled=false;sendBtn.textContent=old||'获取验证码';}else sendBtn.textContent=left+'s';},1000);
          }catch(err){sendBtn.disabled=false;sendBtn.textContent=old||'获取验证码';if(box)box.textContent=err.message||'发送失败'}
          return;
        }
        if(verifyBtn){
          var code=String(form.elements.otp.value||'').trim();
          if(!/^\d{6}$/.test(code)){if(box)box.textContent='请输入 6 位邮箱验证码。';return}
          verifyBtn.disabled=true;var oldV=verifyBtn.textContent;verifyBtn.textContent='验证中…';
          try{
            var vres=await fetch('/api/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'verify_register_otp',email:email,code:code,role:'boss'})});
            var vbody=await vres.json().catch(function(){return {}});
            if(!vres.ok||!vbody.ok)throw new Error(vbody.message||'验证失败');
            form.elements.registerToken.value=vbody.registerToken||'';
            if(submit)submit.disabled=!form.elements.registerToken.value;
            if(hint)hint.textContent='邮箱已验证 · '+(vbody.emailMasked||email)+'，请设置密码并注册。';
            if(box)box.textContent=vbody.message||'邮箱已验证';
            form.elements.otp.value='';
          }catch(err){form.elements.registerToken.value='';if(submit)submit.disabled=true;if(box)box.textContent=err.message||'验证失败'}
          finally{verifyBtn.disabled=false;verifyBtn.textContent=oldV||'验证邮箱'}
        }
      });
      document.addEventListener('submit',async function(e){
        var form=e.target.closest('[data-register-form]');
        if(!form)return;
        e.preventDefault();
        var box=form.querySelector('[data-register-state]');
        var token=String(form.elements.registerToken.value||'').trim();
        var password=String(form.elements.password.value||'');
        var confirmPassword=String(form.elements.confirmPassword.value||'');
        if(!token){if(box)box.textContent='请先完成邮箱验证。';return}
        if(password!==confirmPassword){if(box)box.textContent='两次输入的密码不一致。';return}
        if(box)box.textContent='注册中...';
        try{
          var res=await fetch('/api/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'register',email:form.elements.email.value,password:password,confirmPassword:confirmPassword,displayName:form.elements.displayName.value,registerToken:token,role:'boss'})});
          var body=await res.json().catch(function(){return {}});
          if(!res.ok||!body.ok)throw new Error(body.message||'注册失败');
          var session=body.session||{};
          if(window.MCJRoleGate&&window.MCJRoleGate.saveSession)window.MCJRoleGate.saveSession(session,true);
          else if(session.accessToken){
            try{
              localStorage.setItem('mcjAuthAccessToken',session.accessToken);
              if(session.refreshToken)localStorage.setItem('mcjAuthRefreshToken',session.refreshToken);
              if(session.expiresAt)localStorage.setItem('mcjAuthExpiresAt',String(session.expiresAt));
            }catch(e){}
          }
          if(box)box.textContent=body.message||('注册成功。您的老板 UID：'+(body.bossUid||''));
          setTimeout(function(){location.href='mine.html'},800);
        }catch(err){if(box)box.textContent=err.message||'注册失败'}
      });
      document.addEventListener('click',function(e){
        
        var accToggle=e.target.closest('[data-mine-acc-toggle]');
        if(accToggle){
          var key=accToggle.getAttribute('data-mine-acc-toggle')||'';
          state.openAccordion=(state.openAccordion===key)?'':key;
          syncAccordionDom();
          return;
        }
if(e.target.closest('[data-refresh]')){load();return}
        if(e.target.closest('[data-edit]')){var u=state.user||{};form.elements.avatarUrl.value=u.avatarUrl||'';form.elements.displayName.value=u.displayName||'';form.elements.phone.value=u.phone||'';editState.textContent='';modal.classList.add('open');return}
        if(e.target.closest('[data-close]')||e.target===modal){modal.classList.remove('open');return}
        if(e.target.closest('[data-switch-portal]')){
          var portal=e.target.closest('[data-switch-portal]').getAttribute('data-switch-portal')||'companion';
          if(window.MCJRoleGate&&typeof window.MCJRoleGate.switchActivePortal==='function'){
            var sw=window.MCJRoleGate.switchActivePortal(portal);
            if(sw&&sw.ok){location.href=sw.redirect||'/companion/login/';return}
          }
          location.href='/companion/login/';
          return;
        }
        if(e.target.closest('[data-logout]')){if(window.MCJBossAuth&&window.MCJBossAuth.clearSession)window.MCJBossAuth.clearSession();if(window.MCJRoleGate){window.MCJRoleGate.logout('boss');window.MCJRoleGate.logout('customer')}['mcjAuthAccessToken','mcjAuthRefreshToken','mcjAuthExpiresAt','customerAuthToken','customerUser','mcjCurrentUser','mcjRole'].forEach(function(k){try{localStorage.removeItem(k);sessionStorage.removeItem(k)}catch(e){}});location.href='index.html';return}
      });
      form.addEventListener('submit',async function(e){
        e.preventDefault();editState.textContent='保存中...';
        try{var res=await fetch('/api/auth',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token()},body:JSON.stringify({action:'update_profile',avatarUrl:form.elements.avatarUrl.value,displayName:form.elements.displayName.value,phone:form.elements.phone.value})});var body=await res.json().catch(function(){return {}});if(!res.ok||!body.ok)throw new Error(body.message||'保存失败');state.user=body.user;if(window.MCJRoleGate&&window.MCJRoleGate.saveSession)window.MCJRoleGate.saveSession({user:body.user,accessToken:token(),refreshToken:sessionStorage.getItem('mcjAuthRefreshToken')||''},true);editState.textContent='资料已保存';setTimeout(function(){modal.classList.remove('open');paint()},450)}catch(err){editState.textContent=err.message||'保存失败'}
      });
      load();
    })();
  </script>
</body>
</html>
