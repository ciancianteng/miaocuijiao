<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>MEOW CUI JIAO · 手机版</title>
  <style>
    body.mobile-page{margin:0;min-height:100vh;background:#030204;color:#fff7fb;font-family:Inter,Arial,"Microsoft YaHei",sans-serif;overflow-x:hidden}
    .m-paws{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}.m-paws i{position:absolute;width:70px;height:56px;background:url('/assets/floating-paw-D2o7WbUV.png') center/contain no-repeat;opacity:.16;filter:drop-shadow(0 0 10px rgba(255,190,215,.36));animation:mPaw 18s linear infinite}.m-paws i:nth-child(1){left:8%;top:86%;animation-delay:-3s}.m-paws i:nth-child(2){left:66%;top:78%;animation-delay:-9s;transform:scale(.8)}.m-paws i:nth-child(3){left:24%;top:54%;animation-delay:-14s;transform:scale(.7)}.m-paws i:nth-child(4){left:78%;top:38%;animation-delay:-5s;transform:scale(.62)}@keyframes mPaw{0%{translate:0 40px;opacity:0}12%{opacity:.15}88%{opacity:.16}100%{translate:18px -85vh;opacity:0}}
    .m-shell{position:relative;z-index:1;width:min(100% - 24px,430px);margin:0 auto;padding:12px 0 96px}.m-top{height:58px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20;background:rgba(3,2,4,.86);backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,214,235,.12)}.m-logo{width:44px;height:44px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,214,235,.78);box-shadow:0 0 18px rgba(255,105,180,.34)}.m-brand{min-width:0;flex:1}.m-brand strong{display:block;font-size:13px;letter-spacing:.05em;color:#ffe4f1;text-shadow:0 0 12px rgba(255,105,180,.58);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.m-brand span{display:block;font-size:11px;color:#ffd6e7;margin-top:3px}.m-menu-btn{height:38px;border:1px solid rgba(255,214,235,.18);border-radius:999px;background:rgba(255,142,199,.10);color:#ffe4f1;font-weight:900;padding:0 12px}
    .m-cover{margin-top:14px;border:8px solid #020103;border-radius:10px;overflow:hidden;background:#020103;box-shadow:0 0 0 1px rgba(255,202,230,.22),0 18px 40px rgba(0,0,0,.46),0 0 28px rgba(255,70,170,.18)}.m-cover video{display:block;width:100%;height:auto;object-fit:contain}.m-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.m-actions button,.m-actions a{height:46px;border-radius:10px;border:1px solid rgba(255,214,235,.18);background:rgba(255,255,255,.045);color:#ffe4f1;font-weight:1000;text-decoration:none;display:flex;align-items:center;justify-content:center}.m-actions .hot{border:0;background:linear-gradient(135deg,#ffd6e7,#ff9fc8);color:#17070f}.m-section-title{display:flex;align-items:end;justify-content:space-between;margin:18px 0 10px}.m-section-title h2{margin:0;color:#ffd6e7;font-size:18px}.m-section-title span{font-size:11px;color:#bfaeba}.m-card{border:1px solid rgba(255,214,235,.13);border-radius:10px;background:rgba(255,255,255,.04);box-shadow:0 18px 42px rgba(0,0,0,.26)}
    .m-category{display:grid;gap:8px;padding:10px}.m-cat-toggle{height:46px;border:0;border-radius:8px;background:linear-gradient(135deg,rgba(255,142,199,.22),rgba(255,142,199,.07));color:#fff0f8;font-weight:1000;text-align:left;padding:0 12px;display:flex;align-items:center;justify-content:space-between}.m-cat-toggle:after{content:'›';font-size:24px;color:#ffb7d8}.m-cat-toggle.open:after{transform:rotate(90deg)}.m-list{display:none;grid-template-columns:1fr 1fr;gap:8px}.m-list.open{display:grid}.m-service{height:72px;border-radius:8px;border:1px solid rgba(255,214,235,.14);background-size:cover;background-position:center;color:#fff;text-align:left;padding:10px;font-weight:1000;text-shadow:0 0 12px #000,0 2px 8px #000;position:relative;overflow:hidden}.m-service:before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(0,0,0,.22),rgba(0,0,0,.62));z-index:0}.m-service span{position:relative;z-index:1}.m-service.all{background-image:url('/assets/all-button-bg-Dg_ujQHu.jpg')}.m-service.apex{background-image:url('/assets/apex-button-bg-B1N4xtFU.jpg')}.m-service.csgo{background-image:url('/assets/csgo-button-bg-CAR1qjLp.jpg')}.m-service.val{background-image:url('/assets/valorant-button-bg-AxHHIRx7.jpg')}.m-service.delta{background-image:url('/assets/delta-button-bg-Dt-nk9pE.jpg')}.m-service.peace{background-image:url('/assets/peace-button-bg-DlBw-1h4.jpg')}.m-service.honor{background-image:url('/assets/honor-button-bg-C-yQyNNL.jpg')}.m-service.roco{background-image:url('/assets/roco-button-bg-CyYrtOa1.jpg')}.m-service.lol{background-image:url('/assets/lol-button-bg-BGWT9f4Z.jpg')}.m-service.tft{background-image:url('/assets/tft-button-bg-VsIXvdU7.jpg')}.m-service.naraka{background-image:url('/assets/naraka-button-bg-IeNnYp75.jpg')}.m-service.box{background-image:url('/assets/lucky-button-bg-LOSWfXuE.jpg')}
    .m-guide{padding:12px;display:grid;gap:10px}.m-guide div{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start}.m-guide b{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#ffd6e7,#ff9fc8);color:#17070f;display:grid;place-items:center}.m-guide p{margin:0;color:#cdb9c5;font-size:13px;line-height:1.55}.m-float{position:fixed;right:14px;bottom:14px;z-index:50;width:76px;height:72px;border:0;border-radius:50% 50% 46% 46%;background:radial-gradient(circle at 50% 62%,#ffd6e7 0 28%,#ff9fc8 29% 54%,#ff5da2 55% 100%);color:#3a071f;font-size:12px;font-weight:1000;box-shadow:0 0 0 3px rgba(255,214,235,.22),0 14px 32px rgba(0,0,0,.42),0 0 24px rgba(255,105,180,.4)}.m-float:before{content:'';position:absolute;left:50%;top:-10px;width:16px;height:16px;border-radius:50%;background:#ffd6e7;box-shadow:-22px 8px 0 -1px #ffd6e7,22px 8px 0 -1px #ffd6e7,-11px -3px 0 -2px #ffbad6,11px -3px 0 -2px #ffbad6;transform:translateX(-50%)}
    .m-modal{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.78);display:none;align-items:end}.m-modal.show{display:flex}.m-box{width:100%;max-height:86vh;overflow:auto;border-radius:18px 18px 0 0;background:#100b11;border:1px solid rgba(255,214,235,.16);padding:18px}.m-box h2{margin:0 0 10px;color:#ffd6e7}.m-close{position:absolute;right:14px;top:10px;width:36px;height:36px;border-radius:50%;border:1px solid rgba(255,214,235,.18);background:rgba(255,255,255,.06);color:#ffe4f1;font-size:22px}.m-companions{display:grid;gap:12px}.m-companion{display:grid;grid-template-columns:92px 1fr;gap:12px;border:1px solid rgba(255,214,235,.12);border-radius:10px;background:rgba(255,255,255,.04);padding:10px}.m-photo{aspect-ratio:4/5;border-radius:8px;background:linear-gradient(180deg,rgba(255,142,199,.12),rgba(0,0,0,.2)),url('/assets/meow-cuijiao-brand-CuF7I-dn.jpg');background-size:cover;background-position:center}.m-info h3{margin:0;color:#fff}.m-info p{margin:5px 0;color:#bfaeba;font-size:12px}.m-price{display:flex;align-items:center;justify-content:space-between;margin-top:8px}.m-price strong{color:#ff9fc8;font-size:20px}.m-price button{height:32px;border:0;border-radius:8px;background:linear-gradient(135deg,#ffd6e7,#ff9fc8);color:#17070f;font-weight:1000;padding:0 10px}
  
    /* mobile-paw-service-unified */
    .m-float{width:92px!important;height:76px!important;border:0!important;border-radius:0!important;background:transparent url('/assets/floating-paw-D2o7WbUV.png') center/contain no-repeat!important;color:transparent!important;font-size:0!important;box-shadow:none!important;filter:drop-shadow(0 14px 22px rgba(0,0,0,.50)) drop-shadow(0 0 6px rgba(255,220,236,.18))!important;padding:0!important;touch-action:none;user-select:none;cursor:grab;overflow:visible!important}
    .m-float:before,.m-float:after{display:none!important;content:none!important}.m-float.dragging{cursor:grabbing;transition:none!important}
    .m-float span{position:absolute;left:50%;top:100%;transform:translate(-50%,2px);display:inline-flex;align-items:center;justify-content:center;min-width:76px;height:28px;padding:0 10px;border-radius:999px;border:1px solid rgba(255,214,235,.36);background:linear-gradient(135deg,rgba(255,246,250,.94),rgba(255,190,215,.88));color:#2a0715;font-family:'Comic Sans MS','Arial Rounded MT Bold','Microsoft YaHei',sans-serif;font-size:13px;font-weight:1000;letter-spacing:.06em;box-shadow:0 8px 18px rgba(0,0,0,.26),0 0 14px rgba(255,142,199,.26);text-shadow:0 1px 0 rgba(255,255,255,.85);white-space:nowrap;pointer-events:none}.m-float span:before{content:'';position:absolute;left:50%;top:-6px;width:10px;height:10px;background:rgba(255,246,250,.94);border-left:1px solid rgba(255,214,235,.36);border-top:1px solid rgba(255,214,235,.36);transform:translateX(-50%) rotate(45deg)}
    .m-cat-fur{position:fixed;z-index:60;width:18px;height:3px;border-radius:999px;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,246,250,.95),rgba(255,210,229,.72),rgba(255,255,255,0));pointer-events:none;filter:drop-shadow(0 0 5px rgba(255,214,235,.42));animation:mCatFurFloat .9s ease-out forwards}@keyframes mCatFurFloat{0%{opacity:0;scale:.65;translate:0 0}14%{opacity:.9}100%{opacity:0;scale:1.15;translate:var(--dx) var(--dy)}}
  .m-float span{min-width:0!important;height:auto!important;padding:0!important;border:0!important;background:transparent!important;box-shadow:none!important;color:#fff6fb!important;text-shadow:0 0 8px rgba(255,105,180,.9),0 2px 6px rgba(0,0,0,.9),0 1px 0 rgba(255,255,255,.38)!important;top:96%!important;font-size:14px!important}.m-float span:before{display:none!important;content:none!important}
    /* mobile-service-text-no-box */
  </style>
  <link rel="stylesheet" crossorigin href="/assets/style-CU5EgNCP.css">
</head>
<body class="mobile-page">
  <div class="m-paws"><i></i><i></i><i></i><i></i></div>
  <main class="m-shell">
    <header class="m-top"><img class="m-logo" src="/assets/meow-cuijiao-brand-CuF7I-dn.jpg" alt="MEOW"><div class="m-brand"><strong>MEOW CUI JIAO GAMING CLUB</strong><span>营业时间 24H</span></div><button class="m-menu-btn" id="mMenuBtn">目录</button></header>
    <section class="m-cover"><video src="/assets/homepage-cover-video-DCBvUsj7.mp4" autoplay muted loop playsinline preload="auto"></video></section>
    <section class="m-actions neon-action-row">
      <button class="neon-cat-btn custom" id="mCustom"><span>自定义订单</span><small>CUSTOM ORDER</small></button>
      <button class="neon-cat-btn join" id="mJoin"><span>我要加入</span><small>JOIN US</small></button>
      <button class="neon-cat-btn guide" id="mGuide"><span>下单教学</span><small>ORDER GUIDE</small></button>
    </section>
    <section class="m-card" id="mDirectory"><div class="m-category"><button class="m-cat-toggle open" data-toggle="play">陪玩服务</button><div class="m-list open" id="playList"><button class="m-service all" data-service="全部"><span>全部</span></button><button class="m-service apex" data-service="APEX"><span>APEX</span></button><button class="m-service csgo" data-service="CSGO"><span>CSGO</span></button><button class="m-service val" data-service="无畏契约"><span>无畏契约</span></button><button class="m-service delta" data-service="三角洲行动"><span>三角洲行动</span></button><button class="m-service peace" data-service="和平精英"><span>和平精英</span></button><button class="m-service honor" data-service="王者荣耀"><span>王者荣耀</span></button><button class="m-service roco" data-service="洛克王国"><span>洛克王国</span></button><button class="m-service lol" data-service="英雄联盟"><span>英雄联盟</span></button><button class="m-service tft" data-service="金铲铲之战"><span>金铲铲之战</span></button><button class="m-service naraka" data-service="永劫无间"><span>永劫无间</span></button><button class="m-service box" data-service="盲盒陪玩"><span>盲盒陪玩</span></button></div><button class="m-cat-toggle" data-toggle="chat">陪聊服务</button><div class="m-list" id="chatList"><button class="m-service all" data-service="语音聊天"><span>语音聊天</span></button><button class="m-service box" data-service="打字聊天"><span>打字聊天</span></button><button class="m-service val" data-service="语音条聊天"><span>语音条聊天</span></button><button class="m-service roco" data-service="挂睡"><span>挂睡</span></button><button class="m-service honor" data-service="陪看共享"><span>陪看共享</span></button></div></div></section>
    <div class="m-section-title"><h2>下单教学</h2><span>老板快速看懂</span></div><section class="m-card m-guide"><div><b>1</b><p>点目录选择「陪玩服务」或「陪聊服务」。</p></div><div><b>2</b><p>点具体游戏或服务，查看陪玩资料和价格。</p></div><div><b>3</b><p>点立即预约，或填写自定义订单。</p></div><div><b>4</b><p>右下角在线客服可以帮你确认和派单。</p></div></section>
  </main>
  <button class="m-float" id="mService" aria-label="在线客服"><span>在线客服</span></button>
  <div class="m-modal" id="mCompanionModal"><div class="m-box"><button class="m-close" data-close="mCompanionModal">×</button><h2 id="mModalTitle">陪玩资料</h2><div class="m-companions" id="mCompanionCards"></div></div></div>
  <div class="m-modal" id="mSimpleModal"><div class="m-box"><button class="m-close" data-close="mSimpleModal">×</button><h2 id="mSimpleTitle">提示</h2><p id="mSimpleText" style="color:#cdb9c5;line-height:1.7"></p></div></div>
  <script>
    function showSimple(t,txt){document.getElementById('mSimpleTitle').textContent=t;document.getElementById('mSimpleText').textContent=txt;document.getElementById('mSimpleModal').classList.add('show')}
    document.querySelectorAll('[data-close]').forEach(function(b){b.onclick=function(){document.getElementById(b.dataset.close).classList.remove('show')}});
    document.getElementById('mMenuBtn').onclick=function(){document.getElementById('mDirectory').scrollIntoView({behavior:'smooth',block:'start'})};
    document.querySelectorAll('.m-cat-toggle').forEach(function(btn){btn.onclick=function(){var id=btn.dataset.toggle==='play'?'playList':'chatList';btn.classList.toggle('open');document.getElementById(id).classList.toggle('open')}});
    var sample=['小雨','小美','阿奈','软糖','眠眠','小鹿'];
    document.querySelectorAll('.m-service').forEach(function(btn){btn.onclick=function(){var s=btn.dataset.service;document.getElementById('mModalTitle').textContent=s;document.getElementById('mCompanionCards').innerHTML=sample.slice(0,3).map(function(n,i){return '<article class="m-companion"><div class="m-photo"></div><div class="m-info"><h3>'+n+'</h3><p>'+s+' · '+(i===1?'在线':'在线')+'</p><p>匿名老板送出礼物 / 老板评语展示</p><div class="m-price"><strong>RM'+(18+i*5)+'</strong><button>立即预约</button></div></div></article>'}).join('');document.getElementById('mCompanionModal').classList.add('show')}});
    document.getElementById('mCustom').onclick=function(){showSimple('自定义订单','老板可以设置人数、时间、服务、单价 RM、性别偏好和备注。')};
    document.getElementById('mJoin').onclick=function(){showSimple('我要加入','填写昵称、申请类型、主频道、单价、照片和试音后进入后台审核。')};
    document.getElementById('mGuide').onclick=function(){document.querySelector('.m-guide').scrollIntoView({behavior:'smooth',block:'center'})};
    
    (function(){
      var btn=document.getElementById('mService');
      var x=window.innerWidth-110,y=window.innerHeight-100,vx=0,vy=0,dragging=false,lastX=0,lastY=0,lastT=0,anim=0,moved=false;
      function limits(){return {maxX:window.innerWidth-btn.offsetWidth-8,maxY:window.innerHeight-btn.offsetHeight-36}}
      function place(){var l=limits();x=Math.max(8,Math.min(l.maxX,x));y=Math.max(8,Math.min(l.maxY,y));btn.style.left=x+'px';btn.style.top=y+'px';btn.style.right='auto';btn.style.bottom='auto';}
      function fur(edge){var r=btn.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;for(var i=0;i<7;i++){var el=document.createElement('i');el.className='m-cat-fur';var spread=Math.random()*60-30;var out=edge==='left'?60:edge==='right'?-60:Math.random()*70-35;var up=edge==='bottom'?-60:edge==='top'?60:(Math.random()*60-30);el.style.left=(cx+Math.random()*26-13)+'px';el.style.top=(cy+Math.random()*24-12)+'px';el.style.setProperty('--dx',(out+spread*.3)+'px');el.style.setProperty('--dy',(up+spread)+'px');el.style.rotate=(Math.random()*120-60)+'deg';document.body.appendChild(el);setTimeout(function(n){n.remove()},950,el);}}
      function step(){if(dragging)return;var l=limits();x+=vx;y+=vy;vx*=.94;vy*=.94;if(x<=8){x=8;vx=Math.abs(vx)*.72;fur('left')}if(y<=8){y=8;vy=Math.abs(vy)*.72;fur('top')}if(x>=l.maxX){x=l.maxX;vx=-Math.abs(vx)*.72;fur('right')}if(y>=l.maxY){y=l.maxY;vy=-Math.abs(vy)*.72;fur('bottom')}place();if(Math.abs(vx)+Math.abs(vy)>.18)anim=requestAnimationFrame(step);else{vx=0;vy=0;}}
      place();
      btn.addEventListener('pointerdown',function(e){dragging=true;moved=false;cancelAnimationFrame(anim);btn.classList.add('dragging');btn.setPointerCapture&&btn.setPointerCapture(e.pointerId);lastX=e.clientX;lastY=e.clientY;lastT=Date.now();});
      btn.addEventListener('pointermove',function(e){if(!dragging)return;var now=Date.now(),dt=Math.max(16,now-lastT),dx=e.clientX-lastX,dy=e.clientY-lastY;if(Math.abs(dx)+Math.abs(dy)>2)moved=true;x+=dx;y+=dy;vx=dx/dt*16;vy=dy/dt*16;lastX=e.clientX;lastY=e.clientY;lastT=now;place();});
      btn.addEventListener('pointerup',function(e){if(!dragging)return;dragging=false;btn.classList.remove('dragging');if(moved){btn.dataset.justDragged='1';vx*=1.55;vy*=1.55;anim=requestAnimationFrame(step);setTimeout(function(){btn.dataset.justDragged=''},120);}});
      btn.addEventListener('click',function(e){if(btn.dataset.justDragged==='1'){e.preventDefault();btn.dataset.justDragged='';return;}showSimple('在线客服','客服会帮老板确认需求、生成订单和安排派单。')});
      window.addEventListener('resize',place);
    })();
  </script>
</body>
</html>
