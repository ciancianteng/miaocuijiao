22px;text-align:center;color:#9ca3af}.order-alert{border:1px solid rgba(255,143,197,.28);border-radius:14px;background:rgba(255,143,197,.08);padding:16px;color:#ffd6e8}.order-alert .order-btn{margin-top:12px}.order-skel{display:grid;gap:10px}.order-skel-card{border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:14px;background:rgba(255,255,255,.03)}.order-skel-line{height:12px;border-radius:8px;margin:8px 0;background:linear-gradient(90deg,rgba(255,255,255,.05),rgba(255,255,255,.12),rgba(255,255,255,.05));background-size:200% 100%;animation:orderShimmer 1.2s linear infinite}.order-skel-line.lg{height:18px;width:42%}.order-sync{margin:0 0 10px;color:#9ca3af;font-size:12px}@keyframes orderShimmer{0%{background-position:100% 0}100%{background-position:-100% 0}}    .modal{position:fixed;inset:0;background:rgba(0,0,0,.68);display:none;align-items:center;justify-content:center;padding:18px;z-index:40}

  <script>
    (function(){
      var root=document.getElementById('ordersApp'),modal=document.getElementById('detailModal'),detailBody=document.getElementById('detailBody'),detailFooter=document.getElementById('detailFooter');
      var CACHE_KEY='mcjBossOrdersCache';
      var POLL_MS=20000;
      var abortCtrl=null;
      var loadGen=0;
      var pollTimer=null;
      var state={loading:true,error:'',orders:[],filter:(function(){var f=new URLSearchParams(location.search).get('filter')||'all';var ok=['all','awaiting_payment','waiting_companion','arranging','boss_confirm','active','completed','after_sale','cancelled'];return ok.indexOf(f)>=0?f:'all'})(),fromCache:false,syncing:false};
      var tabs=[['all','全部'],['awaiting_payment','待付款'],['waiting_companion','待陪玩确认'],['arranging','待接单'],['boss_confirm','选择陪玩中'],['active','进行中'],['completed','已完成'],['after_sale','售后'],['cancelled','已取消']];
      var statusText=(window.MCJOrderStatus&&window.MCJOrderStatus.LABELS)||{awaiting_payment:'待付款',pending:'待接单',claimed:'待陪玩确认',waiting_boss_confirm:'选择陪玩中',confirmed:'待开始',in_progress:'进行中',completed:'已完成',reviewed:'已评价',cancelled:'已取消',refund_requested:'售后',refunded:'已退款'};
      function token(){return localStorage.getItem('mcjAuthAccessToken')||sessionStorage.getItem('mcjAuthAccessToken')||''}
      function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
      function money(v){if(window.MCJCurrency)return window.MCJCurrency.formatPlain(v);var n=Number(v||0);return (Number.isFinite(n)?n:0).toFixed(2).replace(/\.00$/,'')+' 猫粮'}
      function moneyEmoji(v){if(window.MCJCurrency)return window.MCJCurrency.formatAmount(v);return '🐱 '+money(v)}
      function date(v){if(!v)return '-';try{return new Date(v).toLocaleString('zh-CN',{hour12:false})}catch(e){return v}}
      function orderLabel(o){
        if(o.reviewed||o.status==='reviewed')return '已评价';
        if(o.status==='in_progress'&&o.completionPending)return '陪玩已完成，待确认';
        return o.statusText||statusText[o.status]||o.status||'-';
      }
      function canReview(o){return !!(o.canReview||(o.status==='completed'&&!o.reviewed&&(o.companionId||(o.companion&&o.companion.id))))}
      function statusReason(o){
        var s=String(o.status||'');
        var note=String(o.note||o.cancelReason||o.cancel_reason||o.bossHint||'');
        if(o.bossHint)return o.bossHint;
        if(s==='awaiting_payment')return '待付款：请先完成支付，支付成功后再进入陪玩确认';
        if(s==='pending')return '待接单：等待陪玩抢单或客服安排';
        if(s==='waiting_boss_confirm')return '选择陪玩中：有陪玩抢单，请选择其中一位';
        if(s==='confirmed')return '待开始：陪玩已确认，等待开始服务';
        if(s==='in_progress'&&o.completionPending)return '陪玩已完成服务，请确认订单';
        if(s==='in_progress')return '进行中';
        if(s==='claimed')return '待陪玩确认：订单已付款，正在等待陪玩确认接单';
        if(s==='completed')return canReview(o)?'服务已完成，可立即评价':'服务已完成';
        if(s==='reviewed'||o.reviewed)return '已评价';
        if(s==='cancelled')return '订单已取消';
        if(s==='refund_requested')return '售后处理中，请联系客服';
        if(s==='refunded')return '已退款';
        return '请查看详情了解下一步';
      }
      function visibleOrders(){return state.orders.filter(function(o){if(state.filter==='all')return true;if(state.filter==='waiting_companion')return o.status==='claimed';if(state.filter==='arranging')return o.status==='pending';if(state.filter==='boss_confirm')return o.status==='waiting_boss_confirm';if(state.filter==='active')return o.status==='confirmed'||o.status==='in_progress';if(state.filter==='after_sale')return o.status==='refund_requested'||o.status==='refunded';if(state.filter==='completed')return o.status==='completed'||o.status==='reviewed'||o.reviewed;return o.status===state.filter})}
      function skeletonHtml(){return '<div class="order-skel" aria-busy="true">'+[0,1,2].map(function(){return '<div class="order-skel-card"><div class="order-skel-line lg"></div><div class="order-skel-line"></div><div class="order-skel-line"></div></div>'}).join('')+'</div><p class="order-empty">正在读取订单…</p>'}
      function failHtml(){return '<div class="order-alert"><strong>订单加载失败，请重试</strong><p style="margin:8px 0 0;color:#ffd6e8">'+esc(state.error||'请检查网络后重试')+'</p><button class="order-btn primary" type="button" data-refresh>重新加载</button></div>'}
      function paint(){root.innerHTML='<section class="orders-head"><div><h1>我的订单</h1><p>只显示当前老板账号的真实订单。</p></div><button class="order-btn" data-refresh type="button">刷新</button></section><div class="tabs">'+tabs.map(function(t){return '<button class="tab '+(state.filter===t[0]?'active':'')+'" type="button" data-filter="'+t[0]+'">'+t[1]+'</button>'}).join('')+'</div>'+bodyHtml()}
      function bodyHtml(){
        if(!token())return '<div class="order-alert">请先登录后查看我的订单。</div>';
        if(state.error&&!state.orders.length)return failHtml();
        if(state.loading&&!state.orders.length)return skeletonHtml();
        var sync=state.syncing||(state.loading&&state.orders.length)?'<p class="order-sync">'+(state.fromCache?'已显示缓存，正在更新…':'正在同步最新订单…')+'</p>':'';
        var rows=visibleOrders();
        return sync+'<section class="order-list" aria-label="订单列表">'+(rows.length?rows.map(card).join(''):'<div class="order-empty"><strong>暂无订单</strong><p>下单成功后，订单会出现在这里。</p></div>')+'</section>';
      }
      function companionName(o){return (o.companion&&(o.companion.display_name||o.companion.email))||o.companionName||o.companion_name||'待安排'}
      function serviceName(o){return o.customerService&&(o.customerService.display_name||o.customerService.email)||'待接入'}
      function bossProfile(){
        try{
          var u=JSON.parse(localStorage.getItem('customerUser')||sessionStorage.getItem('customerUser')||'{}')||{};
          return {
            name:u.displayName||u.display_name||u.nickname||u.email||'当前老板',
            uid:u.bossUid||u.boss_uid||u.id||'-',
            email:u.email||'-'
          };
        }catch(e){return {name:'当前老板',uid:'-',email:'-'}}
      }
      function canCancelOrder(o){
        var s=String(o.status||'');
        return ['awaiting_payment','pending','claimed','waiting_boss_confirm','confirmed'].indexOf(s)>=0;
      }
      function timelineHtml(o){
        var steps=['已付款','待接单','选择陪玩中','待陪玩确认','进行中','已完成'];
        var s=String(o.status||'');
        var idx=-1;
        if(s==='pending')idx=1;
        else if(s==='waiting_boss_confirm')idx=2;
        else if(s==='claimed')idx=3;
        else if(s==='confirmed'||s==='in_progress')idx=4;
        else if(s==='completed'||s==='reviewed'||o.reviewed)idx=5;
        else if(s==='refund_requested'||s==='refunded')idx=4;
        return '<div class="od-module"><h3>订单进度</h3><div class="od-timeline" role="list">'+steps.map(function(label,i){
          var cls='od-step';
          if(idx>=0&&i<idx)cls+=' done';
          else if(idx>=0&&i===idx)cls+=' current'+(idx===5?' done':'');
          return '<div class="'+cls+'" role="listitem"><span class="od-dot" aria-hidden="true"></span><span class="od-step-label">'+esc(label)+'</span></div>';
        }).join('')+'</div></div>';
      }
      function field(label,value,wide){
        return '<div class="od-field'+(wide?' wide':'')+'"><span>'+esc(label)+'</span><strong>'+value+'</strong></div>';
      }
      function actions(o){
        var out=['<button class="order-btn" data-detail="'+esc(o.id)+'" type="button">查看详情</button>'];
        var s=String(o.status||'');
        if(s==='awaiting_payment'){
          out.push('<a class="order-btn primary" href="payment-confirm.html?order='+encodeURIComponent(o.id)+'">立即去支付</a>');
          out.push('<a class="order-btn" href="support.html?order='+encodeURIComponent(o.id)+'">联系客服</a>');
        }else if(s==='claimed'){
          out.push('<a class="order-btn primary" href="support.html?order='+encodeURIComponent(o.id)+'">联系客服</a>');
          out.push('<button class="order-btn is-disabled" type="button" disabled aria-disabled="true">待陪玩确认</button>');
        }else if(s==='pending'){
          out.push('<a class="order-btn primary" href="support.html?order='+encodeURIComponent(o.id)+'">联系客服</a>');
          out.push('<button class="order-btn is-disabled" type="button" disabled aria-disabled="true">待接单</button>');
        }else if(s==='waiting_boss_confirm'){
          out.push('<button class="order-btn primary" data-detail="'+esc(o.id)+'" type="button">选择陪玩</button>');
        }else if(s==='confirmed'){
          out.push('<a class="order-btn primary" href="support.html?order='+encodeURIComponent(o.id)+'">联系客服</a>');
          out.push('<button class="order-btn is-disabled" type="button" disabled aria-disabled="true">待开始</button>');
        }else if(s==='in_progress'){
          if(o.completionPending){
            out.push('<button class="order-btn primary" data-action="confirm_completion" data-id="'+esc(o.id)+'">确认完成</button>');
            out.push('<button class="order-btn" data-action="request_refund" data-id="'+esc(o.id)+'">申请售后</button>');
          }else{
            out.push('<a class="order-btn primary" href="support.html?order='+encodeURIComponent(o.id)+'">联系客服</a>');
          }
        }else if(canReview(o)){
          out.push('<button class="order-btn primary" data-detail="'+esc(o.id)+'" data-open-review="1" type="button">立即评价</button>');
        }else if(s==='cancelled'){
          out.push('<button class="order-btn is-disabled" type="button" disabled aria-disabled="true">已取消</button>');
        }
        return out.join('')+'<p class="order-hint">'+esc(statusReason(o))+'</p>';
      }
      function card(o){var gc=Number(o.grabCount!=null?o.grabCount:(o.grabs&&o.grabs.length)||0)||0;var grabHint=(o.status==='pending'||o.status==='waiting_boss_confirm')?('<div><span>抢单人数</span><strong>已有 '+gc+' 位陪玩抢单</strong></div>'):'';return '<article class="order-card" data-order-id="'+esc(o.id)+'"><header><div><h3>'+esc(o.orderNo||o.order_no||o.id)+'</h3><p>'+esc(o.createdAt?date(o.createdAt):'-')+'</p></div><span class="order-status">'+esc(orderLabel(o))+'</span></header><div class="order-grid"><div><span>游戏/服务</span><strong title="'+esc(o.serviceType||o.game||'-')+'">'+esc(o.serviceType||o.game||'-')+'</strong></div><div><span>陪玩昵称</span><strong title="'+esc(companionName(o))+'">'+esc(companionName(o))+'</strong></div><div><span>消费</span><strong>'+moneyEmoji(o.totalAmount||o.amount)+'</strong></div><div><span>当前状态</span><strong>'+esc(orderLabel(o))+'</strong></div>'+grabHint+'<div><span>创建时间</span><strong>'+esc(date(o.createdAt))+'</strong></div><div class="order-actions">'+actions(o)+'</div></div></article>'}
      function detail(o,openReview){
        var boss=bossProfile();
        var left=
          '<div class="od-col">'+
            '<div class="od-module"><h3>订单信息</h3><div class="od-fields">'+
              field('订单编号',esc(o.orderNo||o.order_no||o.id))+
              field('订单状态',esc(orderLabel(o)))+
              field('付款状态',esc(o.paymentStatus||(o.status==='awaiting_payment'?'待付款':'已付款')))+
              field('接单状态',esc(o.acceptStatus||orderLabel(o)))+
              field('创建时间',esc(date(o.createdAt)))+
              field('实付猫粮',esc(money(o.paidCatFood||o.totalAmount||o.amount)))+
              field('当前说明',esc(statusReason(o)),true)+
            '</div></div>'+
            '<div class="od-module"><h3>老板信息</h3><div class="od-fields">'+
              field('老板昵称',esc(boss.name))+
              field('老板 UID',esc(boss.uid))+
              field('账号',esc(boss.email))+
              field('老板备注',esc(o.bossNotes||o.notes||'-'),true)+
            '</div></div>'+
            '<div class="od-module"><h3>陪玩信息</h3><div class="od-fields">'+
              field('陪玩昵称',esc(companionName(o)))+
              field('陪玩 ID',esc(o.companionId||o.companion_id||'-'))+
            '</div></div>'+
            '<div class="od-module"><h3>服务信息</h3><div class="od-fields">'+
              field('游戏/服务',esc(o.serviceType||o.serviceName||o.game||o.title||'-'))+
              field('游戏 ID',esc(o.gameId||o.game_id||'-'))+
              field('时长',esc((o.hours!=null?o.hours:'-')+' 小时'))+
              field('单价',esc(money(o.unitPrice)+'/小时'))+
              field('负责客服',esc(serviceName(o)))+
              field('支付方式',esc(o.paymentMethod||o.payment_method||'-'))+
            '</div></div>'+
          '</div>';
        var right=
          '<div class="od-col">'+
            timelineHtml(o)+
            '<div class="od-module od-extra"><h3>当前处理</h3>'+statusPanelInner(o,openReview)+'</div>'+
          '</div>';
        detailBody.innerHTML='<div class="od-layout">'+left+right+'</div>';
        var footer=
          '<a class="order-btn" href="support.html?order='+encodeURIComponent(o.id)+'">联系客服</a>'+
          '<button class="order-btn" type="button" data-close>返回</button>';
        if(canCancelOrder(o)){
          footer+='<button class="order-btn" type="button" data-action="cancel_order" data-id="'+esc(o.id)+'">取消订单</button>';
        }
        if(detailFooter)detailFooter.innerHTML=footer;
        modal.classList.add('open');
        modal.setAttribute('aria-hidden','false');
      }
      function statusPanelInner(o,openReview){
        var html='';
        if(o.status==='awaiting_payment'){
          html='<div class="status-panel"><p>订单金额：'+moneyEmoji(o.totalAmount||o.amount)+'</p><p>支付方式：'+esc(o.paymentMethod||o.payment_method||'待确认')+'</p><p class="order-hint">下一步：完成支付，支付成功后进入“等待陪玩确认”</p><div class="status-actions"><a class="order-btn primary" href="payment-confirm.html?order='+encodeURIComponent(o.id)+'">立即去支付</a></div></div>';
        }else if(o.status==='claimed'){
          html='<div class="status-panel"><p>付款状态：已付款</p><p>接单状态：等待陪玩确认</p><p>陪玩：'+esc(companionName(o))+'</p><p class="order-hint">订单已支付，正在等待陪玩确认接单</p></div>';
        }else if(o.status==='pending'){
          var gcPending=Number(o.grabCount!=null?o.grabCount:(o.grabs&&o.grabs.length)||0)||0;
          html='<div class="status-panel"><p>'+esc(statusReason(o))+'</p><p>已有 <strong>'+gcPending+'</strong> 位陪玩抢单。订单在抢单大厅开放中。</p>'+(gcPending?'<p class="order-hint">可打开详情查看抢单陪玩并提交意向。</p><div class="status-actions"><button class="order-btn primary" data-detail="'+esc(o.id)+'" type="button">查看抢单陪玩</button></div>':'')+'</div>';
        }else if(o.status==='waiting_boss_confirm'){
          var grabs=o.grabs||[];
          var intentId=(o.bossIntent&&o.bossIntent.companionId)||o.preferredCompanionId||'';
          html='<div class="status-panel"><h4 style="margin:0 0 8px">抢单陪玩（已有 '+grabs.length+' 位）</h4><p class="order-hint">选择仅为老板意向，最终由客服确认指定。</p>'+(intentId?'<p style="color:#60a5fa">已提交意向，等待客服确认指定。</p>':'')+(grabs.length?grabs.map(function(g){var c=g.companion||{};var name=c.nickname||'陪玩';var preferred=!!(g.bossPreferred||intentId===(g.companionId||c.id));var avatar=c.avatarUrl||c.cardImageUrl?'<img class="companion-avatar" src="'+esc(c.avatarUrl||c.cardImageUrl)+'" alt="">':'<div class="companion-avatar">'+esc(name.slice(0,1))+'</div>';return '<div class="companion-pick" style="margin-bottom:10px">'+avatar+'<div><strong>'+esc(name)+(preferred?' · 已选意向':'')+'</strong><p>等级：'+esc(c.level||'-')+' · 在线：'+esc(c.onlineStatusLabel||c.onlineStatus||'-')+' · 单价：'+money(c.price||o.unitPrice)+'</p><p>主接：'+esc(c.mainGame||o.game||'-')+' · 评分：'+esc(c.rating||'-')+' · 完成单：'+esc(c.completedOrders||0)+'</p><p>标签：'+esc(c.tags||'-')+'</p>'+(c.voiceUrl?'<p><a href="'+esc(c.voiceUrl)+'" target="_blank" rel="noopener">语音试听</a></p>':'')+'<div class="status-actions"><button class="order-btn primary" data-action="confirm_companion" data-id="'+esc(o.id)+'" data-companion-id="'+esc(g.companionId||c.id||'')+'">'+(preferred?'已选意向':'想要这位')+'</button><a class="order-btn" href="player.html?id='+encodeURIComponent(g.companionId||'')+'">陪玩详情</a></div></div></div>'}).join(''):'<p class="order-hint">暂无陪玩抢单，请稍候刷新</p>')+'</div>';
        }else if(o.status==='confirmed'){
          html='<div class="status-panel"><p>当前陪玩：'+esc(companionName(o))+'</p><p>付款状态：已付款</p><p>接单状态：已接单待开始</p><p class="order-hint">陪玩已确认接单</p><div class="status-actions"><button class="order-btn" data-action="request_refund" data-id="'+esc(o.id)+'">申请售后</button></div></div>';
        }else if(o.status==='in_progress'){
          html='<div class="status-panel"><p>当前陪玩：'+esc(companionName(o))+'</p><p>开始时间：'+esc(date(o.startedAt||o.started_at))+'</p><p>订单时长：'+esc(o.hours||'-')+' 小时</p><p class="order-hint">'+(o.completionPending?'陪玩已完成服务，请确认订单。':'服务进行中')+'</p><div class="status-actions">'+(o.completionPending?'<button class="order-btn primary" data-action="confirm_completion" data-id="'+esc(o.id)+'">确认完成</button><button class="order-btn" data-action="request_refund" data-id="'+esc(o.id)+'">申请售后</button>':'<button class="order-btn" data-action="request_refund" data-id="'+esc(o.id)+'">申请售后</button>')+'</div></div>';
        }else if(o.status==='completed'||o.status==='reviewed'||o.reviewed){
          html='<div class="status-panel"><p>完成时间：'+esc(date(o.completedAt||o.completed_at))+'</p>';
          if(o.reviewed||o.status==='reviewed'){
            html+='<p>评分：'+esc('★★★★★'.slice(0,Number(o.reviewRating||0)||0)+(o.reviewRating?(' '+o.reviewRating+' 星'):'已评价'))+'</p><p>评价：'+esc(o.reviewContent||'-')+'</p>';
          }else{
            html+='<div class="status-actions"><button class="order-btn primary" type="button" data-show-review="'+esc(o.id)+'">立即评价</button></div>';
            if(openReview){
              html+='<div data-review-form="'+esc(o.id)+'" style="display:grid;gap:10px;margin-top:10px"><label>评分<select name="rating"><option value="5">★★★★★</option><option value="4">★★★★</option><option value="3">★★★</option><option value="2">★★</option><option value="1">★</option></select></label><label>文字评价<textarea name="content" rows="3" maxlength="500" placeholder="写下你的评价"></textarea></label><button class="order-btn primary" type="button" data-submit-review="'+esc(o.id)+'">提交</button></div>';
            }
          }
          html+='</div>';
        }else if(o.status==='refund_requested'||o.status==='refunded'){
          html='<div class="status-panel"><p>售后类型：退款申请 / 投诉 / 补单</p><p>处理进度：'+esc(o.status==='refunded'?'已处理':'客服处理中')+'</p><p>客服回复：请在在线客服中查看最新回复。</p></div>';
        }else if(o.status==='cancelled'){
          html='<div class="status-panel"><p>取消原因：'+esc(o.cancelReason||o.cancel_reason||'订单已取消')+'</p><p>取消时间：'+esc(date(o.cancelledAt||o.cancelled_at))+'</p></div>';
        }else{
          html='<div class="status-panel"><p>'+esc(statusReason(o))+'</p></div>';
        }
        return html;
      }
      function statusSection(o,openReview){return statusPanelInner(o,openReview)}
      function readCache(){try{var raw=localStorage.getItem(CACHE_KEY);if(!raw)return null;var data=JSON.parse(raw);return Array.isArray(data)?data:null}catch(e){return null}}
      function writeCache(rows){try{localStorage.setItem(CACHE_KEY,JSON.stringify(rows||[]))}catch(e){}}
      function isRealLoadFailure(err,res){
        if(res&&res.status>=500)return true;
        if(res&&(res.status===0||res.status===408||res.status===504))return true;
        var msg=String((err&&err.message)||'');
        if(/Failed to fetch|NetworkError|network|TypeError/i.test(msg))return true;
        if(err&&err.name==='TypeError')return true;
        return !!(res&&!res.ok&&res.status>=500);
      }
      async function load(opts){
        opts=opts||{};
        if(!token()){state.loading=false;state.error='';state.orders=[];paint();return}
        var gen=++loadGen;
        if(abortCtrl)abortCtrl.abort();
        abortCtrl=typeof AbortController!=='undefined'?new AbortController():null;
        var cached=readCache();
        if(cached&&cached.length&&!state.orders.length){state.orders=cached;state.fromCache=true;state.loading=false;state.syncing=true;state.error='';paint()}
        else if(!opts.silent){state.loading=!state.orders.length;state.syncing=!!state.orders.length;state.error='';paint()}
        else{state.syncing=true;state.error=''}
        try{
          var res=await fetch('/api/orders',{headers:{Accept:'application/json',Authorization:'Bearer '+token()},cache:'no-store',signal:abortCtrl?abortCtrl.signal:undefined});
          var body=await res.json().catch(function(){return {}});
          if(gen!==loadGen)return;
          if(res.ok&&body.ok!==false){
            state.orders=Array.isArray(body.orders)?body.orders:[];
            state.fromCache=false;state.error='';state.loading=false;state.syncing=false;
            writeCache(state.orders);
            paint();
            var focusId=new URLSearchParams(location.search).get('id')||'';
            if(focusId&&!opts.silent){var el=document.querySelector('[data-order-id="'+String(focusId).replace(/"/g,'')+'"]');if(el)el.scrollIntoView({behavior:'smooth',block:'center'})}
            return;
          }
          // Failed response: only hard-fail UI for 5xx / network-class statuses.
          var msg=body.message||('订单读取失败 (HTTP '+res.status+')');
          state.loading=false;state.syncing=false;
          if(!state.orders.length){
            if(res.status===401||res.status===403){state.error=msg;paint();return}
            if(res.status>=500||res.status===0||res.status===408||res.status===504||isRealLoadFailure(null,res)){
              state.error=msg||'订单加载失败，请重试';paint();return;
            }
            // Other non-OK without prior cache: still surface retry (real API failure), not fake rows.
            state.error=msg||'订单加载失败，请重试';paint();
            return;
          }
          paint();
        }catch(err){
          if(gen!==loadGen)return;
          // Aborted because a newer load() started — never treat as failure.
          if(err&&err.name==='AbortError')return;
          state.loading=false;state.syncing=false;
          if(!state.orders.length){
            state.error=isRealLoadFailure(err,null)?(err.message||'订单加载失败，请重试'):'订单加载失败，请重试';
            paint();
          }else paint();
        }
      }
      async function submit(action,id,extra){try{var payload=Object.assign({action:action,id:id},extra||{});if(action==='confirm_companion'||action==='confirm_completion'){if(!confirm(action==='confirm_completion'?'确认本次服务已经完成吗？':'提交对该陪玩的意向？最终仍由客服确认指定，不会直接锁单。'))return}var res=await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token()},body:JSON.stringify(payload)});var body=await res.json().catch(function(){return {}});if(!res.ok||body.ok===false)throw new Error(body.message||'操作失败');await load()}catch(err){alert(err.message||'操作失败')}}
      async function submitReview(id){var box=detailBody.querySelector('[data-review-form="'+id+'"]');if(!box)return;var rating=box.querySelector('[name="rating"]').value;var content=box.querySelector('[name="content"]').value;try{var res=await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token()},body:JSON.stringify({action:'submit_review',id:id,rating:Number(rating),content:content})});var body=await res.json().catch(function(){return {}});if(!res.ok||body.ok===false)throw new Error(body.message||'评价失败');await load();var o=state.orders.find(function(x){return x.id===id});if(o)detail(o);else modal.classList.remove('open');alert(body.message||'评价已提交')}catch(err){alert(err.message||'评价失败')}}
      document.addEventListener('click',function(e){var f=e.target.closest('[data-filter]');if(f){state.filter=f.dataset.filter;paint();return}if(e.target.closest('[data-refresh]')){load();return}var d=e.target.closest('[data-detail]');if(d){(async function(){var o=state.orders.find(function(x){return x.id===d.dataset.detail});if(!o)return;if((o.status==='waiting_boss_confirm'||o.status==='pending')&&!(o.grabs&&o.grabs.length)){try{var res=await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token()},body:JSON.stringify({action:'list_grabs',id:o.id})});var body=await res.json().catch(function(){return{}});if(res.ok&&body.ok!==false&&Array.isArray(body.grabs)){o.grabs=body.grabs;var idx=state.orders.findIndex(function(x){return x.id===o.id});if(idx>=0)state.orders[idx]=o}}catch(err){}}detail(o,d.getAttribute('data-open-review')==='1'||canReview(o))})();return}var showRev=e.target.closest('[data-show-review]');if(showRev){var o2=state.orders.find(function(x){return x.id===showRev.getAttribute('data-show-review')});if(o2)detail(o2,true);return}var sr=e.target.closest('[data-submit-review]');if(sr){submitReview(sr.getAttribute('data-submit-review'));return}var a=e.target.closest('[data-action]');if(a){submit(a.dataset.action,a.dataset.id,{companion_id:a.getAttribute('data-companion-id')||''});return}if(e.target.closest('[data-close]')||e.target===modal){modal.classList.remove('open');modal.setAttribute('aria-hidden','true');return}if(e.target.closest('[data-logout]')){if(window.MCJRoleGate){window.MCJRoleGate.logout('boss');window.MCJRoleGate.logout('customer')}localStorage.removeItem('mcjAuthAccessToken');localStorage.removeItem('mcjAuthRefreshToken');sessionStorage.removeItem('mcjAuthAccessToken');sessionStorage.removeItem('mcjAuthRefreshToken');location.href='index.html';return}});
      document.addEventListener('visibilitychange',function(){if(!document.hidden)load({silent:true})});
      window.addEventListener('pagehide',function(){if(abortCtrl)abortCtrl.abort();if(pollTimer)clearInterval(pollTimer)});
      var boot=readCache();
      if(boot&&boot.length){state.orders=boot;state.fromCache=true;state.loading=false;state.syncing=true}
      paint();
      load();
      pollTimer=setInterval(function(){if(!document.hidden)load({silent:true})},POLL_MS);
    })();
  </script>
