<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>喵管家 Logo 方案预览</title>
  <style>
    body{margin:0;font-family:"Segoe UI","Microsoft YaHei",sans-serif;background:#0a0a0c;color:#f5f5f7;padding:28px 16px 64px}
    h1{margin:0 0 8px;font-size:26px}.sub{color:#9a9198;margin:0 0 22px;line-height:1.6}
    .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;max-width:1180px;margin:0 auto}
    @media(max-width:980px){.grid{grid-template-columns:1fr}}
    .card{background:#111;border:1px solid rgba(255,214,232,.22);border-radius:22px;padding:20px}
    .hero{display:grid;place-items:center;height:160px;border-radius:16px;background:#111;border:1px solid rgba(255,255,255,.06);margin-bottom:14px}
    .hero img{width:104px;height:104px}h2{margin:0 0 6px;font-size:18px}p{margin:0 0 14px;color:#9a9198;font-size:13px;line-height:1.65}
    .sizes{display:flex;gap:12px;align-items:end;margin-bottom:14px}.size{display:grid;gap:4px;justify-items:center;font-size:11px;color:#9a9198}
    .btn{width:56px;height:56px;border-radius:18px;border:1px solid rgba(255,214,232,.28);background:rgba(17,17,17,.72);display:grid;place-items:center}
    .btn img{width:30px;height:30px}.note{max-width:1180px;margin:20px auto 0;color:#9a9198;font-size:13px;line-height:1.7}
  </style>
</head>
<body>
  <div style="max-width:1180px;margin:0 auto 16px">
    <h1>喵管家品牌 Logo · 三套方案</h1>
    <p class="sub">全部从零重绘。确认前不会替换全站。请在聊天回复 A / B / C。</p>
  </div>
  <div class="grid">
    <article class="card">
      <div class="hero"><img src="scheme-a-continuum.svg" alt="A"></div>
      <h2>方案 A · Continuum</h2>
      <p>圆脸极简，最接近 Apple / OpenAI 符号感。</p>
      <div class="sizes">
        <div class="size"><img src="scheme-a-continuum.svg" width="16" height="16" alt="">16</div>
        <div class="size"><img src="scheme-a-continuum.svg" width="24" height="24" alt="">24</div>
        <div class="size"><img src="scheme-a-continuum.svg" width="32" height="32" alt="">32</div>
      </div>
      <div class="btn"><img src="scheme-a-mark.svg" alt=""></div>
    </article>
    <article class="card">
      <div class="hero"><img src="scheme-b-signal.svg" alt="B"></div>
      <h2>方案 B · Signal</h2>
      <p>耳脸一体轮廓，favicon / App 图标识别度更高。</p>
      <div class="sizes">
        <div class="size"><img src="scheme-b-signal.svg" width="16" height="16" alt="">16</div>
        <div class="size"><img src="scheme-b-signal.svg" width="24" height="24" alt="">24</div>
        <div class="size"><img src="scheme-b-signal.svg" width="32" height="32" alt="">32</div>
      </div>
      <div class="btn"><img src="scheme-b-mark.svg" alt=""></div>
    </article>
    <article class="card">
      <div class="hero"><img src="scheme-c-whisper.svg" alt="C"></div>
      <h2>方案 C · Whisper</h2>
      <p>略柔厚线，更偏 AI 助手气质。</p>
      <div class="sizes">
        <div class="size"><img src="scheme-c-whisper.svg" width="16" height="16" alt="">16</div>
        <div class="size"><img src="scheme-c-whisper.svg" width="24" height="24" alt="">24</div>
        <div class="size"><img src="scheme-c-whisper.svg" width="32" height="32" alt="">32</div>
      </div>
      <div class="btn"><img src="scheme-c-mark.svg" alt=""></div>
    </article>
  </div>
  <p class="note">预览：/assets/brand/proposals/preview.html</p>
</body>
</html>
