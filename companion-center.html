<body>
  <header class="topbar companion-market-header">
    <div class="topbar-inner companion-market-header-inner">
      <a class="brand companion-market-brand" href="index.html">
        <img src="/default-avatar.png" alt="MEOW CUI JIAO" onerror="this.onerror=null;this.src='/default-avatar.png'">
        <span>MEOW CUI JIAO<small>妙脆角电竞</small></span>

      <nav class="nav companion-market-nav" aria-label="页面导航">
        <a href="index.html" data-i18n="nav.home">首页</a>
        <a class="active" href="companion-center.html">陪玩大厅</a>
        <a href="mine.html" data-i18n="nav.mine">我的</a>
      </nav>
    </div>
  </header>

  <main class="page companion-hall-page" data-hall-channel="companions">
    <section class="hall-intro" aria-labelledby="companionHallTitle">
      <div>
        <h1 id="companionHallTitle" data-i18n="hall.title">陪玩大厅</h1>
        <p id="companionHallLead" data-i18n="hall.subtitle">找到喜欢的陪玩，立即开始游戏。</p>
      </div>
    </section>

    <section class="hall-search-panel" data-hall-search="companions" aria-label="搜索陪玩">
      <div class="hall-search-main">
        <label class="hall-search-field" for="searchInput">
          <span>搜索</span>
          <input id="searchInput" type="search" placeholder="搜索昵称、陪玩ID、游戏或标签" data-i18n-placeholder="hall.search_placeholder" autocomplete="off">
        </label>
        <button class="hall-search-btn" id="applyFilter" type="button" data-i18n="hall.search">搜索</button>
        <button class="hall-clear-btn" id="resetFilter" type="button" data-i18n="hall.clear">清除</button>
        <button class="hall-filter-toggle" id="filterToggle" type="button" aria-expanded="false" aria-controls="searchFilters" data-i18n="hall.filter">筛选</button>
      </div>

      <div class="hall-filter-drawer" id="searchFilters" aria-label="筛选工具栏">
        <div class="hall-filter-head">
          <strong>筛选</strong>
          <button class="hall-drawer-close" id="filterClose" type="button">完成</button>
        </div>
        <div class="hall-filter-row">
          <label class="hall-filter-field">
            <span>游戏分类</span>
            <select id="gameFilter"></select>
          </label>
          <label class="hall-filter-field">
            <span>服务类型</span>
            <select id="typeFilter"></select>
          </label>
          <label class="hall-filter-field">
            <span>陪玩等级</span>
            <select id="levelFilter"></select>
          </label>
          <label class="hall-filter-field">
            <span>价格</span>
            <select id="priceFilter">
              <option value="">全部价格</option>
              <option value="20-30">20-30 猫粮</option>
              <option value="30-40">30-40 猫粮</option>
              <option value="40-45">40-45 猫粮</option>
              <option value="60-75">60-75 猫粮</option>
              <option value="75-99999">75+ 猫粮</option>
            </select>
          </label>
          <label class="hall-filter-field">
            <span>在线状态</span>
            <select id="onlineFilter">
              <option value="">全部状态</option>
              <option value="在线可接单">在线可接单</option>
              <option value="忙碌中">忙碌中</option>
              <option value="暂停接单">暂停接单</option>
              <option value="离线">离线</option>
            </select>
          </label>
          <button class="hall-reset-text" id="resetFilterDrawer" type="button">重置筛选</button>
        </div>
      </div>
    </section>

    <section class="hall-search-panel hall-services-search" data-hall-search="services" aria-label="搜索玩法商品" hidden>
      <div class="hall-search-main hall-services-search-main">
        <label class="hall-search-field" for="hallGpSearch">
          <span>搜索</span>
          <input id="hallGpSearch" type="search" placeholder="搜索玩法商品、分类或游戏" autocomplete="off">
        </label>
        <label class="hall-sort-field hall-services-sort">
          <span data-i18n="hall.sort">排序</span>
          <select id="hallGpSort">
            <option value="recommend">综合</option>
            <option value="sold">销量</option>
            <option value="priceAsc">价格从低到高</option>
            <option value="priceDesc">价格从高到低</option>
            <option value="newest">最新</option>
          </select>
        </label>
      </div>
      <div class="hall-gp-cats" id="hallGpCats" aria-label="玩法分类"></div>
    </section>

    <div class="hall-channel-tabs" role="tablist" aria-label="大厅频道">
      <button type="button" class="hall-channel-tab is-active" role="tab" id="hallTabCompanions" aria-selected="true" aria-controls="hallPanelCompanions" data-hall-tab="companions">陪玩大厅</button>
      <button type="button" class="hall-channel-tab" role="tab" id="hallTabServices" aria-selected="false" aria-controls="hallPanelServices" data-hall-tab="services">更多玩法</button>
      <span class="hall-channel-indicator" aria-hidden="true"></span>
    </div>

    <section class="hall-channel-panel is-active" id="hallPanelCompanions" role="tabpanel" aria-labelledby="hallTabCompanions" data-hall-panel="companions">
      <div class="hall-results" aria-labelledby="companionListTitle">
        <div class="hall-results-head">
          <div>
            <h2 id="companionListTitle" data-i18n="hall.recommend">陪玩推荐</h2>
            <p id="resultCount">共 0 位陪玩</p>
          </div>
          <label class="hall-sort-field">
            <span>排序</span>
            <select id="sortFilter">
              <option value="recommend" data-i18n="hall.sort_default">默认推荐</option>
              <option value="levelDesc">等级优先</option>
              <option value="priceAsc">价格低到高</option>
              <option value="priceDesc">价格高到低</option>
            </select>
          </label>
        </div>

        <div class="companion-hall-grid" id="playerList"></div>
        <div class="empty companion-empty" id="emptyState" hidden>
          <strong>暂无符合条件的陪玩</strong>
          <span>试试调整搜索词或筛选条件。</span>
        </div>
        <div class="companion-pagination" id="companionPagination"></div>
      </div>
    </section>

    <section class="hall-channel-panel" id="hallPanelServices" role="tabpanel" aria-labelledby="hallTabServices" data-hall-panel="services" hidden>
      <div class="hall-results hall-services-results" aria-labelledby="hallServicesTitle">
        <div class="hall-results-head">
          <div>
            <h2 id="hallServicesTitle">更多玩法</h2>
            <p id="hallGpCount">读取真实商城商品中…</p>
          </div>
        </div>
        <div class="hall-gp-grid" id="hallGpGrid"></div>
        <div class="empty companion-empty" id="hallGpEmpty" hidden>
          <strong>暂无玩法商品</strong>
          <span>后台「更多玩法管理」发布后会显示在这里。</span>
        </div>
      </div>
    </section>
  </main>

<script>
    (function () {
      var panel = document.querySelector('.hall-search-panel[data-hall-search="companions"]');
      var toggle = document.getElementById('filterToggle');
      var close = document.getElementById('filterClose');
      var reset = document.getElementById('resetFilter');
      var resetDrawer = document.getElementById('resetFilterDrawer');
      function setOpen(open) {
        if (!panel || !toggle) return;
        panel.classList.toggle('filters-open', open);
        document.body.classList.toggle('hall-filter-lock', open);
        toggle.setAttribute('aria-expanded', String(open));
      }
      if (toggle) toggle.addEventListener('click', function () { setOpen(!(panel && panel.classList.contains('filters-open'))); });
      if (close) close.addEventListener('click', function () { setOpen(false); });
      if (reset) {
        reset.addEventListener('click', function () {
          ['searchInput','gameFilter','typeFilter','levelFilter','priceFilter','onlineFilter','sortFilter'].forEach(function (id) {
            var el = document.getElementById(id);
            if (!el) return;
            el.value = id === 'sortFilter' ? 'recommend' : '';
            el.dispatchEvent(new Event('change', { bubbles: true }));
            el.dispatchEvent(new Event('input', { bubbles: true }));
          });
        });
      }
      if (resetDrawer && reset) resetDrawer.addEventListener('click', function () { reset.click(); });
      document.addEventListener('keydown', function (event) { if (event.key === 'Escape') setOpen(false); });
    })();
  </script>
