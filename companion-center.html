<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>陪玩大厅 | Meow Cui Jiao</title>
  <link rel="icon" href="assets/meow-cuijiao-brand.jpg">
  <link rel="stylesheet" href="src/platform.css">
  <link rel="stylesheet" href="src/notify-system.css">
  <link rel="stylesheet" href="src/design-system.css">
  <link rel="stylesheet" href="src/companion-hall.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="index.html">
        <img src="assets/meow-cuijiao-brand.jpg" alt="MEOW CUI JIAO">
        <span>MEOW CUI JIAO<small>妙脆角电竞</small></span>
      </a>
      <nav class="nav">
        <a href="index.html">首页</a>
        <a class="active" href="companion-center.html">陪玩大厅</a>
        <a href="mine.html">我的</a>
      </nav>
    </div>
  </header>

  <main class="page companion-hall-page">
    <section class="companion-hall-hero" aria-labelledby="companionHallTitle">
      <div>
        <h1 id="companionHallTitle">陪玩大厅</h1>
        <p>选择喜欢的游戏与陪玩，立即开始。</p>
      </div>
      <a class="btn companion-apply-link" href="companion-apply.html">申请成为陪玩</a>
    </section>

    <section class="section companion-filter-card" aria-label="搜索与筛选">
      <div class="section-title companion-filter-title">
        <div>
          <h2>搜索与筛选</h2>
          <p>按昵称、ID、游戏、标签和在线状态筛选。</p>
        </div>
        <button class="btn mobile-filter-toggle" id="filterToggle" type="button" aria-expanded="false" aria-controls="searchFilters">筛选</button>
      </div>

      <div class="companion-filters" id="searchFilters">
        <div class="companion-search-row">
          <label class="field companion-search-field">
            <span>搜索</span>
            <input id="searchInput" placeholder="昵称 / ID / 游戏 / 标签 / 简介">
          </label>
          <button class="btn primary companion-search-button" id="applyFilter" type="button">搜索</button>
          <button class="btn companion-reset-button" id="resetFilter" type="button">重置</button>
        </div>

        <div class="companion-filter-row">
          <label class="field">
            <span>游戏</span>
            <select id="gameFilter"></select>
          </label>
          <label class="field">
            <span>服务类型</span>
            <select id="typeFilter"></select>
          </label>
          <label class="field">
            <span>陪玩等级</span>
            <select id="levelFilter"></select>
          </label>
          <label class="field">
            <span>价格区间</span>
            <select id="priceFilter">
              <option value="">全部价格</option>
              <option value="20-30">RM20-RM30</option>
              <option value="30-40">RM30-RM40</option>
              <option value="40-45">RM40-RM45</option>
              <option value="60-75">RM60-RM75</option>
              <option value="75-99999">RM75-RM100+</option>
            </select>
          </label>
          <label class="field">
            <span>在线状态</span>
            <select id="onlineFilter">
              <option value="">全部状态</option>
              <option value="在线">在线</option>
              <option value="忙碌">忙碌</option>
              <option value="离线">离线</option>
            </select>
          </label>
          <label class="field">
            <span>排序方式</span>
            <select id="sortFilter">
              <option value="recommend">默认推荐</option>
              <option value="levelDesc">等级从高到低</option>
              <option value="ratingDesc">评分从高到低</option>
              <option value="priceAsc">价格从低到高</option>
              <option value="priceDesc">价格从高到低</option>
              <option value="ordersDesc">订单量从高到低</option>
              <option value="activeDesc">最近在线</option>
              <option value="newest">最新加入</option>
            </select>
          </label>
        </div>
      </div>
    </section>

    <section class="section companion-list-section">
      <div class="section-title companion-list-title">
        <div>
          <h2>陪玩列表</h2>
          <p id="resultCount">等待后台真实陪玩数据</p>
        </div>
      </div>
      <div class="grid companion-hall-grid" id="playerList"></div>
      <div class="empty companion-empty" id="emptyState" hidden>
        <strong>暂无符合条件的陪玩</strong>
        <span>完成认证并通过审核的陪玩将在这里展示。</span>
        <a class="btn primary" href="companion-apply.html">申请成为陪玩</a>
      </div>
      <div class="companion-pagination" id="companionPagination"></div>
    </section>
  </main>

  <nav class="bottom-nav">
    <a href="index.html">首页</a>
    <a class="active" href="companion-center.html">大厅</a>
    <a href="mine.html">我的</a>
  </nav>

  <script src="src/platform-store.js"></script>
  <script src="src/companion-levels.js"></script>
  <script src="src/dropdown-system.js" defer></script>
  <script src="src/design-system.js" defer></script>
  <script src="src/site-data.js" defer></script>
  <script src="src/companion-hall.js" defer></script>
  <script src="src/notify-system.js" defer></script>
  <script src="src/launch-readiness-fixes.js" defer></script>
  <script src="src/meow-butler.js?v=20260711-floating" defer></script>
  <script>
    (function () {
      var filterCard = document.querySelector('.companion-filter-card');
      var toggle = document.getElementById('filterToggle');
      var reset = document.getElementById('resetFilter');
      if (toggle && filterCard) {
        toggle.addEventListener('click', function () {
          var open = !filterCard.classList.contains('filters-open');
          filterCard.classList.toggle('filters-open', open);
          toggle.setAttribute('aria-expanded', String(open));
        });
      }
      if (reset) {
        reset.addEventListener('click', function () {
          ['searchInput','gameFilter','typeFilter','levelFilter','priceFilter','onlineFilter','sortFilter'].forEach(function (id) {
            var el = document.getElementById(id);
            if (!el) return;
            el.value = id === 'sortFilter' ? 'recommend' : '';
            el.dispatchEvent(new Event('change', { bubbles: true }));
            el.dispatchEvent(new Event('input', { bubbles: true }));
          });
        });
      }
    })();
  </script>
</body>
</html>
