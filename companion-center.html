<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>陪玩大厅 | Meow Cui Jiao</title>
  <link rel="stylesheet" href="src/platform.css">
  <link rel="stylesheet" href="src/notify-system.css">
  <link rel="stylesheet" href="src/design-system.css">
  <link rel="stylesheet" href="src/companion-hall.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="index.html">
        <img src="assets/meow-cuijiao-brand.jpg" alt="MEOW CUI JIAO">
        <span>MEOW CUI JIAO<small>妙脆角电竞</small></span>
      </a>
      <nav class="nav">
        <a href="index.html">首页</a>
        <a class="active" href="companion-center.html">陪玩大厅</a>
        <a href="mine.html">我的</a>
      </nav>
    </div>
  </header>

  <main class="page companion-hall-page">
    <section class="hero companion-hall-hero">
      <div>
        <h1>陪玩大厅</h1>
        <p>搜索昵称、游戏和标签，快速找到合适的陪玩</p>
      </div>
    </section>

    <section class="section card companion-filter-card">
      <div class="section-title">
        <div>
          <h2>搜索与筛选</h2>
          <p>按昵称、陪玩 ID、游戏、标签、位置和简介关键词筛选。</p>
        </div>
        <div class="mobile-filter-actions">
          <button class="btn" id="filterToggle" type="button">筛选</button>
          <button class="btn" id="sortToggle" type="button">排序</button>
        </div>
      </div>

      <div class="filters companion-filters" id="searchFilters">
        <label class="field companion-search-field">
          <span>搜索</span>
          <input id="searchInput" placeholder="昵称 / ID / 游戏 / 标签 / 简介">
        </label>
        <label class="field">
          <span>类型</span>
          <select id="typeFilter"></select>
        </label>
        <label class="field">
          <span>游戏</span>
          <select id="gameFilter"></select>
        </label>
        <label class="field">
          <span>性别</span>
          <select id="genderFilter">
            <option value="">全部性别</option>
            <option value="女">女</option>
            <option value="男">男</option>
            <option value="保密">保密</option>
          </select>
        </label>
        <label class="field">
          <span>价格区间</span>
          <select id="priceFilter">
            <option value="">全部价格</option>
            <option value="20-30">RM20–RM30</option>
            <option value="30-40">RM30–RM40</option>
            <option value="40-45">RM40–RM45</option>
            <option value="60-75">RM60–RM75</option>
            <option value="75-99999">RM75–RM100+</option>
          </select>
        </label>
        <label class="field">
          <span>等级</span>
          <select id="levelFilter"></select>
        </label>
        <label class="field">
          <span>排序方式</span>
          <select id="sortFilter">
            <option value="recommend">默认推荐</option>
            <option value="levelDesc">等级从高到低</option>
            <option value="ratingDesc">评分从高到低</option>
            <option value="priceAsc">价格从低到高</option>
            <option value="priceDesc">价格从高到低</option>
            <option value="ordersDesc">订单量从高到低</option>
            <option value="activeDesc">最近在线</option>
            <option value="newest">新加入</option>
          </select>
        </label>
        <button class="btn primary companion-filter-apply" id="applyFilter" type="button">应用筛选</button>
      </div>
    </section>

    <section class="section">
      <div class="section-title">
        <h2>陪玩列表</h2>
        <p id="resultCount">等待后台真实陪玩数据</p>
      </div>
      <div class="grid grid-3 companion-hall-grid" id="playerList"></div>
      <div class="empty companion-empty" id="emptyState" hidden>暂时没有找到符合条件的陪玩</div>
      <div class="companion-pagination" id="companionPagination"></div>
    </section>
  </main>

  <nav class="bottom-nav">
    <a href="index.html">首页</a>
    <a class="active" href="companion-center.html">大厅</a>
    <a href="mine.html">我的</a>
  </nav>

  <script src="src/platform-store.js"></script>
  <script src="src/companion-levels.js"></script>
  <script src="src/dropdown-system.js" defer></script>
  <script src="src/design-system.js" defer></script>
  <script src="src/site-data.js" defer></script>
  <script src="src/companion-hall.js" defer></script>
  <script src="src/notify-system.js" defer></script>
  <script src="src/launch-readiness-fixes.js" defer></script>
  <script src="src/meow-butler.js?v=20260711-floating" defer></script>
</body>
</html>
