<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>预约状态 | 客服 / 管理</title>
  <style>
    *{box-sizing:border-box}
    html,body{max-width:100%}
    body{margin:0;background:#07070a;color:#fff4fa;font-family:"Microsoft YaHei",sans-serif}
    main{max-width:1080px;margin:0 auto;padding:18px 12px 36px}
    h1{color:#fff4fa;font-size:24px;line-height:1.2}
    .appt{margin:12px 0;padding:14px;border-radius:16px;background:#101014;border:1px solid rgba(244,166,200,.35);min-width:0}
    .appt p{margin:6px 0;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;line-height:1.5}
    .appt span{display:inline-block;min-width:4.5em;color:#F4A6C8;font-weight:700}
  </style>
</head>
<body>
<main>
  <h1>预约状态</h1>
  <p id="msg">读取中…</p>
  <div id="rows"></div>
</main>
<script>
(function(){
  var keys=["mcjAuthAccessToken","customerServiceAuthToken"];
  var token=localStorage.getItem("mcjAuthAccessToken")||"";
  try{
    var cs=JSON.parse(localStorage.getItem("mcjCustomerServiceSession")||sessionStorage.getItem("mcjCustomerServiceSession")||"null");
    if(cs&&cs.token)token=cs.token;
  }catch(e){}
  try{
    var admin=JSON.parse(localStorage.getItem("mcjAdminSession")||sessionStorage.getItem("mcjAdminSession")||"null");
    if(admin&&(admin.token||admin.accessToken))token=admin.token||admin.accessToken;
  }catch(e){}
  if(!token){document.getElementById("msg").textContent="请先登录客服或管理员账号";return;}
  function esc(s){return String(s||"").replace(/[&<>"']/g,function(c){return({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"})[c];});}
  function appointmentText(r){
    var req=String((r&&r.requirements)||"");
    var note=String((r&&r.note)||"");
    if(!note){
      var matched=req.match(/^服务需求：([\s\S]*?)\n备注：([\s\S]*)$/);
      if(matched){req=matched[1].trim();note=matched[2].trim();}
    }
    return {requirements:req.trim()||"无",note:note.trim()||"无"};
  }
  fetch("/api/appointments?action=staff",{headers:{Authorization:"Bearer "+token}}).then(function(r){return r.json();}).then(function(body){
    if(!body.ok){document.getElementById("msg").textContent=body.message||"无权查看";return;}
    var rows=body.appointments||[];
    document.getElementById("msg").textContent="共 "+rows.length+" 条。预约不会进入抢单大厅，也不会扣猫粮，也不会生成正式订单。";
    document.getElementById("rows").innerHTML=rows.map(function(r){
      var text=appointmentText(r);
      var pay=r.charged?"已扣款":"未扣款";
      return '<article class="appt"><p><span>预约编号</span>'+esc(r.id)+'</p><p><span>老板</span>'+esc(r.bossId)+'</p><p><span>陪玩</span>'+esc(r.companionId)+'</p><p><span>状态</span>'+esc(r.status)+'</p><p><span>服务</span>'+esc(r.serviceName)+'</p><p><span>开始</span>'+esc(r.startAt)+'</p><p><span>结束</span>'+esc(r.endAt)+'</p><p><span>时长</span>'+esc(r.hours)+' 小时</p><p><span>金额</span>'+esc(r.totalAmount)+' 猫粮</p><p><span>服务需求</span>'+esc(text.requirements)+'</p><p><span>备注</span>'+esc(text.note)+'</p><p><span>付款</span>'+pay+'（'+esc(r.chargeState||"none")+'）</p><p><span>关联订单</span>'+esc(r.orderId||"未生成")+'</p><p><span>订单状态</span>'+esc(r.orderStatus||"无")+'</p><p><span>正式订单</span>预约审核通过前不是进行中的正式服务。预约订单不会进入抢单大厅，也不会扣猫粮。</p></article>';
    }).join("");
  });
})();
</script>
</body>
</html>
