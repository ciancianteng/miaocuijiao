<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>支付确认 / Discord 时机验收</title>
  <link rel="stylesheet" href="/src/style.css" />
  <style>
    /* Mirror production pay styles (subset) for fixture */
    body{margin:0;background:#0c0a10;color:#ffe6f2;font-family:"Segoe UI","PingFang SC","Noto Sans SC",sans-serif}
    .pay-shell{width:min(480px,calc(100% - 32px));margin:0 auto;padding:28px 0 88px}
    .pay-card{border:1px solid rgba(255,255,255,.08);border-radius:16px;background:rgba(22,16,28,.96);padding:22px 18px 20px}
    .pay-head{margin:0 0 16px}
    .pay-card h1{margin:0;font-size:20px;font-weight:650;color:rgba(255,248,252,.96)}
    .pay-lead{margin:8px 0 0;font-size:13px;font-weight:400;line-height:1.5;color:rgba(255,214,231,.55)}
    .pay-info-card{display:grid;border:1px solid rgba(255,255,255,.08);border-radius:12px;background:rgba(255,255,255,.03);overflow:hidden}
    .pay-row{display:flex;justify-content:space-between;gap:12px;padding:11px 14px;border-bottom:1px solid rgba(255,255,255,.06)}
    .pay-row:last-child{border-bottom:0}
    .pay-row span{color:rgba(255,214,231,.45);font-size:12px;font-weight:500;min-width:4.5em}
    .pay-row strong{color:rgba(255,248,252,.92);font-size:13px;font-weight:550;text-align:right}
    .pay-row-amount strong{font-size:15px;font-weight:650;color:#ffd6e7}
    .pay-voice-hint{margin:12px 0 0;color:rgba(255,214,231,.42);font-size:12px;line-height:1.45}
    .pay-discord{margin-top:14px;border:1px solid rgba(255,255,255,.1);border-radius:12px;background:rgba(255,255,255,.035);padding:14px}
    .pay-discord.is-bound{border-color:rgba(243,168,203,.28);background:rgba(243,168,203,.08)}
    .pay-discord-title{margin:0;font-size:14px;font-weight:600}
    .pay-discord-desc{margin:6px 0 0;font-size:12px;color:rgba(255,214,231,.5);line-height:1.45}
    .pay-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
    .pay-btn{border:1px solid rgba(255,255,255,.12);border-radius:12px;background:rgba(255,255,255,.05);color:#ffe6f2;padding:10px 14px;min-height:44px;font-weight:600;font-size:14px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
    .pay-btn.primary{border:0;background:rgba(243,168,203,.92);color:#1b0712;font-weight:650}
    .tabs{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px;width:min(480px,calc(100% - 32px));margin-left:auto;margin-right:auto}
    .tabs button{flex:1;min-width:120px;height:36px;border-radius:10px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);color:#ffd6e7;cursor:pointer;font-size:12px}
    .tabs button.active{border-color:rgba(243,168,203,.45);background:rgba(243,168,203,.12)}
    .mcj-po-voice-grid{display:grid;gap:8px;margin-top:8px}
    .mcj-po-voice-card{display:grid;grid-template-columns:28px 1fr;column-gap:10px;row-gap:2px;padding:12px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.035);text-align:left;color:#ffd6e7;cursor:pointer}
    .mcj-po-voice-card.active{border-color:rgba(243,168,203,.45);background:rgba(243,168,203,.12)}
    .mcj-po-voice-card-icon{grid-row:1/span 2;align-self:center;width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;border-radius:8px;background:rgba(255,255,255,.05)}
    .mcj-po-voice-card-title{font-size:14px;font-weight:650}
    .mcj-po-voice-card-desc{font-size:12px;color:rgba(255,214,231,.45)}
    .section-label{font-size:13px;color:rgba(255,214,231,.62);margin:0 0 8px}
    .detail-mini{margin-top:18px;padding-top:14px;border-top:1px solid rgba(255,255,255,.08)}
    .detail-mini h2{margin:0 0 8px;font-size:13px;font-weight:600;color:rgba(255,214,231,.7)}
  </style>
</head>
<body>
  <div class="tabs" id="tabs">
    <button type="button" data-view="order-discord" class="active">下单·Discord</button>
    <button type="button" data-view="prepay-discord">支付前</button>
    <button type="button" data-view="post-unbound">支付后·未绑定</button>
    <button type="button" data-view="post-bound">支付后·已绑定</button>
    <button type="button" data-view="post-game">支付后·游戏麦</button>
    <button type="button" data-view="boss-detail">老板详情</button>
    <button type="button" data-view="companion-detail">陪玩端</button>
  </div>
  <div class="pay-shell" id="root"></div>
  <script>
    function paint(view) {
      var root = document.getElementById("root");
      if (view === "order-discord") {
        root.innerHTML =
          '<section class="pay-card"><h1 style="font-size:18px;font-weight:650;margin:0 0 12px">确认下单</h1>' +
          '<p class="section-label">本单语音方式</p>' +
          '<div class="mcj-po-voice-grid">' +
          '<button type="button" class="mcj-po-voice-card active"><span class="mcj-po-voice-card-icon">🎧</span><span class="mcj-po-voice-card-title">Discord语音房</span><span class="mcj-po-voice-card-desc">下单后使用 Discord 私人语音房沟通</span></button>' +
          '<button type="button" class="mcj-po-voice-card"><span class="mcj-po-voice-card-icon">🎮</span><span class="mcj-po-voice-card-title">游戏麦</span><span class="mcj-po-voice-card-desc">使用游戏内语音沟通</span></button>' +
          "</div></section>";
        return;
      }
      if (view === "prepay-discord") {
        root.innerHTML =
          '<section class="pay-card"><header class="pay-head"><h1>支付确认</h1></header>' +
          '<div class="pay-info-card">' +
          '<div class="pay-row"><span>订单号</span><strong>MCJ-24001</strong></div>' +
          '<div class="pay-row"><span>陪玩</span><strong>1717</strong></div>' +
          '<div class="pay-row"><span>服务</span><strong>VALORANT</strong></div>' +
          '<div class="pay-row"><span>服务时间</span><strong>21:00 – 22:00</strong></div>' +
          '<div class="pay-row"><span>语音方式</span><strong>Discord语音房</strong></div>' +
          '<div class="pay-row pay-row-amount"><span>应付金额</span><strong>35 猫粮</strong></div>' +
          '<div class="pay-row"><span>支付方式</span><strong>猫粮余额</strong></div></div>' +
          '<p class="pay-voice-hint">支付成功后可连接 Discord，陪玩接单后将开启私人语音房。</p>' +
          '<div class="pay-actions"><button type="button" class="pay-btn primary">立即支付</button></div></section>';
        return;
      }
      if (view === "post-unbound") {
        root.innerHTML =
          '<section class="pay-card"><header class="pay-head"><h1>支付成功</h1><p class="pay-lead">订单已付款成功。</p></header>' +
          '<div class="pay-info-card">' +
          '<div class="pay-row"><span>订单号</span><strong>MCJ-24001</strong></div>' +
          '<div class="pay-row"><span>陪玩</span><strong>1717</strong></div>' +
          '<div class="pay-row"><span>服务时间</span><strong>21:00 – 22:00</strong></div>' +
          '<div class="pay-row"><span>语音方式</span><strong>Discord语音房</strong></div></div>' +
          '<div class="pay-discord"><p class="pay-discord-title">连接 Discord</p>' +
          '<p class="pay-discord-desc">你已选择 Discord语音房，请先连接 Discord，以便后续进入私人语音房。</p>' +
          '<div class="pay-actions"><button type="button" class="pay-btn primary">连接 Discord</button>' +
          '<a class="pay-btn" href="#">稍后再说</a></div></div></section>';
        return;
      }
      if (view === "post-bound") {
        root.innerHTML =
          '<section class="pay-card"><header class="pay-head"><h1>支付成功</h1><p class="pay-lead">订单已付款成功。</p></header>' +
          '<div class="pay-info-card">' +
          '<div class="pay-row"><span>订单号</span><strong>MCJ-24001</strong></div>' +
          '<div class="pay-row"><span>语音方式</span><strong>Discord语音房</strong></div></div>' +
          '<div class="pay-discord is-bound"><p class="pay-discord-title">Discord 已连接：meow_boss#1234</p>' +
          '<p class="pay-discord-desc">陪玩确认接单后将开启私人语音房。</p></div>' +
          '<div class="pay-actions"><a class="pay-btn primary" href="#">查看订单详情</a></div></section>';
        return;
      }
      if (view === "post-game") {
        root.innerHTML =
          '<section class="pay-card"><header class="pay-head"><h1>支付成功</h1><p class="pay-lead">订单已付款成功。</p></header>' +
          '<div class="pay-info-card">' +
          '<div class="pay-row"><span>订单号</span><strong>MCJ-24002</strong></div>' +
          '<div class="pay-row"><span>语音方式</span><strong>游戏麦</strong></div></div>' +
          '<div class="pay-actions"><a class="pay-btn primary" href="#">查看订单详情</a></div></section>';
        return;
      }
      if (view === "boss-detail") {
        root.innerHTML =
          '<section class="pay-card"><h1 style="font-size:18px;margin:0 0 12px">老板订单详情</h1>' +
          '<div class="pay-info-card">' +
          '<div class="pay-row"><span>订单号</span><strong>MCJ-24001</strong></div>' +
          '<div class="pay-row"><span>语音方式</span><strong>Discord语音房</strong></div></div></section>';
        return;
      }
      root.innerHTML =
        '<section class="pay-card"><h1 style="font-size:18px;margin:0 0 12px">陪玩端订单</h1>' +
        '<div class="pay-info-card">' +
        '<div class="pay-row"><span>订单号</span><strong>MCJ-24001</strong></div>' +
        '<div class="pay-row"><span>语音方式</span><strong>Discord语音房</strong></div></div>' +
        '<p class="pay-voice-hint" style="margin-top:12px">确认接单后系统才会开启私人语音房（不会提前显示已开启）。</p></section>';
    }
    document.getElementById("tabs").addEventListener("click", function (e) {
      var btn = e.target.closest("[data-view]");
      if (!btn) return;
      document.querySelectorAll("[data-view]").forEach(function (b) { b.classList.toggle("active", b === btn); });
      paint(btn.getAttribute("data-view"));
    });
    paint("order-discord");
  </script>
</body>
</html>
