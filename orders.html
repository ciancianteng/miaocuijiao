<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的订单 - MEOW CUI JIAO</title>
  <link rel="stylesheet" href="src/style.css">
  <link rel="stylesheet" href="src/design-system.css">
  <style>
    .orders-shell{width:min(1080px,calc(100% - 32px));margin:0 auto;padding:24px 0 80px}.orders-head{display:flex;justify-content:space-between;gap:16px;align-items:end;margin:18px 0}.orders-head h1{margin:0;font-size:28px}.orders-head p{margin:6px 0 0;color:#9ca3af}.order-toolbar{display:flex;gap:10px;align-items:center}.order-list{display:grid;gap:12px}.order-card{border:1px solid rgba(255,255,255,.1);border-radius:18px;background:rgba(255,255,255,.045);padding:16px}.order-card header{display:flex;justify-content:space-between;gap:12px;align-items:start}.order-card h3{margin:0 0 6px}.order-card p{margin:0;color:#9ca3af}.order-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}.order-grid div{border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:10px;background:rgba(0,0,0,.18)}.order-grid span{display:block;color:#9ca3af;font-size:12px}.order-grid strong{display:block;margin-top:4px}.order-status{border:1px solid rgba(255,143,197,.35);border-radius:999px;color:#ffd7e8;padding:6px 10px;white-space:nowrap}.order-actions{display:flex;gap:8px;flex-wrap:wrap}.order-btn{border:1px solid rgba(255,255,255,.12);border-radius:10px;background:rgba(255,255,255,.06);color:#fff;padding:9px 12px;cursor:pointer}.order-btn.primary{border-color:rgba(255,143,197,.5);background:rgba(255,143,197,.16)}.order-empty{border:1px dashed rgba(255,255,255,.14);border-radius:18px;padding:34px;text-align:center;color:#9ca3af}.order-alert{border:1px solid rgba(255,143,197,.28);border-radius:16px;background:rgba(255,143,197,.08);padding:16px;color:#ffd6e8}@media(max-width:720px){.orders-head{display:block}.order-grid{grid-template-columns:1fr 1fr}.order-card header{display:block}.order-status{display:inline-block;margin-top:10px}}
  </style>
</head>
<body>
  <header class="topbar"><a class="brand" href="index.html"><img src="assets/meow-cuijiao-brand.jpg" alt="MEOW CUI JIAO"><span>MEOW CUI JIAO</span></a><nav class="navlinks"><a href="index.html">首页</a><a href="companion-center.html">陪玩大厅</a><a href="mine.html">我的</a></nav></header>
  <main class="orders-shell" id="ordersApp"></main>
  <script src="src/role-gates.js"></script>
  <script>
    (function(){
      var root=document.getElementById('ordersApp');
      var state={loading:true,error:'',orders:[]};
      var statusText={awaiting_payment:'待付款确认',pending:'待接单',claimed:'陪玩已申请',waiting_boss_confirm:'待老板确认',confirmed:'已确认',in_progress:'进行中',completed:'已完成',cancelled:'已取消',refund_requested:'退款处理中',refunded:'已退款'};
      function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
      function money(v){var n=Number(v||0);return 'RM'+(Number.isFinite(n)?n:0).toFixed(2)}
      function token(){return localStorage.getItem('mcjAuthAccessToken')||sessionStorage.getItem('mcjAuthAccessToken')||''}
      function paint(){root.innerHTML='<section class="orders-head"><div><h1>我的订单</h1><p>只显示当前老板账号的真实订单。</p></div><div class="order-toolbar"><a class="order-btn" href="companion-center.html">去下单</a><button class="order-btn" data-refresh>刷新</button></div></section>'+bodyHtml()}
      function bodyHtml(){if(!token())return '<div class="order-alert">请先使用邮箱和密码登录后查看我的订单。</div>';if(state.loading)return '<div class="order-empty">正在读取订单...</div>';if(state.error)return '<div class="order-alert">'+esc(state.error)+'</div>';return '<section class="order-list">'+(state.orders.length?state.orders.map(card).join(''):'<div class="order-empty"><strong>暂无订单</strong><p>创建订单后会在这里显示。</p></div>')+'</section>'}
      function actions(o){var out=[];if(o.status==='waiting_boss_confirm')out.push('<button class="order-btn primary" data-action="confirm_companion" data-id="'+esc(o.id)+'">确认陪玩</button><button class="order-btn" data-action="reject_companion" data-id="'+esc(o.id)+'">拒绝陪玩</button>');if(['awaiting_payment','pending','claimed','waiting_boss_confirm','confirmed'].indexOf(o.status)>-1)out.push('<button class="order-btn" data-action="cancel_order" data-id="'+esc(o.id)+'">取消订单</button>');if(['confirmed','in_progress','completed'].indexOf(o.status)>-1)out.push('<button class="order-btn" data-action="request_refund" data-id="'+esc(o.id)+'">申请退款</button>');out.push('<a class="order-btn" href="support.html?order='+encodeURIComponent(o.id)+'">联系在线客服</a>');return out.join('')}
      function card(o){var companion=o.companion&&((o.companion.display_name||o.companion.email)||'');var service=o.customerService&&((o.customerService.display_name||o.customerService.email)||'');return '<article class="order-card"><header><div><h3>'+esc(o.orderNo||o.order_no||o.id)+'</h3><p>'+esc(o.title||o.game||'-')+' · '+esc(o.createdAt||'-')+'</p></div><span class="order-status">'+esc(o.statusText||statusText[o.status]||o.status)+'</span></header><div class="order-grid"><div><span>游戏</span><strong>'+esc(o.game||'-')+'</strong></div><div><span>陪玩</span><strong>'+esc(companion||'待确认')+'</strong></div><div><span>金额</span><strong>'+money(o.totalAmount||o.amount)+'</strong></div><div><span>时长</span><strong>'+esc(o.hours||'-')+' 小时</strong></div></div><p>'+esc(o.description||'-')+'</p><footer class="order-actions" style="margin-top:14px">'+actions(o)+'</footer></article>'}
      function load(){if(!token()){state.loading=false;paint();return}state.loading=true;state.error='';paint();fetch('/api/orders',{headers:{Accept:'application/json',Authorization:'Bearer '+token()}}).then(function(res){return res.json().then(function(body){if(!res.ok||body.ok===false)throw new Error(body.message||'订单读取失败');return body})}).then(function(body){state.orders=body.orders||[]}).catch(function(err){state.error=err.message||'订单读取失败'}).finally(function(){state.loading=false;paint()})}
      function submit(action,id){if(!token())return;fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token()},body:JSON.stringify({action:action,id:id})}).then(function(res){return res.json().then(function(body){if(!res.ok||body.ok===false)throw new Error(body.message||'操作失败');return body})}).then(function(){load()}).catch(function(err){alert(err.message||'操作失败')})}
      document.addEventListener('click',function(e){if(e.target.closest('[data-refresh]')){load();return}var btn=e.target.closest('[data-action]');if(btn){submit(btn.dataset.action,btn.dataset.id);return}});
      load();
    })();
  </script>
  <script src="src/footer-system.js" defer></script>
  <script src="src/meow-butler.js?v=20260711-floating" defer></script>
</body>
</html>
