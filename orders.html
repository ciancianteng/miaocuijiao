  <script>
    (function(){
      var root=document.getElementById('ordersApp'),modal=document.getElementById('detailModal'),detailBody=document.getElementById('detailBody'),detailFooter=document.getElementById('detailFooter');
      var reviewModal=document.getElementById('reviewModal'),reviewForm=document.getElementById('reviewForm'),reviewOrderMeta=document.getElementById('reviewOrderMeta'),reviewStars=document.getElementById('reviewStars'),reviewRating=document.getElementById('reviewRating'),reviewContent=document.getElementById('reviewContent'),reviewState=document.getElementById('reviewState'),reviewSubmitBtn=document.getElementById('reviewSubmitBtn');
      var CACHE_KEY='mcjBossOrdersCache';
      var POLL_MS=8000;
      var abortCtrl=null;
      var loadGen=0;
      var pollTimer=null;
      var reviewOrderId='';
      var pendingOpenReviewId=(function(){try{return String(new URLSearchParams(location.search).get('openReview')||'').trim()}catch(e){return ''}})();
      var state={loading:true,error:'',orders:[],filter:(function(){var f=new URLSearchParams(location.search).get('filter')||'all';var ok=['all','awaiting_payment','payment_review','arranging','waiting_companion','boss_confirm','active','completed','after_sale','cancelled'];return ok.indexOf(f)>=0?f:'all'})(),fromCache:false,syncing:false};
      var tabs=[['all','全部'],['awaiting_payment','待付款'],['payment_review','待人工审核'],['arranging','待客服处理'],['waiting_companion','等待陪玩确认'],['boss_confirm','等待老板选择'],['active','进行中'],['completed','已完成'],['after_sale','售后'],['cancelled','已取消']];
      var statusText=(window.MCJOrderStatus&&window.MCJOrderStatus.LABELS)||{awaiting_payment:'待付款',payment_review:'待人工审核',pending:'待客服处理',claimed:'等待陪玩确认',waiting_boss_confirm:'等待老板选择',confirmed:'进行中',in_progress:'进行中',completed:'已完成',reviewed:'已评价',cancelled:'已取消',refund_requested:'售后',refunded:'已退款'};
      function token(){return localStorage.getItem('mcjAuthAccessToken')||sessionStorage.getItem('mcjAuthAccessToken')||''}
      function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
      function money(v){if(window.MCJCurrency)return window.MCJCurrency.formatPlain(v);var n=Number(v||0);return (Number.isFinite(n)?n:0).toFixed(2).replace(/\.00$/,'')+' 猫粮'}
      function moneyEmoji(v){if(window.MCJCurrency)return window.MCJCurrency.formatAmount(v);return '🐱 '+money(v)}
      function date(v){if(!v)return '-';try{return new Date(v).toLocaleString('zh-CN',{hour12:false})}catch(e){return v}}
      function isPaymentReview(o){return !!(o&&(o.paymentReview||o.paymentStatus==='待审核'||o.paymentStatus==='待人工审核'||/待审核|待人工审核/.test(String(o.statusText||o.paymentStatus||''))))}
      function orderLabel(o){
        if(o.reviewed||o.status==='reviewed')return '已评价';
        if(o.status==='in_progress'&&o.completionPending)return o.autoConfirmPaused?'等待处理订单问题':'等待您确认完成';
        if(isPaymentReview(o)&&o.status==='awaiting_payment')return '待人工审核';
        return o.statusText||statusText[o.status]||o.status||'-';
      }
      function canReview(o){return !!(o.canReview||(o.status==='completed'&&!o.reviewed&&(o.companionId||(o.companion&&o.companion.id))))}
      function remainingLabel(o){
        if(o.autoConfirmRemainingLabel)return o.autoConfirmRemainingLabel;
        var ms=Number(o.autoConfirmRemainingMs);
        if(!Number.isFinite(ms)||ms<0)return '';
        var totalMin=Math.max(0,Math.ceil(ms/60000));
        var h=Math.floor(totalMin/60),m=totalMin%60;
        return h<=0?(m+'分钟'):(h+'小时'+m+'分钟');
      }
      function statusReason(o){
        var s=String(o.status||'');
        if(isPaymentReview(o)&&s==='awaiting_payment')return '付款凭证已提交，等待人工审核。';
        if(o.paymentRejectReason&&s==='awaiting_payment')return '付款凭证已驳回：'+String(o.paymentRejectReason)+'。请重新上传。';
        if(s==='in_progress'&&o.completionPending){
          if(o.autoConfirmPaused)return o.autoConfirmPausedReason||'订单问题处理中，自动确认已暂停，请等待客服或后台处理。';
          var left=remainingLabel(o);
          return left
            ?('陪玩已申请完成，请确认本次服务。若订单没有问题，系统将在 '+left+' 后自动确认完成。')
            :'陪玩已申请完成，请确认本次服务。';
        }
        if(o.bossHint)return o.bossHint;
        if(s==='awaiting_payment')return '待付款：请先扫码付款并上传付款截图';
        if(s==='pending')return '抢单中：付款已确认，等待陪玩抢单；可查看抢单人数';
        if(s==='waiting_boss_confirm')return '等待老板选择：有陪玩抢单，请查看后点击「我要她」';
        if(s==='confirmed')return '进行中：陪玩已确认接单';
        if(s==='in_progress')return '进行中';
        if(s==='claimed')return '等待陪玩确认：订单已付款，正在等待陪玩确认接单';
        if(s==='completed')return canReview(o)?'服务已完成，可立即评价':'服务已完成';
        if(s==='reviewed'||o.reviewed)return '已评价';
        if(s==='cancelled')return '订单已取消';
        if(s==='refund_requested')return '售后处理中，请联系客服';
        if(s==='refunded')return '已退款';
        return '请查看详情了解下一步';
      }
      function visibleOrders(){return state.orders.filter(function(o){if(state.filter==='all')return true;if(state.filter==='awaiting_payment')return o.status==='awaiting_payment'&&!isPaymentReview(o);if(state.filter==='payment_review')return isPaymentReview(o)&&o.status==='awaiting_payment';if(state.filter==='waiting_companion')return o.status==='claimed';if(state.filter==='arranging')return o.status==='pending';if(state.filter==='boss_confirm')return o.status==='waiting_boss_confirm';if(state.filter==='active')return o.status==='confirmed'||o.status==='in_progress';if(state.filter==='after_sale')return o.status==='refund_requested'||o.status==='refunded';if(state.filter==='completed')return o.status==='completed'||o.status==='reviewed'||o.reviewed;return o.status===state.filter})}
      function skeletonHtml(){return '<div class="order-skel" aria-busy="true">'+[0,1,2].map(function(){return '<div class="order-skel-card"><div class="order-skel-line lg"></div><div class="order-skel-line"></div><div class="order-skel-line"></div></div>'}).join('')+'</div><p class="order-empty">正在读取订单…</p>'}
      function failHtml(){return '<div class="order-alert"><strong>订单加载失败，请重试</strong><p style="margin:8px 0 0;color:#ffd6e8">'+esc(state.error||'请检查网络后重试')+'</p><button class="order-btn primary" type="button" data-refresh>重新加载</button></div>'}
      function paint(){root.innerHTML='<section class="orders-head"><div><h1>我的订单</h1><p>只显示当前老板账号的真实订单。</p></div><button class="order-btn" data-refresh type="button">刷新</button></section><div class="tabs">'+tabs.map(function(t){return '<button class="tab '+(state.filter===t[0]?'active':'')+'" type="button" data-filter="'+t[0]+'">'+t[1]+'</button>'}).join('')+'</div>'+bodyHtml()}
      function bodyHtml(){
        if(!token())return '<div class="order-alert">请先登录后查看我的订单。</div>';
        if(state.error&&!state.orders.length)return failHtml();
        if(state.loading&&!state.orders.length)return skeletonHtml();
        var sync=state.syncing||(state.loading&&state.orders.length)?'<p class="order-sync">'+(state.fromCache?'已显示缓存，正在更新…':'正在同步最新订单…')+'</p>':'';
        var rows=visibleOrders();
        return sync+'<section class="order-list" aria-label="订单列表">'+(rows.length?rows.map(card).join(''):'<div class="order-empty"><strong>暂无订单</strong><p>下单成功后，订单会出现在这里。</p></div>')+'</section>';
      }
      function companionName(o){return (o.companion&&(o.companion.display_name||o.companion.email))||o.companionName||o.companion_name||'待安排'}
      function serviceName(o){return o.customerService&&(o.customerService.display_name||o.customerService.email)||'待接入'}
      function bossProfile(){
        try{
          var u=JSON.parse(localStorage.getItem('customerUser')||sessionStorage.getItem('customerUser')||'{}')||{};
          return {
            name:u.displayName||u.display_name||u.nickname||u.email||'当前老板',
            uid:u.bossUid||u.boss_uid||u.id||'-',
            email:u.email||'-'
          };

      function isRealLoadFailure(err,res){
        if(res&&res.status>=500)return true;
        if(res&&(res.status===0||res.status===408||res.status===504))return true;
        var msg=String((err&&err.message)||'');

      async function load(opts){
        opts=opts||{};

        abortCtrl=typeof AbortController!=='undefined'?new AbortController():null;
        var cached=readCache();
        if(cached&&cached.length&&!state.orders.length){state.orders=cached;state.fromCache=true;state.loading=false;state.syncing=true;state.error='';paint()}
        else if(!opts.silent){state.loading=!state.orders.length;state.syncing=!!state.orders.length;state.error='';paint()}
        else{state.syncing=true;state.error=''}
        try{
          var res=await fetch('/api/orders',{headers:{Accept:'application/json',Authorization:'Bearer '+token()},cache:'no-store',signal:abortCtrl?abortCtrl.signal:undefined});
          var body=await res.json().catch(function(){return {}});
          if(gen!==loadGen)return;
          if(res.ok&&body.ok!==false){
            state.orders=Array.isArray(body.orders)?body.orders:[];
            state.fromCache=false;state.error='';state.loading=false;state.syncing=false;
            writeCache(state.orders);

              var focusOrder=state.orders.find(function(x){return String(x.id)===String(focusId)||String(x.orderNo||x.order_no||'')===String(focusId)});

                if(el2)el2.scrollIntoView({behavior:'smooth',block:'center'});
              }
            }
            return;
          }
          // Failed response: only hard-fail UI for 5xx / network-class statuses.
          var msg=body.message||('订单读取失败 (HTTP '+res.status+')');
          state.loading=false;state.syncing=false;
          if(!state.orders.length){
            if(res.status===401||res.status===403){state.error=msg;paint();return}
            if(res.status>=500||res.status===0||res.status===408||res.status===504||isRealLoadFailure(null,res)){
              state.error=msg||'订单加载失败，请重试';paint();return;
            }
            // Other non-OK without prior cache: still surface retry (real API failure), not fake rows.
            state.error=msg||'订单加载失败，请重试';paint();
            return;
          }
          paint();
        }catch(err){
          if(gen!==loadGen)return;
          // Aborted because a newer load() started — never treat as failure.
          if(err&&err.name==='AbortError')return;
          state.loading=false;state.syncing=false;
          if(!state.orders.length){
            state.error=isRealLoadFailure(err,null)?(err.message||'订单加载失败，请重试'):'订单加载失败，请重试';
            paint();
          }else paint();
        }
      }
      async function submit(action,id,extra){try{var payload=Object.assign({action:action,id:id},extra||{});if(action==='want_him'||action==='confirm_companion'||action==='select_grabber'){if(!confirm('确认「我要她」？将正式指定该陪玩，并等待陪玩确认接单。'))return}if(action==='confirm_completion'){if(!confirm('确认完成本次服务？确认后订单将变为已完成，并开放评价与结算。'))return}if(action==='report_order_problem'){if(!confirm('确认提交订单问题？系统将暂停 24 小时自动确认，并请你联系客服处理。'))return}var res=await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token()},body:JSON.stringify(payload)});var body=await res.json().catch(function(){return {}});if(!res.ok||body.ok===false)throw new Error(body.message||'操作失败');await load();if(action==='want_him'||action==='confirm_companion'||action==='select_grabber'){alert(body.message||'已指定陪玩，等待陪玩确认接单。')}if(action==='report_order_problem'){alert(body.message||'已暂停自动确认，请联系客服。');location.href=body.supportUrl||('support.html?order='+encodeURIComponent(id));return}if(action==='confirm_completion'&&body.order){var done=state.orders.find(function(x){return x.id===id})||body.order;if(done&&canReview(done)){openReviewModal(done)}else if(done){detail(done,false)}alert(body.message||'已确认完成，订单已完成。')}else if(modal.classList.contains('open')){var cur=state.orders.find(function(x){return x.id===id});if(cur)detail(cur)}}catch(err){alert(err.message||'操作失败')}}
      function paintReviewStars(n){
        var rating=Math.max(1,Math.min(5,Number(n)||5));
        if(reviewRating)reviewRating.value=String(rating);
        if(!reviewStars)return;
        var html='';
        for(var i=1;i<=5;i++){
          html+='<button class="review-star'+(i<=rating?' on':'')+'" type="button" data-star="'+i+'" aria-label="'+i+' 星" aria-checked="'+(i===rating?'true':'false')+'" role="radio">★</button>';
        }
        reviewStars.innerHTML=html;
      }
      function openReviewModal(o){
        if(!o||!canReview(o)||!reviewModal)return;
        reviewOrderId=o.id;
        if(reviewOrderMeta){
          reviewOrderMeta.textContent='订单 '+(o.orderNo||o.order_no||o.id)+' · 陪玩 '+companionName(o);
        }
        if(reviewContent)reviewContent.value='';
        if(reviewState)reviewState.textContent='';
        if(reviewSubmitBtn){reviewSubmitBtn.disabled=false;reviewSubmitBtn.textContent='提交评价'}
        paintReviewStars(5);
        reviewModal.classList.add('open');
        reviewModal.setAttribute('aria-hidden','false');
      }
      function closeReviewModal(){
        if(!reviewModal)return;
        reviewModal.classList.remove('open');
        reviewModal.setAttribute('aria-hidden','true');
        reviewOrderId='';
      }
      function maybeOpenPendingReview(){
        if(!pendingOpenReviewId)return;
        var id=pendingOpenReviewId;
        pendingOpenReviewId='';
        try{
          var u=new URL(location.href);
          u.searchParams.delete('openReview');
          history.replaceState({},'',u.pathname+(u.search||'')+(u.hash||''));
        }catch(e){}
        var o=state.orders.find(function(x){return x.id===id});
        if(o&&canReview(o))openReviewModal(o);
        else if(o&&(o.reviewed||o.status==='reviewed'))alert('该订单已评价');
      }
      async function submitReview(id){
        var orderId=id||reviewOrderId;
        if(!orderId)return;
        var rating=Number((reviewRating&&reviewRating.value)||5);
        var content=(reviewContent&&reviewContent.value)||'';
        if(!(rating>=1&&rating<=5)){if(reviewState)reviewState.textContent='请选择 1-5 星评分';return}
        if(reviewState)reviewState.textContent='提交中…';
        if(reviewSubmitBtn){reviewSubmitBtn.disabled=true;reviewSubmitBtn.textContent='提交中…'}
        try{
          var res=await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token()},body:JSON.stringify({action:'submit_review',id:orderId,rating:rating,content:content})});
          var body=await res.json().catch(function(){return {}});
          if(!res.ok||body.ok===false)throw new Error(body.message||'评价失败');
          if(body.order){
            var ix=state.orders.findIndex(function(x){return x.id===orderId});
            if(ix>=0){
              state.orders[ix]=Object.assign({},state.orders[ix],body.order,{reviewed:true,canReview:false,status:body.order.status||'reviewed',reviewRating:body.order.reviewRating!=null?body.order.reviewRating:rating,reviewContent:body.order.reviewContent!=null?body.order.reviewContent:content});
              writeCache(state.orders);
            }
          }
          await load({silent:true});
          paint();
          closeReviewModal();
          if(modal.classList.contains('open')){
            var o=state.orders.find(function(x){return x.id===orderId});
            if(o)detail(o,false);
          }
          try{
            var bumpCid=(body.companionId||(body.order&&(body.order.companionId||body.order.companion_id))||(state.orders.find(function(x){return x.id===orderId})||{}).companionId||'');
            localStorage.setItem('mcjCompanionReviewBump',JSON.stringify({companionId:bumpCid,orderId:orderId,at:Date.now()}));
          }catch(eBump){}
          alert(body.already?'该订单已评价':(body.message||'评价提交成功'));
        }catch(err){
          if(reviewState)reviewState.textContent=err.message||'评价失败';
          if(reviewSubmitBtn){reviewSubmitBtn.disabled=false;reviewSubmitBtn.textContent='提交评价'}
          alert(err.message||'评价失败');
        }
      }
      document.addEventListener('click',function(e){var f=e.target.closest('[data-filter]');if(f){state.filter=f.dataset.filter;paint();return}if(e.target.closest('[data-refresh]')){load();return}var revBtn=e.target.closest('[data-review-order]');if(revBtn){var ro=state.orders.find(function(x){return x.id===revBtn.getAttribute('data-review-order')});if(ro)openReviewModal(ro);return}var starBtn=e.target.closest('[data-star]');if(starBtn&&reviewStars&&reviewStars.contains(starBtn)){paintReviewStars(starBtn.getAttribute('data-star'));return}if(e.target.closest('[data-review-close]')||e.target===reviewModal){closeReviewModal();return}var d=e.target.closest('[data-detail]');if(d){(async function(){var o=state.orders.find(function(x){return x.id===d.dataset.detail});if(!o)return;try{var freshRes=await fetch('/api/orders?id='+encodeURIComponent(o.id),{headers:{Accept:'application/json',Authorization:'Bearer '+token()},cache:'no-store'});var freshBody=await freshRes.json().catch(function(){return{}});if(freshRes.ok&&freshBody.ok!==false){var fresh=(Array.isArray(freshBody.orders)?freshBody.orders[0]:null)||freshBody.order;if(fresh&&fresh.id){o=Object.assign({},o,fresh);var ix=state.orders.findIndex(function(x){return x.id===o.id});if(ix>=0)state.orders[ix]=o;writeCache(state.orders);paint()}}}catch(errFresh){}if((o.status==='waiting_boss_confirm'||o.status==='pending')&&!(o.grabs&&o.grabs.length)){try{var res=await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token()},body:JSON.stringify({action:'list_grabs',id:o.id})});var body=await res.json().catch(function(){return{}});if(res.ok&&body.ok!==false&&Array.isArray(body.grabs)){o.grabs=body.grabs;var idx=state.orders.findIndex(function(x){return x.id===o.id});if(idx>=0)state.orders[idx]=o}}catch(err){}}detail(o,false)})();return}var showRev=e.target.closest('[data-show-review]');if(showRev){var o2=state.orders.find(function(x){return x.id===showRev.getAttribute('data-show-review')});if(o2)openReviewModal(o2);return}var a=e.target.closest('[data-action]');if(a){submit(a.dataset.action,a.dataset.id,{companion_id:a.getAttribute('data-companion-id')||''});return}if(e.target.closest('[data-close]')||e.target===modal){modal.classList.remove('open');modal.setAttribute('aria-hidden','true');return}if(e.target.closest('[data-logout]')){if(window.MCJRoleGate){window.MCJRoleGate.logout('boss');window.MCJRoleGate.logout('customer')}localStorage.removeItem('mcjAuthAccessToken');localStorage.removeItem('mcjAuthRefreshToken');sessionStorage.removeItem('mcjAuthAccessToken');sessionStorage.removeItem('mcjAuthRefreshToken');location.href='index.html';return}});
      if(reviewForm){reviewForm.addEventListener('submit',function(e){e.preventDefault();submitReview(reviewOrderId)})}
      document.addEventListener('visibilitychange',function(){if(!document.hidden)load({silent:true})});
      window.addEventListener('pagehide',function(){if(abortCtrl)abortCtrl.abort();if(pollTimer)clearInterval(pollTimer)});
      var boot=readCache();
      if(boot&&boot.length){state.orders=boot;state.fromCache=true;state.loading=false;state.syncing=true}
      paint();
      load().then(function(){maybeOpenPendingReview()});
      pollTimer=setInterval(function(){if(!document.hidden)load({silent:true})},POLL_MS);
    })();
  </script>
