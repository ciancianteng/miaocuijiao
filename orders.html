<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的订单 - MEOW CUI JIAO</title>
  <link rel="stylesheet" href="src/style.css">
  <style>
    body{background:#08070a;color:#fff}.orders-shell{width:min(1080px,calc(100% - 32px));margin:0 auto;padding:24px 0 80px}.boss-nav{display:flex;gap:18px;flex:1;flex-wrap:wrap;align-items:center}.boss-nav a,.boss-nav button{border:0;background:transparent;color:#cdb8c4;cursor:pointer;font:inherit;font-size:14px;padding:0}.boss-nav a.active{color:#ffd6e7;font-weight:900}.orders-head{display:flex;justify-content:space-between;gap:16px;align-items:end;margin:18px 0}.orders-head h1{margin:0;font-size:28px}.orders-head p{margin:6px 0 0;color:#9ca3af}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.tab{border:1px solid rgba(255,255,255,.1);border-radius:10px;background:rgba(255,255,255,.045);color:#d8c8d1;padding:8px 10px;cursor:pointer;white-space:nowrap;flex:0 0 auto}.tab.active{border-color:rgba(255,143,197,.42);background:rgba(255,143,197,.15);color:#ffd6e7}.order-list{display:grid;gap:10px}.order-card{border:1px solid rgba(255,255,255,.1);border-radius:14px;background:rgba(255,255,255,.045);padding:14px}.order-card header{display:flex;justify-content:space-between;gap:12px;align-items:start}.order-card h3{margin:0 0 5px;font-size:18px}.order-card p{margin:0;color:#9ca3af}.order-grid{display:grid;grid-template-columns:1.2fr 1fr .8fr .9fr 1fr auto;gap:10px;align-items:center;margin-top:12px}.order-grid span{display:block;color:#9ca3af;font-size:12px}.order-grid strong{display:block;margin-top:4px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.order-status{border:1px solid rgba(255,143,197,.35);border-radius:999px;color:#ffd7e8;padding:5px 9px;white-space:nowrap;font-size:13px}.order-actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.order-btn{border:1px solid rgba(255,255,255,.12);border-radius:10px;background:rgba(255,255,255,.06);color:#fff;padding:8px 10px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;text-decoration:none}.order-btn.primary{border-color:rgba(255,143,197,.5);background:rgba(255,143,197,.16)}.order-empty{padding:22px;text-align:center;color:#9ca3af}.order-alert{border:1px solid rgba(255,143,197,.28);border-radius:14px;background:rgba(255,143,197,.08);padding:16px;color:#ffd6e8}.modal{position:fixed;inset:0;background:rgba(0,0,0,.68);display:none;align-items:center;justify-content:center;padding:18px;z-index:40}.modal.open{display:flex}.modal-box{width:min(720px,100%);max-height:86vh;overflow:auto;border:1px solid rgba(255,143,197,.26);border-radius:18px;background:#111014;padding:20px}.modal-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:12px}.modal-head h2{margin:0}.close{width:36px;height:36px;border:1px solid rgba(255,255,255,.12);border-radius:10px;background:rgba(255,255,255,.06);color:#fff;cursor:pointer}.detail-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.detail-item{border:1px solid rgba(255,255,255,.08);border-radius:12px;background:rgba(0,0,0,.18);padding:12px}.detail-item span{display:block;color:#9ca3af;font-size:12px}.detail-item strong{display:block;margin-top:5px;word-break:break-word}.wide{grid-column:1/-1}.status-panel{display:grid;gap:10px}.status-panel p{margin:0;color:#d8c8d1}.status-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.companion-pick{display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:center}.companion-avatar{width:56px;height:56px;border-radius:14px;background:rgba(255,255,255,.08);object-fit:cover;display:grid;place-items:center;color:#ffd6e7;font-weight:900}.companion-pick p{margin:4px 0 0;color:#9ca3af}@media(max-width:880px){.order-grid{grid-template-columns:1fr 1fr}.order-actions{justify-content:flex-start}.topbar{align-items:flex-start;flex-direction:column;padding:18px 20px}}@media(max-width:560px){.tabs{flex-wrap:nowrap;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch}.order-grid,.detail-grid{grid-template-columns:1fr}.orders-head{display:block}.order-card header{display:block}.order-status{display:inline-block;margin-top:8px}.order-btn{width:100%}.status-actions{display:grid}.companion-pick{grid-template-columns:48px 1fr}.companion-avatar{width:48px;height:48px}}
  </style>
</head>
<body>
  <header class="topbar"><a class="brand" href="index.html"><img src="assets/meow-cuijiao-brand.jpg" alt="MEOW CUI JIAO"><span>MEOW CUI JIAO</span></a><nav class="boss-nav"><a href="index.html">首页</a><a href="companion-center.html">陪玩大厅</a><a href="recharge.html">充值中心</a><a class="active" href="orders.html">我的订单</a><a href="support.html">在线客服</a><a href="mine.html">我的账号</a><button type="button" data-logout>退出登录</button></nav></header>
  <main class="orders-shell" id="ordersApp"></main>
  <div class="modal" id="detailModal" aria-hidden="true"><div class="modal-box"><div class="modal-head"><h2>订单详情</h2><button class="close" type="button" data-close>×</button></div><div id="detailBody"></div></div></div>
  <script src="src/role-gates.js"></script>
  <script>
    (function(){
      var root=document.getElementById('ordersApp'),modal=document.getElementById('detailModal'),detailBody=document.getElementById('detailBody');
      var state={loading:true,error:'',orders:[],filter:'all'};
      var tabs=[['all','全部'],['awaiting_payment','待付款'],['arranging','待客服安排'],['boss_confirm','待我确认'],['active','进行中'],['completed','已完成'],['after_sale','售后'],['cancelled','已取消']];
      var statusText={awaiting_payment:'待付款',pending:'待客服安排',claimed:'待客服安排',waiting_boss_confirm:'待我确认',confirmed:'进行中',in_progress:'进行中',completed:'已完成',cancelled:'已取消',refund_requested:'售后',refunded:'售后'};
      function token(){return localStorage.getItem('mcjAuthAccessToken')||sessionStorage.getItem('mcjAuthAccessToken')||''}
      function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
      function money(v){var n=Number(v||0);return 'RM'+(Number.isFinite(n)?n:0).toFixed(2)}
      function date(v){if(!v)return '-';try{return new Date(v).toLocaleString('zh-CN',{hour12:false})}catch(e){return v}}
      function visibleOrders(){return state.orders.filter(function(o){if(state.filter==='all')return true;if(state.filter==='arranging')return o.status==='pending'||o.status==='claimed';if(state.filter==='boss_confirm')return o.status==='waiting_boss_confirm';if(state.filter==='active')return o.status==='confirmed'||o.status==='in_progress';if(state.filter==='after_sale')return o.status==='refund_requested'||o.status==='refunded';return o.status===state.filter})}
      function paint(){root.innerHTML='<section class="orders-head"><div><h1>我的订单</h1><p>只显示当前老板账号的真实订单。</p></div><button class="order-btn" data-refresh type="button">刷新</button></section><div class="tabs">'+tabs.map(function(t){return '<button class="tab '+(state.filter===t[0]?'active':'')+'" type="button" data-filter="'+t[0]+'">'+t[1]+'</button>'}).join('')+'</div>'+bodyHtml()}
      function bodyHtml(){if(!token())return '<div class="order-alert">请先登录后查看我的订单。</div>';if(state.loading)return '<div class="order-empty">正在读取订单...</div>';if(state.error)return '<div class="order-alert">'+esc(state.error)+'</div>';var rows=visibleOrders();return '<section class="order-list">'+(rows.length?rows.map(card).join(''):'<div class="order-empty"><strong>暂无订单</strong></div>')+'</section>'}
      function companionName(o){return o.companion&&(o.companion.display_name||o.companion.email)||'待安排'}
      function serviceName(o){return o.customerService&&(o.customerService.display_name||o.customerService.email)||'待接入'}
      function actions(o){var out=['<button class="order-btn" data-detail="'+esc(o.id)+'" type="button">查看详情</button>'];if(o.status==='awaiting_payment')out.push('<a class="order-btn primary" href="recharge.html?order='+encodeURIComponent(o.id)+'">立即付款</a><a class="order-btn" href="support.html?order='+encodeURIComponent(o.id)+'">联系客服</a>');if(o.status==='waiting_boss_confirm')out.push('<button class="order-btn primary" data-action="confirm_companion" data-id="'+esc(o.id)+'">我要他</button><button class="order-btn" data-action="reject_companion" data-id="'+esc(o.id)+'">换一个</button>');if(o.status==='confirmed'||o.status==='in_progress')out.push('<a class="order-btn" href="support.html?order='+encodeURIComponent(o.id)+'">联系客服</a><button class="order-btn" data-action="request_refund" data-id="'+esc(o.id)+'">申请售后</button>');return out.join('')}
      function card(o){return '<article class="order-card"><header><div><h3>'+esc(o.orderNo||o.order_no||o.id)+'</h3><p>'+esc(o.createdAt?date(o.createdAt):'-')+'</p></div><span class="order-status">'+esc(statusText[o.status]||o.status||'-')+'</span></header><div class="order-grid"><div><span>游戏</span><strong title="'+esc(o.game||'-')+'">'+esc(o.game||'-')+'</strong></div><div><span>陪玩昵称</span><strong title="'+esc(companionName(o))+'">'+esc(companionName(o))+'</strong></div><div><span>金额</span><strong>'+money(o.totalAmount||o.amount)+'</strong></div><div><span>当前状态</span><strong>'+esc(statusText[o.status]||o.status||'-')+'</strong></div><div><span>创建时间</span><strong>'+esc(date(o.createdAt))+'</strong></div><div class="order-actions">'+actions(o)+'</div></div></article>'}
      function detail(o){detailBody.innerHTML='<div class="detail-grid"><div class="detail-item"><span>订单编号</span><strong>'+esc(o.orderNo||o.id)+'</strong></div><div class="detail-item"><span>游戏</span><strong>'+esc(o.game||'-')+'</strong></div><div class="detail-item"><span>订单类型</span><strong>'+esc(o.orderType||'custom')+'</strong></div><div class="detail-item"><span>时长</span><strong>'+esc(o.hours||'-')+' 小时</strong></div><div class="detail-item"><span>单价</span><strong>'+money(o.unitPrice)+'</strong></div><div class="detail-item"><span>总金额</span><strong>'+money(o.totalAmount||o.amount)+'</strong></div><div class="detail-item"><span>陪玩昵称</span><strong>'+esc(companionName(o))+'</strong></div><div class="detail-item"><span>客服昵称</span><strong>'+esc(serviceName(o))+'</strong></div><div class="detail-item"><span>订单状态</span><strong>'+esc(statusText[o.status]||o.status||'-')+'</strong></div><div class="detail-item"><span>创建时间</span><strong>'+esc(date(o.createdAt))+'</strong></div><div class="detail-item wide"><span>需求说明</span><strong>'+esc(o.description||'-')+'</strong></div>'+statusSection(o)+'<div class="detail-item wide"><span>聊天入口</span><strong><a href="support.html?order='+encodeURIComponent(o.id)+'">进入在线客服</a></strong></div></div>';modal.classList.add('open')}
      function statusSection(o){var html='';if(o.status==='awaiting_payment'){html='<div class="status-panel"><p>订单金额：'+money(o.totalAmount||o.amount)+'</p><p>支付方式：'+esc(o.paymentMethod||o.payment_method||'待选择')+'</p><div class="status-actions"><a class="order-btn primary" href="recharge.html?order='+encodeURIComponent(o.id)+'">立即付款</a><a class="order-btn" href="support.html?order='+encodeURIComponent(o.id)+'">联系客服</a></div></div>'}else if(o.status==='pending'||o.status==='claimed'){html='<div class="status-panel"><p>客服正在为你安排陪玩，请耐心等待。</p></div>'}else if(o.status==='waiting_boss_confirm'){var c=o.companion||{};var avatar=c.avatar_url?'<img class="companion-avatar" src="'+esc(c.avatar_url)+'" alt="">':'<div class="companion-avatar">'+esc((companionName(o)||'陪').slice(0,1))+'</div>';html='<div class="status-panel"><div class="companion-pick">'+avatar+'<div><strong>'+esc(companionName(o))+'</strong><p>等级：'+esc(c.level_name||'-')+' · 游戏：'+esc(o.game||'-')+' · 价格：'+money(o.unitPrice)+'</p></div></div><div class="status-actions"><button class="order-btn primary" data-action="confirm_companion" data-id="'+esc(o.id)+'">我要他</button><button class="order-btn" data-action="reject_companion" data-id="'+esc(o.id)+'">换一个</button></div></div>'}else if(o.status==='confirmed'||o.status==='in_progress'){html='<div class="status-panel"><p>当前陪玩：'+esc(companionName(o))+'</p><p>开始时间：'+esc(date(o.startedAt||o.started_at))+'</p><p>订单时长：'+esc(o.hours||'-')+' 小时</p><div class="status-actions"><a class="order-btn" href="support.html?order='+encodeURIComponent(o.id)+'">联系客服</a><button class="order-btn" data-action="request_refund" data-id="'+esc(o.id)+'">申请售后</button></div></div>'}else if(o.status==='completed'){html='<div class="status-panel"><p>完成时间：'+esc(date(o.completedAt||o.completed_at))+'</p></div>'}else if(o.status==='refund_requested'||o.status==='refunded'){html='<div class="status-panel"><p>售后类型：退款申请 / 投诉 / 补单</p><p>处理进度：'+esc(o.status==='refunded'?'已处理':'客服处理中')+'</p><p>客服回复：请在在线客服中查看最新回复。</p></div>'}else if(o.status==='cancelled'){html='<div class="status-panel"><p>取消原因：'+esc(o.cancelReason||o.cancel_reason||'订单已取消')+'</p><p>取消时间：'+esc(date(o.cancelledAt||o.cancelled_at))+'</p></div>'}return '<div class="detail-item wide"><span>当前处理</span>'+html+'</div>'}
      async function load(){if(!token()){state.loading=false;paint();return}state.loading=true;state.error='';paint();try{var res=await fetch('/api/orders',{headers:{Accept:'application/json',Authorization:'Bearer '+token()}});var body=await res.json().catch(function(){return {}});if(!res.ok||body.ok===false)throw new Error(body.message||'订单读取失败');state.orders=body.orders||[]}catch(err){state.error=err.message||'订单读取失败'}finally{state.loading=false;paint()}}
      async function submit(action,id){try{var res=await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token()},body:JSON.stringify({action:action,id:id})});var body=await res.json().catch(function(){return {}});if(!res.ok||body.ok===false)throw new Error(body.message||'操作失败');await load()}catch(err){alert(err.message||'操作失败')}}
      document.addEventListener('click',function(e){var f=e.target.closest('[data-filter]');if(f){state.filter=f.dataset.filter;paint();return}if(e.target.closest('[data-refresh]')){load();return}var d=e.target.closest('[data-detail]');if(d){var o=state.orders.find(function(x){return x.id===d.dataset.detail});if(o)detail(o);return}var a=e.target.closest('[data-action]');if(a){submit(a.dataset.action,a.dataset.id);return}if(e.target.closest('[data-close]')||e.target===modal){modal.classList.remove('open');return}if(e.target.closest('[data-logout]')){if(window.MCJRoleGate){window.MCJRoleGate.logout('boss');window.MCJRoleGate.logout('customer')}localStorage.removeItem('mcjAuthAccessToken');localStorage.removeItem('mcjAuthRefreshToken');sessionStorage.removeItem('mcjAuthAccessToken');sessionStorage.removeItem('mcjAuthRefreshToken');location.href='index.html';return}});
      load();
    })();
  </script>
  <script src="src/meow-butler.js?v=20260711-floating" defer></script>
</body>
</html>
