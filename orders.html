  <script src="src/order-status.js"></script>
  <script>
    (function(){
      var root=document.getElementById('ordersApp'),modal=document.getElementById('detailModal'),detailBody=document.getElementById('detailBody'),detailFooter=document.getElementById('detailFooter');
      var reviewModal=document.getElementById('reviewModal'),reviewForm=document.getElementById('reviewForm'),reviewOrderMeta=document.getElementById('reviewOrderMeta'),reviewStars=document.getElementById('reviewStars'),reviewRating=document.getElementById('reviewRating'),reviewContent=document.getElementById('reviewContent'),reviewState=document.getElementById('reviewState'),reviewSubmitBtn=document.getElementById('reviewSubmitBtn');
      var multiReviewPickModal=document.getElementById('multiReviewPickModal'),multiReviewPickList=document.getElementById('multiReviewPickList'),multiReviewPickHint=document.getElementById('multiReviewPickHint'),multiReviewPickFoot=document.getElementById('multiReviewPickFoot');
      var unavailableModal=document.getElementById('unavailableModal');
      var CACHE_KEY='mcjBossOrdersCache';
      var POLL_MS=8000;
      var abortCtrl=null;
      var loadGen=0;
      var pollTimer=null;
      var reviewOrderId='';
      var reviewReturnParentId='';
      var pendingUnavailable=null;
      var openDetailId='';
      var seenUnavailableKeys=(function(){try{return JSON.parse(sessionStorage.getItem('mcjSeenUnavailable')||'{}')||{}}catch(e){return {}}});
      var prevChildSnap={};
      var pendingOpenReviewId=(function(){try{return String(new URLSearchParams(location.search).get('openReview')||'').trim()}catch(e){return ''}})();
      var state={loading:true,error:'',orders:[],filter:(function(){var f=new URLSearchParams(location.search).get('filter')||'all';var ok=['all','awaiting_payment','payment_review','arranging','waiting_companion','boss_confirm','active','completed','after_sale','cancelled'];return ok.indexOf(f)>=0?f:'all'})(),fromCache:false,syncing:false};
      var tabs=[['all','全部'],['awaiting_payment','待付款'],['payment_review','待客服审核'],['arranging','待客服处理'],['waiting_companion','等待陪玩确认'],['boss_confirm','等待老板选择'],['active','进行中'],['completed','已完成'],['after_sale','售后'],['cancelled','已取消']];
      var statusText=(window.MCJOrderStatus&&window.MCJOrderStatus.LABELS)||{awaiting_payment:'待付款',payment_review:'待客服审核',pending:'待客服处理',claimed:'等待陪玩确认',waiting_boss_confirm:'等待老板选择',confirmed:'进行中',in_progress:'进行中',completed:'已完成',reviewed:'已评价',cancelled:'已取消',refund_requested:'售后',refunded:'已退款'};
      function token(){return localStorage.getItem('mcjAuthAccessToken')||sessionStorage.getItem('mcjAuthAccessToken')||''}
      function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
      function money(v){if(window.MCJCurrency)return window.MCJCurrency.formatPlain(v);var n=Number(v||0);return (Number.isFinite(n)?n:0).toFixed(2).replace(/\.00$/,'')+' 猫粮'}
      function moneyEmoji(v){if(window.MCJCurrency)return window.MCJCurrency.formatAmount(v);return '🐱 '+money(v)}
      function date(v){if(!v)return '-';try{return new Date(v).toLocaleString('zh-CN',{hour12:false})}catch(e){return v}}
      function voiceModeLabel(o){
        var m=String((o&& (o.voiceMode||o.voice_mode))||'game_mic').toLowerCase();
        if(m==='discord')return 'Discord语音房';
        if(m==='none')return '仅平台文字聊天'; // legacy
        return '游戏麦';
      }
      function startDiscordOAuthFromOrders(returnTo){
        return fetch('/api/discord/oauth-start?format=json&returnTo='+encodeURIComponent(returnTo||'/orders.html'),{
          headers:{Accept:'application/json',Authorization:'Bearer '+token()}
        }).then(function(r){return r.json().then(function(j){if(!r.ok||j.ok===false)throw new Error((j&&j.message)||'无法开始 Discord 连接');return j;});})
          .then(function(j){if(j.authorizeUrl)location.href=j.authorizeUrl;else throw new Error('Discord 授权地址缺失');});
      }
      function isPaymentReview(o){return !!(o&&(o.paymentReview||o.paymentStatus==='待审核'||o.paymentStatus==='待人工审核'||o.paymentStatus==='待客服审核'||/待审核|待人工审核|待客服审核/.test(String(o.statusText||o.paymentStatus||''))))}
      function orderLabel(o){
        if(o.reviewed||o.status==='reviewed')return '已评价';
        if(o.status==='in_progress'&&o.completionPending)return o.autoConfirmPaused?'等待处理订单问题':'等待您确认完成';
        if(isPaymentReview(o)&&o.status==='awaiting_payment')return '待客服审核';
        return o.statusText||statusText[o.status]||o.status||'-';
      }
      function canReview(o){return !!(o&&(o.canReview||(o.status==='completed'&&!o.reviewed&&(o.companionId||o.companion_id||(o.companion&&o.companion.id)))))}
      function isReviewEligibleChild(ch){
        if(!ch)return false;
        var k=childConfirmKey(ch);
        if(k==='exited'||k==='exited_kept'||k==='awaiting_payment'||k==='not_ready')return false;
        var s=String(ch.status||'');
        if(/^(cancelled|refunded|refund_requested)$/.test(s))return false;
        if(!(ch.companionId||ch.companion_id||(ch.companion&&(ch.companion.id||ch.companion.user_id))))return false;
        return s==='completed'||s==='reviewed'||!!ch.reviewed||!!ch.canReview;
      }
      function multiReviewTargets(parent){
        return childrenOf(parent&&parent.id).filter(isReviewEligibleChild);
      }
      function multiReviewStats(parent){
        var targets=multiReviewTargets(parent);
        var done=targets.filter(function(ch){return !!(ch.reviewed||ch.status==='reviewed')}).length;
        var pending=targets.filter(canReview).length;
        if(parent&&parent.multiReview&&parent.multiReview.total!=null&&!targets.length){
          return {
            targets:targets,
            done:Number(parent.multiReview.done)||0,
            total:Number(parent.multiReview.total)||0,
            pending:Number(parent.multiReview.pending)!=null?Number(parent.multiReview.pending):Math.max(0,(Number(parent.multiReview.total)||0)-(Number(parent.multiReview.done)||0))
          };
        }
        return {targets:targets,done:done,total:targets.length,pending:pending};
      }
      function reviewCtaLabel(o){
        if(!o)return '';
        if(isMultiParent(o)){
          var st=multiReviewStats(o);
          if(!st.total)return '';
          if(st.pending<=0)return '查看评价';
          if(st.done>0)return '继续评价 '+st.done+'/'+st.total;
          return '评价陪玩';
        }
        if(canReview(o))return '评价陪玩';
        if(o.reviewed||o.status==='reviewed')return '已评价';
        return '';
      }
      function canOpenReviewFlow(o){
        if(!o)return false;
        if(isMultiParent(o))return multiReviewStats(o).total>0;
        return canReview(o);
      }
      function findOrderById(id){
        var sid=String(id||'');
        var top=state.orders.find(function(x){return String(x.id)===sid});
        if(top)return top;
        for(var i=0;i<state.orders.length;i++){
          var kids=state.orders[i]&&state.orders[i].children;
          if(!Array.isArray(kids))continue;
          var hit=kids.find(function(c){return String(c.id)===sid});
          if(hit)return hit;
        }
        return null;
      }
      function parentOfChildId(childId){
        var sid=String(childId||'');
        for(var i=0;i<state.orders.length;i++){
          var p=state.orders[i];
          if(!isMultiParent(p))continue;
          if(childrenOf(p.id).some(function(c){return String(c.id)===sid}))return p;
        }
        return null;
      }
      function remainingLabel(o){
        if(o.autoConfirmRemainingLabel)return o.autoConfirmRemainingLabel;
        var ms=Number(o.autoConfirmRemainingMs);
        if(!Number.isFinite(ms)||ms<0)return '';
        var totalMin=Math.max(0,Math.ceil(ms/60000));
        var h=Math.floor(totalMin/60),m=totalMin%60;
        return h<=0?(m+'分钟'):(h+'小时'+m+'分钟');
      }
      function statusReason(o){
        var s=String(o.status||'');
        if(isPaymentReview(o)&&s==='awaiting_payment')return '付款凭证已提交，等待客服审核。客服通过前不会进入等待陪玩确认。';
        if(o.paymentRejectReason&&s==='awaiting_payment')return '付款凭证已驳回：'+String(o.paymentRejectReason)+'。请重新上传。';
        if(s==='in_progress'&&o.completionPending){
          if(o.autoConfirmPaused)return o.autoConfirmPausedReason||'订单问题处理中，自动确认已暂停，请等待客服或后台处理。';
          var left=remainingLabel(o);
          return left
            ?('陪玩已申请完成，请确认本次服务。若订单没有问题，系统将在 '+left+' 后自动确认完成。')
            :'陪玩已申请完成，请确认本次服务。';
        }
        if(isMultiParent(o)&&s==='in_progress'){
          var st=multiBossConfirmState(o);
          if(st.canConfirm)return '全部有效陪玩已申请完成，请确认完成订单。';
          if(st.total>0&&!st.allReady)return '等待陪玩完成 '+st.ready+'/'+st.total+'。全部完成后才会开放确认完成。';
        }
        if(o.bossHint)return o.bossHint;
        if(s==='awaiting_payment')return '待付款：请先查看支付信息并上传付款截图';
        if(s==='pending')return '抢单中：付款已确认，等待陪玩抢单；可查看抢单人数';
        if(s==='waiting_boss_confirm')return '等待老板选择：有陪玩抢单，请查看后点击「我要她」';
        if(s==='confirmed')return '进行中：陪玩已确认接单';
        if(s==='in_progress')return '进行中';
        if(s==='claimed')return '等待陪玩确认：客服已审核通过，正在等待陪玩确认接单';
        if(s==='completed')return canReview(o)?'服务已完成，可立即评价':'服务已完成';
        if(s==='reviewed'||o.reviewed)return '已评价';
        if(s==='cancelled')return '订单已取消';
        if(s==='refund_requested')return '售后处理中，请联系客服';
        if(s==='refunded')return '已退款';
        return '请查看详情了解下一步';
      }
      function recoverParentIdFromBlob(o){
        var blob=String((o&&(o.description||''))||'')+'\n'+String((o&&(o.note||''))||'');
        var m=blob.match(/\[\[PARENT_ORDER\]\]([0-9a-f-]{36})/i);
        return m?String(m[1]):'';
      }
      function normalizeOrdersList(rows){
        return (rows||[]).map(function(o){
          if(!o||typeof o!=='object')return o;
          var pid=String(o.parentOrderId||o.parent_order_id||'')||recoverParentIdFromBlob(o);
          var next=o;
          if(pid&&!(o.parentOrderId||o.parent_order_id)){
            next=Object.assign({},o,{parentOrderId:pid,parent_order_id:pid,isMultiGroupChild:true});
          }else if(pid){
            next=Object.assign({},o,{isMultiGroupChild:true});
          }
          var isParent=!!(next.isMultiGroupParent||(String(next.orderTypeKey||next.order_type||'').toLowerCase()==='multi_group'&&!pid));
          if(isParent)next=Object.assign({},next,{isMultiGroupParent:true});
          return next;
        });
      }
      function isMultiParent(o){return !!(o&&(o.isMultiGroupParent||(String(o.orderTypeKey||o.order_type||'').toLowerCase()==='multi_group'&&!(o.parentOrderId||o.parent_order_id))))}
      function isMultiChild(o){return !!(o&&(o.isMultiGroupChild||o.parentOrderId||o.parent_order_id||recoverParentIdFromBlob(o)))}
      function parentIdOf(o){return String((o&&(o.parentOrderId||o.parent_order_id))||'')||recoverParentIdFromBlob(o)}
      function childrenOf(parentId){
        var pid=String(parentId||'');
        var fromList=state.orders.filter(function(o){return parentIdOf(o)===pid});
        if(fromList.length)return fromList;
        var parent=state.orders.find(function(o){return String(o.id)===pid});
        if(parent&&Array.isArray(parent.children)&&parent.children.length)return parent.children;
        return [];
      }
      function childServiceDone(ch){
        var s=String(ch&&ch.status||'');
        if(s==='completed'||s==='reviewed'||(ch&&ch.reviewed))return true;
        return s==='in_progress'&&!!(ch&&ch.completionPending);
      }
      function multiBossConfirmState(parent){
        var kids=childrenOf(parent&&parent.id);
        var effective=kids.filter(function(ch){
          var k=childConfirmKey(ch);
          return k!=='exited'&&k!=='exited_kept'&&k!=='awaiting_payment'&&k!=='not_ready';
        });
        var ready=effective.filter(childServiceDone).length;
        var total=effective.length;
        var needBoss=effective.some(function(ch){return String(ch.status||'')==='in_progress'&&!!ch.completionPending});
        return {
          kids:kids,
          effective:effective,
          ready:ready,
          total:total,
          allReady:total>0&&ready===total,
          canConfirm:total>0&&ready===total&&needBoss
        };
      }
      function multiParentStatusLabel(o,kids){
        // Authoritative payment/review status wins — never show 0/N companion wait while unpaid/reviewing.
        if(String(o.status||'')==='awaiting_payment'){
          return isPaymentReview(o)?'待客服审核':'待付款';
        }
        var base=orderLabel(o);
        if(!kids||!kids.length)return base;
        var effective=kids.filter(function(ch){var k=childConfirmKey(ch);return k!=='exited'&&k!=='exited_kept'&&k!=='awaiting_payment'&&k!=='not_ready'});
        var confirmed=effective.filter(function(ch){return childConfirmKey(ch)==='accepted'}).length;
        var waiting=effective.filter(function(ch){return childConfirmKey(ch)==='pending'}).length;
        var total=effective.length||0;
        var completed=kids.filter(function(ch){var s=String(ch.status||'');return s==='completed'||s==='reviewed'||ch.reviewed}).length;
        var refunded=kids.filter(function(ch){var s=String(ch.status||'');return s==='refunded'||s==='refund_requested'}).length;
        var needsRep=kids.some(function(ch){return childNeedsReplacement(ch)});
        var bossState=multiBossConfirmState(o);
        if(needsRep)return '当前陪玩无法接单，请重新选择（'+confirmed+'/'+total+'）';
        if(String(o.status||'')==='claimed'&&total>0)return '等待陪玩确认（'+confirmed+'/'+total+'）';
        if(bossState.canConfirm)return '等待您确认完成（'+bossState.ready+'/'+bossState.total+'）';
        if(String(o.status||'')==='in_progress'&&bossState.total>0&&!bossState.allReady){
          return '等待陪玩完成（'+bossState.ready+'/'+bossState.total+'）';
        }
        if(confirmed>0&&confirmed===total&&String(o.status||'')!=='completed')return '进行中（'+confirmed+'/'+total+'）';
        if(refunded&&completed&&completed+refunded===kids.length)return '部分退款';
        if(refunded&&refunded<kids.length)return '部分退款';
        if(completed&&completed<kids.length)return '部分完成';
        return base;
      }
      function childNoteBlob(ch){return String((ch&&(ch.note||''))||'')+'\n'+String((ch&&(ch.description||''))||'')+'\n'+String((ch&&(ch.cancelReason||ch.cancel_reason||''))||'')}
      function childConfirmKey(ch){
        if(!ch)return 'other';
        if(ch.companionConfirm&&ch.companionConfirm.key){
          var ck=String(ch.companionConfirm.key);
          if(ck==='pending'&&String(ch.status||'')==='awaiting_payment')return 'awaiting_payment';
          return ck;
        }
        var s=String(ch.status||'');
        var blob=childNoteBlob(ch);
        var unavailable=blob.indexOf('[[COMPANION_UNAVAILABLE]]')>=0||/无法接单|已退出/.test(String(ch.cancelReason||ch.cancel_reason||''));
        var keepDone=blob.indexOf('[[KEEP_REMAINING_APPLIED]]')>=0;
        if((s==='cancelled'||s==='refunded')&&(unavailable||keepDone))return keepDone?'exited_kept':'exited';
        if(s==='confirmed'||s==='accepted'||s==='in_progress'||s==='completed'||s==='reviewed'||ch.reviewed)return 'accepted';
        if(s==='claimed')return 'pending';
        if(s==='awaiting_payment')return 'awaiting_payment';
        if(s==='pending'||s==='waiting_boss_confirm')return 'not_ready';
        if(s==='cancelled'||s==='refunded')return 'exited';
        return 'other';
      }
      function childNeedsReplacement(ch){
        if(ch&&ch.needsReplacement)return true;
        if(ch&&ch.companionConfirm&&ch.companionConfirm.needsReplacement)return true;
        return childConfirmKey(ch)==='exited';
      }
      function companionAvatarHtml(ch){
        var name=companionName(ch);
        var url=(ch.companion&&(ch.companion.avatar_url||ch.companion.avatarUrl))||ch.avatarUrl||ch.avatar_url||'';
        // Prefer real avatar; never fall back to card/cover (full-bleed photos blow mobile cards).
        if(url)return '<span class="od-confirm-avatar"><img src="'+esc(url)+'" alt="" width="40" height="40" loading="lazy" decoding="async"></span>';
        return '<span class="od-confirm-avatar" aria-hidden="true">'+esc((name||'?').slice(0,1))+'</span>';
      }
      function confirmIconHtml(key){
        if(key==='accepted')return '<span class="od-confirm-icon check" title="已确认" aria-label="已确认">✅</span>';
        if(key==='pending')return '<span class="od-confirm-icon clock" title="等待确认" aria-label="等待确认">🕐</span>';
        return '<span class="od-confirm-icon" aria-hidden="true">·</span>';
      }
      function multiConfirmQueueHtml(parent){
        // Hide companion confirmation UI until CS approved payment (parent claimed+).
        if(String(parent.status||'')==='awaiting_payment'||isPaymentReview(parent))return '';
        if(['claimed','confirmed','in_progress','completed','reviewed'].indexOf(String(parent.status||''))<0)return '';
        var kids=childrenOf(parent.id);
        if(!kids.length)return '';
        var activeRows=[];
        var historyRows=[];
        var replaceSlots=[];
        kids.forEach(function(ch){
          var key=childConfirmKey(ch);
          historyRows.push(ch);
          if(key==='exited'||childNeedsReplacement(ch)){
            replaceSlots.push(ch);
            return;
          }
          if(key==='exited_kept'||key==='awaiting_payment'||key==='not_ready')return;
          if(key==='pending'||key==='accepted'||key==='other'){
            activeRows.push({ch:ch,key:key});
          }
        });
        var html='<div class="od-module" data-multi-confirm-queue="1"><h3>陪玩确认状态</h3><div class="od-confirm-list">';
        activeRows.forEach(function(row){
          html+='<div class="od-confirm-row" data-child-id="'+esc(row.ch.id)+'" data-confirm-key="'+esc(row.key)+'">'+
            companionAvatarHtml(row.ch)+
            '<div class="od-confirm-name" title="'+esc(companionName(row.ch))+'">'+esc(companionName(row.ch))+'</div>'+
            confirmIconHtml(row.key)+
          '</div>';
        });
        replaceSlots.forEach(function(ch){
          html+='<button class="od-replace-slot" type="button" data-reselect-companion="1" data-parent-id="'+esc(parent.id)+'" data-child-id="'+esc(ch.id)+'">+ 重新选择陪玩</button>';
        });
        html+='</div>';
        if(replaceSlots.length){
          var remainingOk=activeRows.some(function(r){return r.key==='accepted'||r.key==='pending'});
          if(remainingOk){
            html+='<div class="od-keep-remaining"><button class="order-btn" type="button" data-keep-remaining="1" data-parent-id="'+esc(parent.id)+'" data-child-id="'+esc(replaceSlots[0].id)+'">放弃增加该陪玩</button></div>';
          }
          html+='<p class="order-hint">有陪玩无法接单时，可补位加入原联合订单，或只保留其余陪玩。其他陪玩确认状态不会被重置。</p>';
        }
        html+='</div>';
        // History always retains exited children for audit / refund.
        var exitedHist=historyRows.filter(function(ch){var k=childConfirmKey(ch);return k==='exited'||k==='exited_kept'});
        if(exitedHist.length){
          html+='<div class="od-module"><h3>退出陪玩记录</h3><div class="od-confirm-list">';
          exitedHist.forEach(function(ch){
            html+='<div class="od-confirm-row od-history-exit" data-child-id="'+esc(ch.id)+'">'+
              companionAvatarHtml(ch)+
              '<div class="od-confirm-name" title="'+esc(companionName(ch))+'">'+esc(companionName(ch))+' · 无法接单 / 已退出</div>'+
              '<span class="od-confirm-icon" aria-hidden="true">—</span></div>';
          });
          html+='</div></div>';
        }
        return html;
      }
      function rememberUnavailable(key){
        seenUnavailableKeys[key]=Date.now();
        try{sessionStorage.setItem('mcjSeenUnavailable',JSON.stringify(seenUnavailableKeys))}catch(e){}
      }
      function openUnavailableModal(ctx){
        pendingUnavailable=ctx||null;
        if(!unavailableModal)return;
        var body=document.getElementById('unavailableBody');
        if(body)body.textContent='当前陪玩无法接单，请重新选择陪玩。';
        unavailableModal.classList.add('open');
        unavailableModal.setAttribute('aria-hidden','false');
      }
      function closeUnavailableModal(){
        if(!unavailableModal)return;
        unavailableModal.classList.remove('open');
        unavailableModal.setAttribute('aria-hidden','true');
      }
      function startReplacementFlow(parentId,childId){
        try{
          sessionStorage.setItem('mcjReplaceSlot',JSON.stringify({
            mode:'replacement',
            parentOrderId:String(parentId||''),
            replaceChildId:String(childId||''),
            at:Date.now()
          }));
        }catch(e){}
        location.href='companion-center.html?mode=replace&parentOrder='+encodeURIComponent(parentId||'')+'&replaceChild='+encodeURIComponent(childId||'');
      }
      async function submitKeepRemaining(parentId,childId){
        if(!confirm('确认放弃增加该陪玩？该陪玩子单费用将退回猫粮，其余已确认陪玩继续，不会整组取消。'))return;
        try{
          var res=await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token()},body:JSON.stringify({action:'keep_remaining',parentOrderId:parentId,exitedChildId:childId})});
          var body=await res.json().catch(function(){return{}});
          if(!res.ok||body.ok===false)throw new Error(body.message||'操作失败');
          await load({silent:true});
          alert(body.message||'已只保留其余陪玩继续');

      function detectUnavailableTransitions(orders){
        var list=Array.isArray(orders)?orders:[];
        var byId={};
        list.forEach(function(o){byId[String(o.id)]=o});
        list.forEach(function(o){
          if(!isMultiChild(o))return;
          var key=String(o.id);
          var nowKey=childConfirmKey(o);
          var prev=prevChildSnap[key];
          prevChildSnap[key]=nowKey;
          if(nowKey!=='exited')return;
          if(prev&&prev!=='exited'&&prev!=='exited_kept'){
            var uk='exit:'+key;
            if(seenUnavailableKeys[uk])return;
            // Still have other effective companions → never show「订单已取消」.
            var pid=parentIdOf(o);
            var siblings=childrenOf(pid).filter(function(ch){return String(ch.id)!==key});
            var othersAlive=siblings.some(function(ch){var k=childConfirmKey(ch);return k==='pending'||k==='accepted'});
            rememberUnavailable(uk);
            if(othersAlive||siblings.length){
              openUnavailableModal({parentId:pid,childId:o.id,companionName:companionName(o)});
              var parent=byId[pid]||state.orders.find(function(x){return String(x.id)===pid});
              if(parent&&modal.classList.contains('open')){
                try{detail(parent,false)}catch(e){}
              }
            }
          }
        });
      }

          if(state.filter==='payment_review')return isPaymentReview(o)&&o.status==='awaiting_payment';
          if(state.filter==='waiting_companion')return o.status==='claimed';

      function readCache(){try{var raw=localStorage.getItem(CACHE_KEY);if(!raw)return null;var data=JSON.parse(raw);return Array.isArray(data)?data:null}catch(e){return null}}
      function writeCache(rows){try{localStorage.setItem(CACHE_KEY,JSON.stringify(rows||[]))}catch(e){}}
      function isRealLoadFailure(err,res){
        if(res&&res.status>=500)return true;
        if(res&&(res.status===0||res.status===408||res.status===504))return true;
        var msg=String((err&&err.message)||'');
        if(/Failed to fetch|NetworkError|network|TypeError/i.test(msg))return true;
        if(err&&err.name==='TypeError')return true;
        return !!(res&&!res.ok&&res.status>=500);
      }
      async function load(opts){
        opts=opts||{};
        if(!token()){state.loading=false;state.error='';state.orders=[];paint();return}
        var gen=++loadGen;
        if(abortCtrl)abortCtrl.abort();
        abortCtrl=typeof AbortController!=='undefined'?new AbortController():null;
        var cached=readCache();
        if(cached&&cached.length&&!state.orders.length){state.orders=normalizeOrdersList(cached);state.fromCache=true;state.loading=false;state.syncing=true;state.error='';paint()}
        else if(!opts.silent){state.loading=!state.orders.length;state.syncing=!!state.orders.length;state.error='';paint()}
        else{state.syncing=true;state.error=''}
        try{
          var res=await fetch('/api/orders',{headers:{Accept:'application/json',Authorization:'Bearer '+token()},cache:'no-store',signal:abortCtrl?abortCtrl.signal:undefined});
          var body=await res.json().catch(function(){return {}});
          if(gen!==loadGen)return;
          if(res.ok&&body.ok!==false){
            state.orders=normalizeOrdersList(Array.isArray(body.orders)?body.orders:[]);
            state.fromCache=false;state.error='';state.loading=false;state.syncing=false;
            writeCache(state.orders);
            detectUnavailableTransitions(state.orders);
            paint();
            if(modal.classList.contains('open')&&openDetailId){
              var focused=state.orders.find(function(x){return String(x.id)===String(openDetailId)});
              if(focused){
                try{detail(focused,false)}catch(eRefresh){}
              }
            }
            var focusId=new URLSearchParams(location.search).get('id')||'';
            if(focusId&&!opts.silent){
              var focusOrder=state.orders.find(function(x){return String(x.id)===String(focusId)||String(x.orderNo||x.order_no||'')===String(focusId)});
              if(focusOrder&&isMultiChild(focusOrder)){
                var pFocus=state.orders.find(function(x){return String(x.id)===parentIdOf(focusOrder)});
                if(pFocus)focusOrder=pFocus;
              }
              if(focusOrder){
                try{detail(focusOrder)}catch(eDetail){}
                var el=document.querySelector('[data-order-id="'+String(focusOrder.id).replace(/"/g,'')+'"]');
                if(el)el.scrollIntoView({behavior:'smooth',block:'center'});
              }else{
                var el2=document.querySelector('[data-order-id="'+String(focusId).replace(/"/g,'')+'"]');
                if(el2)el2.scrollIntoView({behavior:'smooth',block:'center'});
              }
            }
            return;
          }
          // Failed response: only hard-fail UI for 5xx / network-class statuses.
          var msg=body.message||('订单读取失败 (HTTP '+res.status+')');
          state.loading=false;state.syncing=false;
          if(!state.orders.length){
            if(res.status===401||res.status===403){state.error=msg;paint();return}
            if(res.status>=500||res.status===0||res.status===408||res.status===504||isRealLoadFailure(null,res)){
              state.error=msg||'订单加载失败，请重试';paint();return;
            }
            // Other non-OK without prior cache: still surface retry (real API failure), not fake rows.
            state.error=msg||'订单加载失败，请重试';paint();
            return;
          }
          paint();
        }catch(err){
          if(gen!==loadGen)return;
          // Aborted because a newer load() started — never treat as failure.
          if(err&&err.name==='AbortError')return;
          state.loading=false;state.syncing=false;
          if(!state.orders.length){
            state.error=isRealLoadFailure(err,null)?(err.message||'订单加载失败，请重试'):'订单加载失败，请重试';
            paint();
          }else paint();
        }
      }

          if(action==='want_him'||action==='confirm_companion'||action==='select_grabber'){if(!confirm('确认「我要她」？将正式指定该陪玩，并等待陪玩确认接单。'))return}

          submitBusy=true;
          var res=await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token()},body:JSON.stringify(payload)});
          var body=await res.json().catch(function(){return {}});

            throw new Error(body.message||'操作失败');
          }
          await load();
          if(action==='cancel_order'){alert(body.message||'订单已取消。');if(modal.classList.contains('open')){var cancelled=state.orders.find(function(x){return x.id===id});if(cancelled)detail(cancelled,false)}return}
          if(action==='want_him'||action==='confirm_companion'||action==='select_grabber'){alert(body.message||'已指定陪玩，等待陪玩确认接单。')}
          if(action==='report_order_problem'){alert(body.message||'已暂停自动确认，请联系客服。');location.href=body.supportUrl||('support.html?order='+encodeURIComponent(id));return}
          if(action==='confirm_completion'){
            var done=state.orders.find(function(x){return x.id===id})||body.order;
            paint();
            if(done&&String(done.status||'')==='completed'){
              try{document.querySelector('[data-filter="completed"]')?.click?.()}catch(eTab){}
            }
            if(done&&canOpenReviewFlow(done)){openReviewFlow(done)}
            else if(done&&modal.classList.contains('open')){detail(done,false)}
            alert(body.message||'已确认完成，订单已完成。');
          }else if(modal.classList.contains('open')){var cur=state.orders.find(function(x){return x.id===id});if(cur)detail(cur)}
        }catch(err){alert(err.message||'操作失败')}
        finally{submitBusy=false}
      }

        if(multiReviewPickHint){
          multiReviewPickHint.textContent=st.pending<=0
            ?('已完成全部陪玩评价（'+st.done+'/'+st.total+'）')
            :(st.done>0?('请继续评价剩余陪玩（'+st.done+'/'+st.total+'）'):'请选择要评价的陪玩');
        }
        if(multiReviewPickFoot){
          multiReviewPickFoot.textContent=st.total?(st.done+'/'+st.total+' 已评价'):'';
        }
        multiReviewPickList.innerHTML=st.targets.map(function(ch){
          var done=!!(ch.reviewed||ch.status==='reviewed');
          var can=canReview(ch);
          var btn=done
            ?'<span class="pick-done">✅ 已评价</span>'
            :(can
              ?'<button class="order-btn primary" type="button" data-review-child="'+esc(ch.id)+'">去评价</button>'
              :'<span>暂不可评</span>');
          return '<div class="pick-row">'+companionAvatarHtml(ch)+
            '<div class="pick-copy"><strong>'+esc(companionName(ch))+'</strong>'+
            '<span>'+esc(ch.serviceType||ch.game||'陪玩服务')+(done&&ch.reviewRating?(' · '+ch.reviewRating+' 星'):'')+'</span></div>'+
            btn+'</div>';
        }).join('')||'<div class="pick-row"><div class="pick-copy"><strong>暂无可评价陪玩</strong><span>仅实际完成服务的陪玩可评价</span></div></div>';
        multiReviewPickModal.classList.add('open');
        multiReviewPickModal.setAttribute('aria-hidden','false');
      }
      function closeMultiReviewPicker(){
        if(!multiReviewPickModal)return;
        multiReviewPickModal.classList.remove('open');
        multiReviewPickModal.setAttribute('aria-hidden','true');
      }
      function openReviewFlow(o){
        if(!o)return;
        if(isMultiParent(o)){
          openMultiReviewPicker(o);
          return;
        }
        openReviewModal(o);
      }
      function openReviewModal(o){
        if(!o||!reviewModal)return;
        if(isMultiParent(o)){openMultiReviewPicker(o);return}
        if(!canReview(o))return;
        reviewOrderId=o.id;
        var parent=parentOfChildId(o.id);
        if(parent)reviewReturnParentId=String(parent.id||'');
        if(reviewOrderMeta){
          reviewOrderMeta.textContent='订单 '+(o.orderNo||o.order_no||o.id)+' · 陪玩 '+companionName(o);
        }
        if(reviewContent)reviewContent.value='';
        if(reviewState)reviewState.textContent='';
        if(reviewSubmitBtn){reviewSubmitBtn.disabled=false;reviewSubmitBtn.textContent='提交评价'}
        paintReviewStars(5);
        closeMultiReviewPicker();
        reviewModal.classList.add('open');
        reviewModal.setAttribute('aria-hidden','false');
      }
      function closeReviewModal(){
        if(!reviewModal)return;
        reviewModal.classList.remove('open');
        reviewModal.setAttribute('aria-hidden','true');
        reviewOrderId='';
      }
      function maybeOpenPendingReview(){
        if(!pendingOpenReviewId)return;
        var id=pendingOpenReviewId;
        pendingOpenReviewId='';
        try{
          var u=new URL(location.href);
          u.searchParams.delete('openReview');
          history.replaceState({},'',u.pathname+(u.search||'')+(u.hash||''));
        }catch(e){}
        var o=findOrderById(id)||state.orders.find(function(x){return x.id===id});
        if(o&&canOpenReviewFlow(o))openReviewFlow(o);
        else if(o&&(o.reviewed||o.status==='reviewed'))alert('该订单已评价');
      }
      async function submitReview(id){
        var orderId=id||reviewOrderId;
        if(!orderId)return;
        var rating=Number((reviewRating&&reviewRating.value)||5);
        var content=(reviewContent&&reviewContent.value)||'';
        if(!(rating>=1&&rating<=5)){if(reviewState)reviewState.textContent='请选择 1-5 星评分';return}
        if(reviewState)reviewState.textContent='提交中…';
        if(reviewSubmitBtn){reviewSubmitBtn.disabled=true;reviewSubmitBtn.textContent='提交中…'}
        try{
          var res=await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token()},body:JSON.stringify({action:'submit_review',id:orderId,rating:rating,content:content})});
          var body=await res.json().catch(function(){return {}});
          if(!res.ok||body.ok===false)throw new Error(body.message||'评价失败');
          if(body.order){
            var updated=Object.assign({},findOrderById(orderId)||{},body.order,{reviewed:true,canReview:false,status:body.order.status||'reviewed',reviewRating:body.order.reviewRating!=null?body.order.reviewRating:rating,reviewContent:body.order.reviewContent!=null?body.order.reviewContent:content});
            var ix=state.orders.findIndex(function(x){return x.id===orderId});
            if(ix>=0){
              state.orders[ix]=Object.assign({},state.orders[ix],updated);
            }else{
              for(var pi=0;pi<state.orders.length;pi++){
                var p=state.orders[pi];
                if(!Array.isArray(p.children))continue;
                var ci=p.children.findIndex(function(c){return String(c.id)===String(orderId)});
                if(ci<0)continue;
                var nextKids=p.children.slice();
                nextKids[ci]=Object.assign({},nextKids[ci],updated);
                state.orders[pi]=Object.assign({},p,{children:nextKids});
                break;
              }
            }
            writeCache(state.orders);
          }
          await load({silent:true});
          paint();
          closeReviewModal();
          var returnParentId=reviewReturnParentId||(parentOfChildId(orderId)||{}).id||'';
          var parentAfter=returnParentId?findOrderById(returnParentId):null;
          if(parentAfter&&isMultiParent(parentAfter)){
            if(modal.classList.contains('open'))detail(parentAfter,false);
            openMultiReviewPicker(parentAfter);
            var stAfter=multiReviewStats(parentAfter);
            alert(body.already?'该陪玩已评价':(stAfter.pending<=0?'评价成功，已完成全部陪玩评价':(body.message||'评价提交成功')));
          }else{
            if(modal.classList.contains('open')){
              var o=findOrderById(orderId);
              if(o)detail(isMultiParent(o)?o:(parentOfChildId(orderId)||o),false);
            }
            alert(body.already?'该订单已评价':(body.message||'评价提交成功'));
          }
          try{
            var bumpCid=(body.companionId||(body.order&&(body.order.companionId||body.order.companion_id))||(findOrderById(orderId)||{}).companionId||'');
            localStorage.setItem('mcjCompanionReviewBump',JSON.stringify({companionId:bumpCid,orderId:orderId,at:Date.now()}));
          }catch(eBump){}
        }catch(err){
          if(reviewState)reviewState.textContent=err.message||'评价失败';
          if(reviewSubmitBtn){reviewSubmitBtn.disabled=false;reviewSubmitBtn.textContent='提交评价'}
          alert(err.message||'评价失败');
        }
      }
      document.addEventListener('click',function(e){
        var discordRetryBtn=e.target.closest('[data-discord-retry]');
        if(discordRetryBtn){
          e.preventDefault();
          var rid=discordRetryBtn.getAttribute('data-discord-retry');
          fetch('/api/discord/retry-channel',{
            method:'POST',
            headers:{'Content-Type':'application/json',Authorization:'Bearer '+token()},
            body:JSON.stringify({orderId:rid})
          }).then(function(r){return r.json().then(function(j){if(!r.ok||j.ok===false)throw new Error((j&&j.message)||'重试失败');return j;});})
            .then(function(j){alert(j.message||'已重试');load();})
            .catch(function(err){alert(err.message||'重试失败')});
          return;
        }
        var unavailReselect=e.target.closest('[data-unavailable-reselect]');
        if(unavailReselect){
          var ctx=pendingUnavailable||{};
          closeUnavailableModal();
          startReplacementFlow(ctx.parentId,ctx.childId);
          return;
        }
        if(e.target.closest('[data-unavailable-giveup]')){
          var ctxGive=pendingUnavailable||{};
          closeUnavailableModal();
          if(ctxGive.parentId&&ctxGive.childId){
            submitKeepRemaining(ctxGive.parentId,ctxGive.childId);
          }
          pendingUnavailable=null;
          return;
        }
        if(e.target.closest('[data-unavailable-later]')){
          closeUnavailableModal();
          pendingUnavailable=null;
          return;
        }
        if(e.target===unavailableModal){closeUnavailableModal();return}
        var reselect=e.target.closest('[data-reselect-companion]');
        if(reselect){
          startReplacementFlow(reselect.getAttribute('data-parent-id'),reselect.getAttribute('data-child-id'));
          return;
        }
        var keepBtn=e.target.closest('[data-keep-remaining]');
        if(keepBtn){
          submitKeepRemaining(keepBtn.getAttribute('data-parent-id'),keepBtn.getAttribute('data-child-id'));
          return;
        }
        var f=e.target.closest('[data-filter]');if(f){state.filter=f.dataset.filter;paint();return}if(e.target.closest('[data-refresh]')){load();return}
        if(e.target.closest('[data-multi-review-close]')||e.target===multiReviewPickModal){closeMultiReviewPicker();return}
        var reviewChildBtn=e.target.closest('[data-review-child]');
        if(reviewChildBtn){
          var childOrder=findOrderById(reviewChildBtn.getAttribute('data-review-child'));
          if(childOrder)openReviewModal(childOrder);
          return;
        }
        var revBtn=e.target.closest('[data-review-order]');
        if(revBtn){
          var ro=findOrderById(revBtn.getAttribute('data-review-order'))||state.orders.find(function(x){return x.id===revBtn.getAttribute('data-review-order')});
          if(ro)openReviewFlow(ro);
          return;
        }
        var starBtn=e.target.closest('[data-star]');if(starBtn&&reviewStars&&reviewStars.contains(starBtn)){paintReviewStars(starBtn.getAttribute('data-star'));return}if(e.target.closest('[data-review-close]')||e.target===reviewModal){closeReviewModal();if(reviewReturnParentId){var rp=findOrderById(reviewReturnParentId);if(rp&&isMultiParent(rp))openMultiReviewPicker(rp)}return}var d=e.target.closest('[data-detail]');if(d){e.preventDefault();var detailId=d.getAttribute('data-detail')||d.dataset.detail||'';var o=state.orders.find(function(x){return String(x.id)===String(detailId)});if(!o){alert('订单不存在或已从列表移除，请刷新后重试');return}detail(o,false);(async function(){try{var freshRes=await fetch('/api/orders?id='+encodeURIComponent(o.id),{headers:{Accept:'application/json',Authorization:'Bearer '+token()},cache:'no-store'});var freshBody=await freshRes.json().catch(function(){return{}});if(freshRes.status===403||freshRes.status===401){alert((freshBody&&freshBody.message)||'无权查看该订单');return}if(freshRes.status===404){alert((freshBody&&freshBody.message)||'订单不存在');return}if(freshRes.ok&&freshBody.ok!==false){var fresh=(Array.isArray(freshBody.orders)?freshBody.orders[0]:null)||freshBody.order;if(fresh&&fresh.id){if(Array.isArray(fresh.children)&&fresh.children.length){o=Object.assign({},o,fresh)}else{var keepKids=o.children;o=Object.assign({},o,fresh);if(keepKids&&keepKids.length&&!(fresh.children&&fresh.children.length))o.children=keepKids}var ix=state.orders.findIndex(function(x){return x.id===o.id});if(ix>=0)state.orders[ix]=o;writeCache(state.orders)}}}catch(errFresh){}if((o.status==='waiting_boss_confirm'||o.status==='pending')&&!(o.grabs&&o.grabs.length)){try{var res=await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token()},body:JSON.stringify({action:'list_grabs',id:o.id})});var body=await res.json().catch(function(){return{}});if(res.ok&&body.ok!==false&&Array.isArray(body.grabs)){o.grabs=body.grabs;var idx=state.orders.findIndex(function(x){return x.id===o.id});if(idx>=0)state.orders[idx]=o}}catch(err){}}if(modal.classList.contains('open'))detail(o,false)})();return}var showRev=e.target.closest('[data-show-review]');if(showRev){var o2=findOrderById(showRev.getAttribute('data-show-review'))||state.orders.find(function(x){return x.id===showRev.getAttribute('data-show-review')});if(o2)openReviewFlow(o2);return}var a=e.target.closest('[data-action]');if(a){submit(a.dataset.action,a.dataset.id,{companion_id:a.getAttribute('data-companion-id')||''});return}if(e.target.closest('[data-close]')||e.target===modal){modal.classList.remove('open');modal.setAttribute('aria-hidden','true');openDetailId='';return}if(e.target.closest('[data-logout]')){if(window.MCJRoleGate){window.MCJRoleGate.logout('boss');window.MCJRoleGate.logout('customer')}localStorage.removeItem('mcjAuthAccessToken');localStorage.removeItem('mcjAuthRefreshToken');sessionStorage.removeItem('mcjAuthAccessToken');sessionStorage.removeItem('mcjAuthRefreshToken');location.href='index.html';return}});
      if(reviewForm){reviewForm.addEventListener('submit',function(e){e.preventDefault();submitReview(reviewOrderId)})}
      document.addEventListener('visibilitychange',function(){if(!document.hidden)load({silent:true})});
      window.addEventListener('pagehide',function(){if(abortCtrl)abortCtrl.abort();if(pollTimer)clearInterval(pollTimer)});
      var boot=readCache();
      if(boot&&boot.length){state.orders=boot;state.fromCache=true;state.loading=false;state.syncing=true}
      var demoMultiConfirm=false;
      // Preview / QA harness: ?demo=multiConfirm seeds a local multi-group confirmation flow (no API writes).
      (function seedDemoMultiConfirm(){
        try{
          if(String(new URLSearchParams(location.search).get('demo')||'')!=='multiConfirm')return;
          demoMultiConfirm=true;
          var parentId='demo-parent-multi';
          var mk=function(id,name,status,extra){
            return Object.assign({
              id:id,orderNo:'MCJ-DEMO-'+id,parentOrderId:parentId,parent_order_id:parentId,
              isMultiGroupChild:true,status:status,companionId:id,companionName:name,
              companion:{display_name:name,avatar_url:''},totalAmount:30,amount:30,
              createdAt:'2026-09-20T02:00:00Z',serviceType:'陪玩'
            },extra||{});
          };
          var parent={
            id:parentId,orderNo:'MCJ-DEMO-MULTI',isMultiGroupParent:true,orderTypeKey:'multi_group',
            order_type:'multi_group',status:'claimed',totalAmount:120,paidCatFood:120,createdAt:'2026-09-20T02:00:00Z',
            paymentStatus:'已付款',serviceType:'多人陪玩'
          };
          var step=String(new URLSearchParams(location.search).get('step')||'1');
          var kids=[mk('cA','陪玩A','claimed'),mk('cB','陪玩B','claimed'),mk('cC','陪玩C','claimed')];
          if(step==='2'||step==='3'||step==='4'){
            kids[1]=mk('cB','陪玩B','in_progress',{companionConfirm:{key:'accepted',icon:'check',label:'已确认',needsReplacement:false}});
          }
          if(step==='3'||step==='4'){
            kids[0]=mk('cA','陪玩A','cancelled',{
              cancelReason:'无法接单 / 已退出（时间无法配合）',
              note:'[[COMPANION_UNAVAILABLE]]|reason:时间无法配合|companion:cA',
              needsReplacement:true,
              companionConfirm:{key:'exited',icon:'replace',label:'无法接单 / 已退出',needsReplacement:true}
            });
          }
          state.orders=[parent].concat(kids);
          state.loading=false;state.syncing=false;state.fromCache=false;state.error='';
          try{localStorage.removeItem(CACHE_KEY)}catch(eCache){}
          paint();
          openDetailId=parentId;
          setTimeout(function(){
            var p=state.orders.find(function(x){return String(x.id)===parentId});
            if(p)detail(p,false);
            if(step==='4'){
              openUnavailableModal({parentId:parentId,childId:'cA',companionName:'陪玩A'});
            }
          },120);
        }catch(eDemo){console.warn('[demo multiConfirm]',eDemo)}
      })();
      if(!demoMultiConfirm){
        paint();
        load().then(function(){maybeOpenPendingReview()});
        pollTimer=setInterval(function(){if(!document.hidden)load({silent:true})},POLL_MS);
      }
    })();
  </script>
