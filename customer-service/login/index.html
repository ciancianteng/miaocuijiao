<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>客服端登录 | MEOW CUI JIAO</title>
  <link rel="stylesheet" href="/src/auth-shell.css?v=20260805loginUi1">
  <link rel="stylesheet" href="/src/mcj-safe-area.css?v=20260801safeArea">
</head>
<body>
  <div id="serviceApp" class="cs-app">
    <main class="mcj-auth-page">
      <section class="mcj-auth-card">
        <div class="mcj-auth-brand">
          <p class="mcj-auth-brand-name">妙脆角</p>
          <p class="mcj-auth-brand-en">MEOW CUI JIAO</p>
        </div>
        <h1 class="mcj-auth-title">客服端登录</h1>
        <p class="mcj-auth-desc">使用后台创建的客服账号登录</p>
        <form class="mcj-auth-form" data-login autocomplete="on" method="post" action="#">
          <label class="mcj-auth-field">邮箱
            <input name="account" type="email" inputmode="email" autocomplete="email" required placeholder="请输入客服邮箱" spellcheck="false">
          </label>
          <label class="mcj-auth-field">密码
            <div class="mcj-auth-password password-field">
              <input name="password" type="password" autocomplete="current-password" required>
              <button class="mcj-auth-eye" type="button" tabindex="-1" data-toggle-password aria-label="显示或隐藏密码">显示</button>
            </div>
          </label>
          <label class="mcj-auth-check"><input name="remember" type="checkbox" checked> 记住登录</label>
          <button class="mcj-auth-btn primary" type="submit">登录</button>
          <button class="mcj-auth-btn ghost" type="button" data-forgot-password data-forgot-role="customer_service">忘记密码</button>
          <p class="mcj-auth-error" data-auth-error></p>
          <p class="mcj-auth-note">客服账号由管理员创建，停用账号无法登录。本页面不提供注册入口。</p>
        </form>
      </section>
    </main>
  </div>
  <!-- Shared CS auth first, then role-gates + dedicated login script. -->
  <script type="module" src="/src/customer-service-auth.js?v=20260806csLoginFlicker2"></script>
  <script type="module" src="/src/role-gates.js?v=20260806csLoginFlicker2"></script>
  <script type="module" src="/src/forgot-password.js?v=20260806csLoginFlicker2"></script>
  <script type="module" src="/src/customer-service-login.js?v=20260806csLoginFlicker2"></script>
</body>
</html>
