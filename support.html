<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>在线客服 - MEOW CUI JIAO</title>
  <link rel="stylesheet" href="src/style.css">
  <style>
    body{background:#08070a;color:#fff}.support-shell{width:min(860px,calc(100% - 32px));margin:0 auto;padding:24px 0 80px}.support-card{border:1px solid rgba(255,255,255,.1);border-radius:20px;background:rgba(255,255,255,.045);overflow:hidden}.support-head{padding:16px 18px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;justify-content:space-between;gap:12px}.support-head h1{font-size:20px;margin:0}.support-head p{margin:4px 0 0;color:#9ca3af}.messages{height:52vh;overflow:auto;padding:18px;display:grid;align-content:start;gap:12px}.msg{max-width:76%;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.08);color:#fff}.msg.mine{margin-left:auto;background:rgba(255,143,197,.16);border:1px solid rgba(255,143,197,.28)}.support-form{display:flex;gap:10px;padding:14px;border-top:1px solid rgba(255,255,255,.08)}.support-form input{flex:1;border:1px solid rgba(255,255,255,.12);border-radius:12px;background:rgba(0,0,0,.25);color:#fff;padding:12px}.support-form button,.support-btn{border:1px solid rgba(255,143,197,.4);border-radius:12px;background:rgba(255,143,197,.16);color:#fff;padding:10px 14px}.support-empty{padding:28px;text-align:center;color:#9ca3af}.support-alert{padding:18px;color:#ffd6e8}@media(max-width:640px){.messages{height:62vh}.support-form{position:sticky;bottom:0}.msg{max-width:92%}}
  </style>
</head>
<body>
  <header class="topbar"><a class="brand" href="index.html"><img src="assets/meow-cuijiao-brand.jpg" alt="MEOW CUI JIAO"><span>MEOW CUI JIAO</span></a><nav class="navlinks"><a href="index.html">首页</a><a href="orders.html">我的订单</a></nav></header>
  <main class="support-shell" id="supportApp"></main>
  <script src="src/role-gates.js"></script>
  <script>
    (function(){var root=document.getElementById('supportApp'),state={loading:true,error:'',conversation:null,messages:[],serviceStatus:'正在等待客服接入'};function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function token(){return localStorage.getItem('mcjAuthAccessToken')||sessionStorage.getItem('mcjAuthAccessToken')||''}function orderId(){return new URLSearchParams(location.search).get('order')||''}function paint(){root.innerHTML='<section class="support-card"><header class="support-head"><div><h1>在线客服</h1><p>'+esc(state.serviceStatus||'正在等待客服接入')+'</p></div><button class="support-btn" data-refresh>刷新</button></header>'+body()+'</section>'}function body(){if(!token())return '<div class="support-alert">请先登录后联系在线客服。</div>';if(state.loading)return '<div class="support-empty">正在读取消息...</div>';if(state.error)return '<div class="support-alert">'+esc(state.error)+'</div>';return '<div class="messages">'+(state.messages.length?state.messages.map(function(m){return '<div class="msg '+(m.sender_role==='boss'?'mine':'')+'"><p>'+esc(m.content||'')+'</p><small>'+esc(m.created_at||'')+'</small></div>'}).join(''):'<div class="support-empty">正在等待客服接入</div>')+'</div><form class="support-form" data-send><input name="content" placeholder="输入消息" autocomplete="off"><button type="submit">发送</button></form>'}function load(){if(!token()){state.loading=false;paint();return}state.loading=true;state.error='';paint();fetch('/api/chat?order_id='+encodeURIComponent(orderId()),{headers:{Accept:'application/json',Authorization:'Bearer '+token()}}).then(function(res){return res.json().then(function(body){if(!res.ok||body.ok===false)throw new Error(body.message||'消息读取失败');return body})}).then(function(body){state.conversation=body.conversation;state.messages=body.messages||[];state.serviceStatus=body.serviceStatus||'正在等待客服接入'}).catch(function(err){state.error=err.message||'消息读取失败'}).finally(function(){state.loading=false;paint();setTimeout(function(){var box=document.querySelector('.messages');if(box)box.scrollTop=box.scrollHeight},0)})}document.addEventListener('click',function(e){if(e.target.closest('[data-refresh]'))load()});document.addEventListener('submit',function(e){if(!e.target.matches('[data-send]'))return;e.preventDefault();var input=e.target.elements.content,content=String(input.value||'').trim();if(!content)return;input.disabled=true;fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token()},body:JSON.stringify({order_id:orderId(),content:content})}).then(function(res){return res.json().then(function(body){if(!res.ok||body.ok===false)throw new Error(body.message||'发送失败');return body})}).then(function(){input.value='';load()}).catch(function(err){alert(err.message||'发送失败')}).finally(function(){input.disabled=false})});load();})();
  </script>
</body>
</html>
