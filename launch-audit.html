<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>本地验收 · Launch Audit</title>
  <style>
    :root {
      --bg: #0b0710;
      --panel: #151019;
      --line: rgba(243, 168, 203, 0.22);
      --text: #fff5fa;
      --muted: #b8a3b0;
      --pink: #f3a8cb;
      --pass: #3ecf8e;
      --fail: #ff6b81;
      --warn: #ffc857;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      background: radial-gradient(circle at 12% 0%, rgba(243,168,203,.12), transparent 32%), var(--bg);
      color: var(--text);
      line-height: 1.45;
    }
    header {
      position: sticky; top: 0; z-index: 20;
      backdrop-filter: blur(12px);
      background: rgba(11,7,16,.88);
      border-bottom: 1px solid var(--line);
      padding: 16px 20px;
    }
    h1 { margin: 0 0 6px; font-size: 22px; }
    .sub { color: var(--muted); font-size: 13px; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    button, .btn {
      border: 1px solid var(--line);
      background: #1d1522;
      color: var(--text);
      border-radius: 10px;
      padding: 8px 12px;
      cursor: pointer;
      font: inherit;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    button.primary { background: linear-gradient(180deg, #ffe2ef, #e9a0c6); color: #1b0712; border: 0; font-weight: 700; }
    main { max-width: 1280px; margin: 0 auto; padding: 18px 16px 64px; }
    .summary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 10px;
      margin-bottom: 18px;
    }
    .metric {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px;
    }
    .metric b { display: block; font-size: 24px; margin-top: 4px; }
    section {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 16px;
    }
    section h2 { margin: 0 0 4px; font-size: 18px; color: var(--pink); }
    section .hint { color: var(--muted); font-size: 12px; margin-bottom: 10px; }
    .portal-links { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { border-top: 1px solid rgba(255,255,255,.06); padding: 10px 8px; text-align: left; vertical-align: top; }
    th { color: var(--muted); font-weight: 600; }
    .status-cell select {
      width: 100%;
      min-width: 110px;
      background: #101015;
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 6px;
    }
    .note {
      width: 100%;
      min-height: 34px;
      background: #101015;
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 6px 8px;
      font: inherit;
      resize: vertical;
    }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
    }
    .badge.pass { background: rgba(62,207,142,.18); color: var(--pass); }
    .badge.fail { background: rgba(255,107,129,.18); color: var(--fail); }
    .badge.pending { background: rgba(255,200,87,.16); color: var(--warn); }
    .badge.block { background: rgba(255,107,129,.25); color: #ffd0d8; }
    footer {
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
    }
    code { color: #ffdceb; }
  </style>
</head>
<body>
  <header>
    <h1>本地验收入口 · Launch Audit</h1>
    <div class="sub">仅用于本地验收。记录四端页面状态：可打开 / 黑屏 / 404 / 403 / 500 / 数据缺失 / 按钮无效 / 跳转错误 / PASS / FAIL。状态自动保存在本机 localStorage。</div>
    <div class="actions">
      <a class="btn" href="/">老板端首页</a>
      <a class="btn" href="/customer-service/">客服端</a>
      <a class="btn" href="/companion/">陪玩端</a>
      <a class="btn" href="/admin.html">超管后台</a>
      <button type="button" class="primary" id="autoProbe">自动探测页面可开性</button>
      <button type="button" id="markUncheckedFail">未检查标记 FAIL</button>
      <button type="button" id="exportJson">导出结果 JSON</button>
      <button type="button" id="resetAll">重置状态</button>
    </div>
  </header>

  <main>
    <div class="summary" id="summary"></div>
    <div id="sections"></div>
    <footer>
      固定预览根地址：当前 dev origin（通常 <code>http://localhost:5173</code>）。验收入口：<code>/launch-audit.html</code>
    </footer>
  </main>

  <script>
    const STATUS_OPTIONS = [
      "未检查",
      "可打开",
      "黑屏",
      "404",
      "403",
      "500",
      "数据缺失",
      "按钮无效",
      "跳转错误",
      "PASS",
      "FAIL",
      "需要人工执行"
    ];

    const PORTALS = {
      boss: { title: "一、老板端", home: "/", hint: "浏览 / 下单 / 订单 / 客服聊天 / 通知 / 收藏 / 我的" },
      cs: { title: "二、客服端", home: "/customer-service/", hint: "登录 / 工作台 / 会话池 / 接待 / 订单 / 工资 / 资料" },
      companion: { title: "三、陪玩端", home: "/companion/", hint: "登录 / 工作台 / 抢单 / 接单流转 / 收益 / 资料" },
      admin: { title: "四、超级管理员后台", home: "/admin.html", hint: "账号与业务配置、订单、Banner、财务、数据库相关配置" }
    };

    /** @type {{id:string,portal:string,name:string,url:string,checks:string[],priority:string}[]} */
    const ITEMS = [
      // Boss
      { id: "boss-home", portal: "boss", name: "首页", url: "/", checks: ["首页渲染", "Banner", "导航"], priority: "P0" },
      { id: "boss-login", portal: "boss", name: "登录状态", url: "/", checks: ["登录弹窗", "登录后不再显示「登录」"], priority: "P0" },
      { id: "boss-hall", portal: "boss", name: "陪玩大厅", url: "/companion-center.html", checks: ["列表真实数据"], priority: "P0" },
      { id: "boss-detail", portal: "boss", name: "陪玩详情", url: "/profile.html?player=c776e811-6003-48a4-8f11-ed9eb1b70898", checks: ["详情打开", "立即下单入口"], priority: "P0" },
      { id: "boss-order-now", portal: "boss", name: "立即下单", url: "/profile.html?player=c776e811-6003-48a4-8f11-ed9eb1b70898&open_order=1", checks: ["下单弹窗/页"], priority: "P0" },
      { id: "boss-game-id", portal: "boss", name: "游戏 ID 输入", url: "/profile.html?player=c776e811-6003-48a4-8f11-ed9eb1b70898&open_order=1", checks: ["可输入不自动清空"], priority: "P0" },
      { id: "boss-amount", portal: "boss", name: "猫粮金额", url: "/profile.html?player=c776e811-6003-48a4-8f11-ed9eb1b70898&open_order=1", checks: ["显示猫粮单位", "不显示 RM 为单价"], priority: "P0" },
      { id: "boss-pay", portal: "boss", name: "支付方式", url: "/profile.html?player=c776e811-6003-48a4-8f11-ed9eb1b70898&open_order=1", checks: ["猫粮/TNG/银行卡/支付宝"], priority: "P0" },
      { id: "boss-orders", portal: "boss", name: "我的订单", url: "/orders.html", checks: ["订单列表真实"], priority: "P0" },
      { id: "boss-support", portal: "boss", name: "在线客服", url: "/support.html", checks: ["客服入口"], priority: "P0" },
      { id: "boss-chat", portal: "boss", name: "老板与客服聊天", url: "/support.html", checks: ["双向消息"], priority: "P0" },
      { id: "boss-messages", portal: "boss", name: "通知", url: "/messages.html", checks: ["消息页可开"], priority: "P1" },
      { id: "boss-favorites", portal: "boss", name: "收藏", url: "/favorites.html", checks: ["收藏页可开"], priority: "P1" },
      { id: "boss-mine", portal: "boss", name: "我的", url: "/mine.html", checks: ["个人中心"], priority: "P0" },

      // CS
      { id: "cs-login", portal: "cs", name: "登录", url: "/customer-service/login/", checks: ["账号密码登录"], priority: "P0" },
      { id: "cs-dash", portal: "cs", name: "工作台", url: "/customer-service/dashboard/", checks: ["指标真实或 0"], priority: "P0" },
      { id: "cs-pool", portal: "cs", name: "统一会话池", url: "/customer-service/conversations", checks: ["会话列表"], priority: "P0" },
      { id: "cs-receive", portal: "cs", name: "接待老板", url: "/customer-service/conversations", checks: ["接待按钮有效"], priority: "P0" },
      { id: "cs-input", portal: "cs", name: "客服输入框", url: "/customer-service/conversations", checks: ["可输入不自动清空"], priority: "P0" },
      { id: "cs-send", portal: "cs", name: "发送消息", url: "/customer-service/conversations", checks: ["发送成功"], priority: "P0" },
      { id: "cs-realtime", portal: "cs", name: "老板实时收到", url: "/support.html", checks: ["跨端实时"], priority: "P0" },
      { id: "cs-orders", portal: "cs", name: "订单处理", url: "/customer-service/orders", checks: ["订单列表"], priority: "P0" },
      { id: "cs-create", portal: "cs", name: "新建订单", url: "/customer-service/create-order", checks: ["创建订单"], priority: "P0" },
      { id: "cs-confirm-pay", portal: "cs", name: "确认付款", url: "/customer-service/orders", checks: ["待确认→待安排"], priority: "P0" },
      { id: "cs-payroll", portal: "cs", name: "工资记录", url: "/customer-service/dashboard/", checks: ["工资入口/记录"], priority: "P1" },
      { id: "cs-profile", portal: "cs", name: "我的资料", url: "/customer-service/profile/", checks: ["资料页"], priority: "P1" },

      // Companion
      { id: "cp-login", portal: "companion", name: "登录", url: "/companion/login/", checks: ["登录"], priority: "P0" },
      { id: "cp-dash", portal: "companion", name: "工作台", url: "/companion/dashboard/", checks: ["工作台"], priority: "P0" },
      { id: "cp-hall", portal: "companion", name: "抢单大厅", url: "/companion/order-hall/", checks: ["可见可抢订单"], priority: "P0" },
      { id: "cp-detail", portal: "companion", name: "订单详情", url: "/companion/orders/", checks: ["详情"], priority: "P0" },
      { id: "cp-claim", portal: "companion", name: "接单", url: "/companion/order-hall/", checks: ["接单按钮"], priority: "P0" },
      { id: "cp-start", portal: "companion", name: "开始订单", url: "/companion/orders/", checks: ["状态流转"], priority: "P0" },
      { id: "cp-complete", portal: "companion", name: "完成订单", url: "/companion/orders/", checks: ["完成"], priority: "P0" },
      { id: "cp-earn", portal: "companion", name: "收益", url: "/companion/earnings/", checks: ["收益页"], priority: "P1" },
      { id: "cp-profile", portal: "companion", name: "资料编辑", url: "/companion/profile/", checks: ["资料"], priority: "P1" },
      { id: "cp-games", portal: "companion", name: "游戏资料", url: "/companion/profile/", checks: ["游戏"], priority: "P1" },
      { id: "cp-price", portal: "companion", name: "单价设置", url: "/companion/profile/", checks: ["单价"], priority: "P1" },
      { id: "cp-online", portal: "companion", name: "在线状态", url: "/companion/dashboard/", checks: ["在线切换"], priority: "P0" },

      // Admin
      { id: "ad-login", portal: "admin", name: "登录", url: "/admin/login/", checks: ["超管登录"], priority: "P0" },
      { id: "ad-bosses", portal: "admin", name: "老板管理", url: "/admin.html#bosses", checks: ["列表"], priority: "P0" },
      { id: "ad-companions", portal: "admin", name: "陪玩管理", url: "/admin.html#players", checks: ["列表"], priority: "P0" },
      { id: "ad-cs-create", portal: "admin", name: "客服账号创建", url: "/admin.html#service-accounts", checks: ["创建客服"], priority: "P0" },
      { id: "ad-orders", portal: "admin", name: "订单管理", url: "/admin.html#orders", checks: ["订单"], priority: "P0" },
      { id: "ad-services", portal: "admin", name: "服务管理", url: "/admin.html#games", checks: ["服务"], priority: "P1" },
      { id: "ad-games", portal: "admin", name: "游戏管理", url: "/admin.html#games", checks: ["游戏/服务合并入口"], priority: "P1" },
      { id: "ad-banners", portal: "admin", name: "Banner 管理", url: "/admin.html#banners", checks: ["Banner"], priority: "P0" },
      { id: "ad-ann", portal: "admin", name: "公告管理", url: "/admin.html#announcements", checks: ["公告"], priority: "P1" },
      { id: "ad-levels", portal: "admin", name: "等级设置", url: "/admin.html#companion-levels", checks: ["等级"], priority: "P1" },
      { id: "ad-commission", portal: "admin", name: "抽成设置", url: "/admin.html#settings", checks: ["抽成在系统设置"], priority: "P0" },
      { id: "ad-rebate", portal: "admin", name: "返点设置", url: "/admin.html#settings", checks: ["返点"], priority: "P1" },
      { id: "ad-payout", portal: "admin", name: "提现与发薪", url: "/admin.html#service-reports", checks: ["财务"], priority: "P0" },
      { id: "ad-receipts", portal: "admin", name: "收据库", url: "/admin.html#service-reports", checks: ["收据"], priority: "P1" },
      { id: "ad-db", portal: "admin", name: "数据库相关配置", url: "/admin.html#settings", checks: ["平台配置"], priority: "P0" }
    ];

    // fix accidental space in id
    ITEMS.forEach((it) => { if (it.id === "ad- ann") it.id = "ad-ann"; });

    const STORE_KEY = "mcj_launch_audit_v1";

    function loadStore() {
      try { return JSON.parse(localStorage.getItem(STORE_KEY) || "{}"); } catch { return {}; }
    }
    function saveStore(store) {
      localStorage.setItem(STORE_KEY, JSON.stringify(store));
    }
    function resultClass(status) {
      if (status === "PASS" || status === "可打开") return "pass";
      if (!status || status === "未检查") return "pending";
      return "fail";
    }

    function render() {
      const store = loadStore();
      const root = document.getElementById("sections");
      root.innerHTML = "";
      let counts = { total: 0, pass: 0, fail: 0, pending: 0, block: 0 };

      Object.keys(PORTALS).forEach((portalKey) => {
        const meta = PORTALS[portalKey];
        const items = ITEMS.filter((x) => x.portal === portalKey);
        const sec = document.createElement("section");
        sec.innerHTML = `
          <h2>${meta.title}</h2>
          <div class="hint">${meta.hint}</div>
          <div class="portal-links">
            <a class="btn primary" href="${meta.home}" target="_blank" rel="noopener">打开端入口</a>
          </div>
          <table>
            <thead>
              <tr>
                <th style="width:18%">页面/功能</th>
                <th style="width:10%">优先级</th>
                <th style="width:22%">检查点</th>
                <th style="width:16%">状态</th>
                <th style="width:22%">备注/真实错误</th>
                <th style="width:12%">预览</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        `;
        const tbody = sec.querySelector("tbody");
        items.forEach((item) => {
          const row = store[item.id] || { status: "未检查", note: "" };
          counts.total += 1;
          if (row.status === "PASS" || row.status === "可打开") counts.pass += 1;
          else if (!row.status || row.status === "未检查") counts.pending += 1;
          else counts.fail += 1;
          if (item.priority === "P0" && row.status !== "PASS" && row.status !== "可打开" && row.status !== "未检查") counts.block += 1;

          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td><strong>${item.name}</strong><div class="sub"><code>${item.url}</code></div></td>
            <td>${item.priority}${item.priority === "P0" ? ' <span class="badge block">阻断</span>' : ""}</td>
            <td>${item.checks.join(" · ")}</td>
            <td>
              <select data-id="${item.id}">
                ${STATUS_OPTIONS.map((s) => `<option value="${s}" ${s === row.status ? "selected" : ""}>${s}</option>`).join("")}
              </select>
              <div style="margin-top:6px"><span class="badge ${resultClass(row.status)}">${row.status || "未检查"}</span></div>
            </td>
            <td><textarea class="note" data-note="${item.id}" placeholder="真实错误 / HTTP / 控制台">${row.note || ""}</textarea></td>
            <td><a class="btn primary" href="${item.url}" target="_blank" rel="noopener">打开预览</a></td>
          `;
          tbody.appendChild(tr);
        });
        root.appendChild(sec);
      });

      document.getElementById("summary").innerHTML = `
        <div class="metric">条目<b>${counts.total}</b></div>
        <div class="metric">PASS/可打开<b style="color:var(--pass)">${counts.pass}</b></div>
        <div class="metric">FAIL类<b style="color:var(--fail)">${counts.fail}</b></div>
        <div class="metric">未检查<b style="color:var(--warn)">${counts.pending}</b></div>
        <div class="metric">已记 P0 阻断<b style="color:var(--fail)">${counts.block}</b></div>
      `;

      root.querySelectorAll("select[data-id]").forEach((el) => {
        el.addEventListener("change", () => {
          const s = loadStore();
          s[el.dataset.id] = Object.assign({}, s[el.dataset.id], { status: el.value });
          saveStore(s);
          render();
        });
      });
      root.querySelectorAll("textarea[data-note]").forEach((el) => {
        el.addEventListener("change", () => {
          const s = loadStore();
          s[el.dataset.note] = Object.assign({}, s[el.dataset.note], { note: el.value });
          saveStore(s);
        });
      });
    }

    async function autoProbe() {
      const btn = document.getElementById("autoProbe");
      btn.disabled = true;
      btn.textContent = "探测中…";
      const uniqueUrls = [...new Set(ITEMS.map((i) => i.url.split("#")[0]))];
      const urlStatus = {};
      for (const url of uniqueUrls) {
        try {
          const res = await fetch(url, { method: "GET", credentials: "same-origin" });
          if (res.status === 404) urlStatus[url] = { status: "404", note: `HTTP ${res.status}` };
          else if (res.status === 403) urlStatus[url] = { status: "403", note: `HTTP ${res.status}` };
          else if (res.status >= 500) urlStatus[url] = { status: "500", note: `HTTP ${res.status}` };
          else if (!res.ok) urlStatus[url] = { status: "FAIL", note: `HTTP ${res.status}` };
          else {
            const text = await res.text();
            const blank = !text || text.trim().length < 40;
            const looksHtml = /<html|<body|<div/i.test(text);
            if (blank || !looksHtml) urlStatus[url] = { status: "黑屏", note: "响应过短或非 HTML" };
            else urlStatus[url] = { status: "可打开", note: `HTTP ${res.status}` };
          }
        } catch (err) {
          urlStatus[url] = { status: "FAIL", note: err.message || "fetch failed" };
        }
      }
      const store = loadStore();
      ITEMS.forEach((item) => {
        const base = item.url.split("#")[0];
        const hit = urlStatus[base];
        if (!hit) return;
        const prev = store[item.id] || {};
        // only auto-fill if unchecked or previously auto
        if (!prev.status || prev.status === "未检查" || prev.auto) {
          store[item.id] = {
            status: hit.status === "可打开" ? "可打开" : hit.status,
            note: hit.note,
            auto: true
          };
        }
      });
      saveStore(store);
      btn.disabled = false;
      btn.textContent = "自动探测页面可开性";
      render();
    }

    document.getElementById("autoProbe").addEventListener("click", autoProbe);
    document.getElementById("markUncheckedFail").addEventListener("click", () => {
      const store = loadStore();
      ITEMS.forEach((item) => {
        const row = store[item.id];
        if (!row || !row.status || row.status === "未检查") {
          store[item.id] = { status: "FAIL", note: (row && row.note) || "未完成人工验收" };
        }
      });
      saveStore(store);
      render();
    });
    document.getElementById("exportJson").addEventListener("click", () => {
      const blob = new Blob([JSON.stringify({ at: new Date().toISOString(), items: loadStore() }, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "launch-audit-results.json";
      a.click();
    });
    document.getElementById("resetAll").addEventListener("click", () => {
      localStorage.removeItem(STORE_KEY);
      render();
    });

    render();
  </script>
</body>
</html>
