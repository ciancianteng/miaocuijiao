<html lang="zh-CN" data-gifts-mall="1">
<head>

  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="妙脆角">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0a0610">
  <meta name="mobile-web-app-capable" content="yes">
  <script src="/pwa-boot.js" defer></script>
  <!-- mcj-pwa-meta:end -->

  <script src="/portal-early-gate.js?v=20260911authPerfP0"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>礼物商城 · Meow Cui Jiao</title>
  <link rel="stylesheet" href="src/platform.css">
  <link rel="stylesheet" href="src/gifts-mall.css?v=20260912giftOrder1">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="index.html">
      <img src="assets/meow-cuijiao-brand.jpg" alt="logo">
      <span>MEOW CUI JIAO<small>妙脆角电竞</small></span>
    </a>
    <nav class="nav">
      <a href="index.html">首页</a>
      <a href="companion-center.html">陪玩大厅</a>
      <a href="leaderboard.html">排行榜</a>
      <a href="activities.html">活动中心</a>
      <a href="miao-coin.html">猫粮</a>
      <a href="orders.html">我的订单</a>
      <a href="messages.html">消息</a>
      <a class="active" href="mine.html">我的</a>
    </nav>
  </div>
</header>

<main class="page gm-page" data-gifts-mall="1">
  <section class="gm-hero">
    <h1>礼物商城</h1>
    <p>选择礼物与真实陪玩后创建订单，付款并上传截图，客服审核通过后才会正式到账。</p>
  </section>

  <div id="gmSuccess" class="gm-success" hidden></div>

  <section id="gmGiftGrid" class="gm-grid" aria-live="polite">
    <p class="gm-empty">加载礼物…</p>
  </section>
</main>

<nav class="bottom-nav">
  <a href="index.html">首页</a>
  <a href="companion-center.html">大厅</a>
  <a href="leaderboard.html">排行</a>
  <a href="miao-coin.html">猫粮</a>
  <a class="active" href="mine.html">我的</a>
</nav>

<div id="gmSheetBackdrop" class="gm-sheet-backdrop" hidden data-gm-close></div>
<div id="gmSheet" class="gm-sheet" hidden role="dialog" aria-modal="true" aria-labelledby="gmSheetTitle">
  <div class="gm-sheet-head">
    <div>
      <h2 id="gmSheetTitle">选择赠送对象</h2>
      <p id="gmSheetGift" class="gm-confirm-hint" style="margin-top:4px"></p>
    </div>
    <button type="button" class="gm-sheet-close" data-gm-close aria-label="关闭">×</button>
  </div>
  <div id="gmCompanionList" class="gm-companion-list"></div>
  <div class="gm-sheet-foot">
    <label class="gm-qty-row">数量
      <input id="gmQty" type="number" min="1" max="99" value="1" inputmode="numeric" />
    </label>
    <p id="gmConfirmLine" class="gm-confirm-line">请选择一位陪玩</p>
    <p id="gmConfirmHint" class="gm-confirm-hint">未选择陪玩时无法确认赠送</p>
    <button type="button" id="gmConfirmBtn" class="gm-btn primary" disabled>确认赠送并去付款</button>
  </div>
</div>

<div id="gmPayBackdrop" class="gm-sheet-backdrop" hidden data-gm-pay-close></div>
<div id="gmPay" class="gm-sheet gm-pay-sheet" hidden role="dialog" aria-modal="true" aria-labelledby="gmPayTitle">
  <div class="gm-sheet-head">
    <div>
      <h2 id="gmPayTitle">付款并上传凭证</h2>
      <p class="gm-confirm-hint" style="margin-top:4px">审核通过前不算真正赠送成功</p>
    </div>
    <button type="button" class="gm-sheet-close" data-gm-pay-close aria-label="关闭">×</button>
  </div>
  <div id="gmPayBody" class="gm-pay-body"></div>
</div>

<div id="gmToast" class="gm-toast" hidden></div>

<script src="src/platform.js"></script>
<script src="src/boss-auth-session.js?v=20260911authPerfP0"></script>
<script src="src/role-gates.js?v=20260911authPerfP0"></script>
<script src="src/gifts-mall.js?v=20260912giftOrder1"></script>
</body>
</html>
