  <script src="src/auth-system.js"></script>
  <script>
    if (window.MCJAuth && !window.MCJAuth.guardRole("customer_service", "index.html")) {
      throw new Error("Blocked customer-service route for current role");
    }
  </script>
  <div class="staff-login-gate" id="staffLoginGate">
    <div class="staff-login-card">
      <div class="login-brand"><div class="login-mark">🐾</div><strong>MEOW CUI JIAO</strong><span>独立客服工作台登录</span></div>
      <label>USER ID<input id="staffUserId" autocomplete="username" placeholder="请输入客服 User ID"></label>
      <label>密码<input id="staffPassword" type="password" autocomplete="current-password" placeholder="请输入密码"></label>
      <button class="primary-btn" id="staffLoginBtn" type="button">进入客服工作台</button>
      <div class="staff-login-error" id="staffLoginError">登录后只进入客服端，不显示陪玩端或后台中心。</div>
    </div>
  </div>

  <div class="app">
    <header class="topbar">
      <div class="brand"><div class="brand-badge">🐱</div><div><strong>MEOW CUI JIAO</strong><span>客服工作台</span></div></div>
      <nav class="nav" id="topNav">
        <button class="active" data-view="chat">聊天室</button>
        <button data-view="dispatch">派单</button>
        <button data-view="attendance">打卡</button>
        <button data-view="income">收入</button>
        <button data-view="settings">设置</button>
        <button data-view="mine">我的</button>
      </nav>
      <div class="top-actions">
        <span class="pill coin" id="coinPill">喵币 0</span>
        <button class="pill auth pending" id="authPill" type="button">未认证</button>
      </div>
    </header>
    <div class="notice" id="authNotice">未认证客服不能开始工作、接待老板。点击右上角认证状态提交身份认证。</div>

    <section class="view active" id="view-chat">
      <div class="chat-layout">
        <aside class="card contacts"><div class="section-title"><h2>老板会话</h2><span class="tag green">多会话</span></div><div class="contacts-list" id="contactsList"></div></aside>
        <main class="card chat-main"><div class="chat-head"><div><strong id="chatTitle">老板会话</strong><p id="chatSub" style="margin:4px 0 0;color:var(--muted);font-size:13px"></p></div><button class="ghost-btn" id="endChatBtn">结束对话</button></div><div class="messages" id="messages"></div><footer class="chat-compose"><div class="quick-row" id="quickReplyRow"></div><div class="chat-input"><input class="field" id="chatInput" placeholder="输入客服消息"><button class="primary-btn" id="sendBtn">发送</button></div></footer></main>
        <aside class="card boss-panel"><div class="section-title"><h2>老板</h2><span class="tag" id="bossVip">VIP</span></div><div class="info-list" id="bossInfo"></div><h3 style="margin-top:16px">推荐陪玩</h3><div class="info-list" id="recommendList"></div><h3 style="margin-top:16px">历史订单</h3><div class="info-list" id="historyList"></div></aside>
      </div>
    </section>

    <section class="view" id="view-dispatch">
      <div class="section-title"><div><h1>客服派单</h1><p>生成自定义订单，转发给指定渠道或陪玩抢单大厅。</p></div><span class="tag blue">独立派单台</span></div>
      <div class="dispatch-layout">
        <form class="card form-grid" id="dispatchForm"><label>选择老板<select id="dispatchBoss"></select></label><label>游戏 / 服务类型<select id="dispatchService"><option>APEX 双排</option><option>语音陪聊</option><option>VALORANT 上分</option><option>护航订单</option><option>代打 / 代肝</option></select></label><label>服务时长<input id="dispatchDuration" value="2小时"></label><label>订单价格 RM<input id="dispatchPrice" type="number" min="1" value="68"></label><label class="full">转发渠道<select id="dispatchChannel"><option>陪玩抢单大厅</option><option>指定陪玩：MOMO</option><option>指定陪玩：小雨</option><option>客服派单池</option></select></label><label class="full">备注<textarea id="dispatchNote">老板希望声音温柔，能主动报点，优先接单中陪玩。</textarea></label><div class="button-row full"><button class="ghost-btn" type="button" id="createDispatchBtn">生成订单</button><button class="primary-btn" type="button" id="sendDispatchBtn">一键派单</button></div></form>
        <div class="card"><div class="section-title"><h2>派单状态</h2><span class="tag yellow">待抢单 / 已抢单 / 进行中 / 已完成</span></div><div class="order-grid" id="dispatchList"></div></div>
      </div>
    </section>

    <section class="view" id="view-attendance">
      <div class="section-title"><div><h1>客服打卡</h1><p>上班、下班和本月出勤状态。</p></div><div class="button-row"><button class="primary-btn" id="clockInBtn">上班打卡</button><button class="ghost-btn" id="clockOutBtn">下班打卡</button></div></div>
      <div class="grid attendance-grid"><div class="card metric"><span>今日工作时长</span><strong id="workHours">0小时</strong></div><div class="card metric"><span>本月出勤天数</span><strong id="attendanceDays">18天</strong></div><div class="card metric"><span>迟到 / 早退</span><strong id="lateStatus">0 / 0</strong></div><div class="card metric"><span>全勤状态</span><strong id="fullStatus">全勤中</strong></div></div>
      <div class="card" style="margin-top:14px"><h3>打卡记录</h3><div class="table" id="attendanceLog"></div></div>
    </section>

    <section class="view" id="view-income">
      <div class="section-title"><div><h1>客服收入</h1><p>底薪、对话服务、老板打赏、派单提成和喵币明细。</p></div><span class="tag green">自动统计</span></div>
      <div class="grid income-grid" id="incomeCards"></div>
      <div class="card" style="margin-top:14px"><h3>收入明细</h3><div class="table" id="incomeRows"></div></div>
    </section>

    <section class="view" id="view-settings">
      <div class="section-title"><div><h1>设置</h1><p>快捷回复由客服自己编辑，聊天室上方会同步显示。</p></div></div>
      <div class="settings-grid"><form class="card form-grid" id="replyForm"><label>快捷标题<input id="replyTitle" value="确认收到"></label><label class="full">快捷内容<textarea id="replyText">收到老板，我这边马上为您确认可接单的陪玩。</textarea></label><div class="button-row full"><button class="primary-btn" type="button" id="saveReplyBtn">新增快捷回复</button></div></form><div class="card"><h3>我的快捷回复</h3><div class="reply-list" id="replyList"></div></div></div>
    </section>

    <section class="view" id="view-mine">
      <div class="section-title"><div><h1>我的</h1><p>客服个人常用设置。</p></div></div>
      <div class="grid mine-grid"><button class="mine-btn">修改密码</button><button class="mine-btn">绑定手机号</button><button class="mine-btn">绑定银行卡</button><button class="mine-btn">联系客服</button><button class="mine-btn">帮助中心</button><button class="mine-btn">关于平台</button><button class="mine-btn" id="logoutBtn">退出登录</button></div>
    </section>

    <section class="view" id="view-auth">
      <div class="section-title"><div><h1>身份认证</h1><p>认证通过后可以开始接待老板、打卡和派单。状态会保存在本机，已认证后无需重复验证。</p></div></div>
      <div class="auth-layout"><form class="card form-grid" id="authForm"><label>真实姓名<input id="realName" placeholder="请输入姓名"></label><label>手机号<input id="authPhone" placeholder="国内或马来西亚手机号"></label><label class="full">身份证号 / 护照号<input id="idNumber" placeholder="请输入证件号码"></label><label>身份证正面<input type="file" id="idFront"></label><label>身份证反面<input type="file" id="idBack"></label><div class="button-row full"><button class="primary-btn" type="button" id="submitAuthBtn">提交认证审核</button><button class="ghost-btn" type="button" id="demoApproveBtn">模拟后台通过</button></div></form><div class="card"><h3>认证规则</h3><div class="info-row"><span>未认证</span><strong>不能开始工作</strong></div><div class="info-row"><span>审核中</span><strong>等待后台确认</strong></div><div class="info-row"><span>已认证</span><strong>可接待 / 派单 / 打卡</strong></div><div class="info-row"><span>认证失败</span><strong>需要重新提交</strong></div></div></div>
    </section>
  </div>
  <div class="toast" id="toast">已完成</div>

  <script>
