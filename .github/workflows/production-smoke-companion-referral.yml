name: Production smoke companion referral rebate

# Runs only on this promote branch. Uses Vercel Production env (service_role)
# to seed ephemeral test users, then smokes invite→order→rebate→wallet→withdraw
# against https://www.meowcuijiao.com. Does not modify application business logic.
on:
  workflow_dispatch:
  push:
    branches:
      - cursor/prod-promote-cc56689-36a7
    paths:
      - .github/workflows/production-smoke-companion-referral.yml
      - .github/workflows/_prod-smoke-companion-referral.mjs

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull Production env + run smoke
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_SCOPE: ciancianteng-4581s-projects
          VERCEL_PROJECT: meow-cuijiao-homepage
          BASE: https://www.meowcuijiao.com
          PASS: McjTest@12345678
          ADMIN_EMAIL: admin@meow.test
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "::error::VERCEL_TOKEN missing"
            exit 1
          fi
          npm i -g vercel@58.5.1
          mkdir -p /tmp/prod-smoke
          echo "y" | vercel link --yes --project "$VERCEL_PROJECT" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" \
            >/tmp/prod-smoke/link.out 2>/tmp/prod-smoke/link.err || true
          vercel env pull /tmp/prod-smoke/.env.production --yes --environment production \
            --token "$VERCEL_TOKEN" --scope "$VERCEL_SCOPE"
          # Parse env file in Node (avoid shell source quote issues). Do not print secret values.
          node <<'NODE'
          const fs = require("fs");
          const raw = fs.readFileSync("/tmp/prod-smoke/.env.production", "utf8");
          const env = {};
          for (const line of raw.split(/\r?\n/)) {
            const t = line.trim();
            if (!t || t.startsWith("#") || !t.includes("=")) continue;
            const i = t.indexOf("=");
            const k = t.slice(0, i).trim();
            let v = t.slice(i + 1).trim();
            if ((v.startsWith('"') && v.endsWith('"')) || (v.startsWith("'") && v.endsWith("'"))) v = v.slice(1, -1);
            // Vercel sometimes writes JSON-escaped values
            v = v.replace(/\\n/g, "\n").replace(/\\"/g, '"');
            env[k] = v;
          }
          const urlRaw = env.SUPABASE_URL || env.VITE_SUPABASE_URL || "";
          const key = env.SUPABASE_SERVICE_ROLE_KEY || "";
          const url = String(urlRaw || "").trim().replace(/^['"]|['"]$/g, "");
          console.log(
            "env debug:",
            "keys=",
            Object.keys(env).filter((k) => /SUPABASE|DATABASE|URL|POSTGRES/i.test(k)).sort().join(","),
            "urlLen=",
            url.length,
            "urlHasHttp=",
            /^https?:\/\//i.test(url),
            "urlCode0=",
            url ? url.charCodeAt(0) : -1,
            "keyLen=",
            key.length
          );
          if (!url || !key) {
            console.error("Missing SUPABASE_URL/VITE_SUPABASE_URL or SUPABASE_SERVICE_ROLE_KEY in Production env pull");
            process.exit(1);
          }
          let host = "bad";
          try {
            host = new URL(url).host;
          } catch (e) {
            console.error("URL parse failed; prefix=", JSON.stringify(url.slice(0, 12)));
            process.exit(1);
          }
          console.log("SUPABASE_URL host=" + host);
          // Refuse if Production env somehow points at Staging project
          if (host.startsWith("cfccwysniduwkjskiqgy")) {
            console.error("Refusing Staging Supabase host in Production env pull");
            process.exit(1);
          }
          fs.writeFileSync(
            "/tmp/prod-smoke/smoke.env.json",
            JSON.stringify({ SUPABASE_URL: url, SUPABASE_SERVICE_ROLE_KEY: key })
          );
          NODE
          echo "build-info:"; curl -sS "$BASE/api/build-info"; echo
          export SMOKE_ENV_JSON=/tmp/prod-smoke/smoke.env.json
          node .github/workflows/_prod-smoke-companion-referral.mjs
