name: Apply Staging boss-companion-relations migration

# Manual only. Staging Supabase (cfccwysniduwkjskiqgy) — never Production.
# Requires repo secret: STAGING_DATABASE_URL (or DATABASE_URL) pointing at Staging Postgres.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pg
        run: npm install pg@8.22.0 --no-save

      - name: Apply migration (Staging only)
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          DATABASE_URL_SECRET: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: https://cfccwysniduwkjskiqgy.supabase.co
        run: |
          export DATABASE_URL="${STAGING_DATABASE_URL:-$DATABASE_URL_SECRET}"
          if [ -z "$DATABASE_URL" ]; then
            echo "FAIL: missing secret STAGING_DATABASE_URL / DATABASE_URL"
            echo "Add the Staging Postgres URI as a GitHub Actions secret, then re-run."
            exit 2
          fi
          node scripts/apply-boss-companion-relations.mjs
