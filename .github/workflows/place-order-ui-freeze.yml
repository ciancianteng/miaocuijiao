name: Place-order UI freeze (MCJ-PLACE-ORDER-UI-APPROVED-V1)

on:
  pull_request:
  push:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  freeze-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Offline UI freeze contract
        run: node scripts/verify-place-order-ui-freeze.mjs
      - name: Fail if approved baselines are deleted
        run: |
          set -euo pipefail
          test -s docs/ui-baselines/MCJ-PLACE-ORDER-UI-APPROVED-V1/desktop.png
          test -s docs/ui-baselines/MCJ-PLACE-ORDER-UI-APPROVED-V1/mobile-390.png
          test -s docs/ui-baselines/MCJ-PLACE-ORDER-UI-APPROVED-V1/MANIFEST.md
          test -s .cursor/rules/place-order-ui-approved-v1.mdc
          echo "OK baselines + freeze rule"
