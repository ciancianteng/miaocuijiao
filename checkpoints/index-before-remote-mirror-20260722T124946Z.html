r;background:rgba(2,1,4,.76);backdrop-filter:blur(12px);padding:20px}.modal.open{display:grid}.dialog{width:min(520px,100%);border:1px solid var(--line2);border-radius:18px;background:linear-gradient(180deg,rgba(22,14,27,.98),rgba(8,6,12,.98));box-shadow:0 28px 90px rgba(0,0,0,.62);padding:24px}.close{float:right;width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:#fff;font-size:22px}.login-action{height:48px;border:0;border-radius:12px;background:linear-gradient(180deg,#ffe0ef,#ff83bf);color:#1b0712;font-weight:1000;padding:0 18px}.muted{color:var(--muted);line-height:1.7}.is-logged-in [data-login]{display:none}@media(max-width:1100px){.topbar-inner,.hero-shell,.notice,.quick-area{width:min(100% - 32px,1420px)}.hero-card{grid-template-columns:1fr;padding:34px}.hero-art{margin-top:30px}.quick-area{grid-template-columns:1fr}.quick-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.butler{justify-self:start}}@media(max-width:640px){.topbar{height:auto}.topbar-inner{padding:14px 0;flex-wrap:wrap}.brand-logo{width:56px;height:56px}.brand-title strong{font-size:19px}.nav{width:100%;overflow-x:auto;gap:10px}.nav a,.nav button{height:48px;min-width:76px;font-size:15px}.hero-shell{margin-top:24px}.hero-card{padding:24px;min-height:0}.hero-copy h1{font-size:34px}.hero-copy .subtitle{font-size:19px}.checks{grid-template-columns:1fr;gap:12px}.checks span{font-size:17px}.actions{flex-direction:column}.hero-btn{height:58px;width:100%}.hero-art{min-height:210px}.notice{height:auto;grid-template-columns:1fr;gap:8px;padding:12px}.notice-label{padding-left:0}.notice-text{text-align:left;font-size:18px}.notice-more{margin:0;width:max-content;padding:0 14px}.quick-grid{grid-template-columns:1fr}.quick-card{width:100%}}
